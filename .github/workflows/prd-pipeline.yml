name: PRD pipeline

on:
  pull_request:
    branches: [dev, main]
    paths:
      - "prds/*.md"
  push:
    branches: [main]
    paths:
      - "prds/*.md"
  workflow_dispatch:
    inputs:
      prd:
        description: "PRD path, for example prds/01-y-score-framework.md"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: prd-pipeline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out pull request
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - name: Validate changed PRD paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r path; do
            [[ -z "$path" ]] && continue
            found=1
            [[ "$path" =~ ^prds/[A-Za-z0-9._-]+\.md$ ]] || { echo "Invalid PRD path" >&2; exit 1; }
            [[ -f "$path" ]] || { echo "PRD file missing" >&2; exit 1; }
            grep -qiE '^##[[:space:]]+Problem' "$path" || { echo "PRD missing required section: Problem ($path)" >&2; exit 1; }
            grep -qE '(^|[[:space:]])Given([[:space:]]|:)|\*\*Given\*\*' "$path" || { echo "PRD missing Gherkin acceptance criteria (Given) ($path)" >&2; exit 1; }
            grep -qiE '\b(metric|KPI|target|baseline)\b' "$path" || { echo "PRD missing success metric keywords ($path)" >&2; exit 1; }
          done < <(git diff --name-only --diff-filter=ACMRT "$BASE_SHA" "$HEAD_SHA" -- prds/)
          [[ "$found" -eq 1 ]] || { echo "No changed PRD found" >&2; exit 1; }

  trusted-run:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out trusted revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 2
      - name: Select and validate PRD
        env:
          INPUT_PRD: ${{ inputs.prd }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            prd="$INPUT_PRD"
          else
            prd="$(git diff --name-only --diff-filter=ACMRT "$BEFORE_SHA" "$GITHUB_SHA" -- prds/ | head -n 1)"
          fi
          [[ "$prd" =~ ^prds/[A-Za-z0-9._-]+\.md$ ]] || { echo "Invalid PRD path" >&2; exit 1; }
          [[ -f "$prd" ]] || { echo "PRD file missing" >&2; exit 1; }
          grep -qiE '^##[[:space:]]+Problem' "$prd" || { echo "PRD missing required section: Problem" >&2; exit 1; }
          grep -qiE '^##[[:space:]]+Target[[:space:]]+User' "$prd" || { echo "PRD missing required section: Target user(s)" >&2; exit 1; }
          echo "PRD validation passed: $prd"

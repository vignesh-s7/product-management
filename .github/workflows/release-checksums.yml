name: Release checksums

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-checksums-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checksums:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out tag
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate skills checksum manifest
        run: npm run checksums
      - name: Upload checksum manifest
        uses: actions/upload-artifact@6b51b1b2bcc25b05cfc2c818ac8cccac0785b646
        with:
          name: skills-checksums
          path: checksums/SKILLS.sha256
          retention-days: 90

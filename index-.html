    function commandPaletteCatalog() {
      const apps = [{ kind: 'app', id: 'app-pi-gen', label: 'Ask π Gen', workspace: 'Shared', detail: 'Product guidance and reviewable changes', icon: 'sparkles', keywords: 'assistant ai prompt guidance proposals' }];
      const routes = PI_COMMAND_ROUTES.map(function(route) {
        return Object.assign({ kind: 'route', id: 'route-' + route.page }, route);
      });
      const seen = new Set();
      const products = (Array.isArray(pbState.products) ? pbState.products : []).reduce(function(items, product) {
        const productId = String(product.product_id || '');
        if (!productId || seen.has(productId)) return items;
        seen.add(productId);
        const facts = [product.type, product.lifecycle_phase, product.status, product.revision != null ? 'revision ' + product.revision : ''].filter(Boolean).map(String);
        items.push({
          kind: 'product',
          id: 'product-' + productId,
          productId,
          label: String(product.name || 'Unnamed product'),
          workspace: 'Product',
          detail: facts.join(' · ') || 'Local product record',
          icon: 'layout-dashboard',
          keywords: productId + ' ' + facts.join(' ')
        });
        return items;
      }, []);
      return apps.concat(routes, products);
    }

    function commandPaletteMatches(query) {
      const catalog = commandPaletteCatalog();
      const normalized = String(query || '').toLocaleLowerCase().replace(/\s+/g, ' ').trim();
      if (!normalized) {
        const workspace = currentWorkspacePart();
        const workspaceLabel = workspace === 'foundation' ? 'Foundation' : workspace === 'admin' ? 'Admin' : 'Product';
        const products = catalog.filter(function(item) { return item.kind === 'product'; }).slice(0, 4);
        const routes = catalog.filter(function(item) { return item.kind === 'route' && item.workspace === workspaceLabel; }).slice(0, 8);
        const apps = catalog.filter(function(item) { return item.kind === 'app'; });
        return apps.concat(products, routes).slice(0, 12);
      }
      const tokens = normalized.split(' ');
      return catalog.map(function(item) {
        const label = item.label.toLocaleLowerCase();
        const workspace = item.workspace.toLocaleLowerCase();
        const haystack = [label, workspace, item.detail, item.keywords || '', item.productId || ''].join(' ').toLocaleLowerCase();
        if (!tokens.every(function(token) { return haystack.includes(token); })) return null;
        const score = label === normalized ? 0 : label.startsWith(normalized) ? 1 : label.includes(normalized) ? 2 : workspace.startsWith(normalized) ? 3 : item.kind === 'product' ? 4 : 5;
        return { item, score };
      }).filter(Boolean).sort(function(a, b) {
        return a.score - b.score || a.item.label.localeCompare(b.item.label);
      }).slice(0, 16).map(function(match) { return match.item; });
    }

    function setCommandPaletteActive(index) {
      const input = document.getElementById('command-palette-input');
      const options = Array.from(document.querySelectorAll('#command-palette-results .command-palette-option'));
      if (!options.length) {
        commandPaletteActiveIndex = -1;
        if (input) input.removeAttribute('aria-activedescendant');
        return;
      }
      commandPaletteActiveIndex = (index + options.length) % options.length;
      options.forEach(function(option, optionIndex) {
        const active = optionIndex === commandPaletteActiveIndex;
        option.classList.toggle('is-active', active);
        option.setAttribute('aria-selected', String(active));
      });
      const activeOption = options[commandPaletteActiveIndex];
      if (input && activeOption) input.setAttribute('aria-activedescendant', activeOption.id);
      if (activeOption) activeOption.scrollIntoView({ block: 'nearest' });
    }

    function renderCommandPaletteResults() {
      const input = document.getElementById('command-palette-input');
      const results = document.getElementById('command-palette-results');
      const status = document.getElementById('command-palette-status');
      if (!input || !results) return;
      commandPaletteItems = commandPaletteMatches(input.value);
      commandPaletteActiveIndex = commandPaletteItems.length ? 0 : -1;
      results.replaceChildren();
      if (!commandPaletteItems.length) {
        const empty = document.createElement('div');
        empty.className = 'command-palette-empty';
        empty.setAttribute('role', 'status');
        empty.textContent = 'No matching app, route, or product. Try π Gen, a workspace, stage, or product name.';
        results.appendChild(empty);
        input.removeAttribute('aria-activedescendant');
        if (status) status.textContent = 'No matches.';
        return;
      }
      const fragment = document.createDocumentFragment();
      commandPaletteItems.forEach(function(item, index) {
        const option = document.createElement('button');
        option.type = 'button';
        option.id = 'command-palette-option-' + index;
        option.className = 'command-palette-option' + (index === 0 ? ' is-active' : '');
        option.setAttribute('role', 'option');
        option.setAttribute('aria-selected', String(index === 0));
        option.tabIndex = -1;

        const icon = document.createElement('span');
        icon.className = 'command-palette-option-icon';
        icon.innerHTML = localIcon(item.icon);
        const copy = document.createElement('span');
        copy.className = 'command-palette-option-copy';
        const label = document.createElement('strong');
        label.textContent = item.label;
        const detail = document.createElement('small');
        const visibleWorkspace = { Foundation: 'Frame idea', Product: 'Design product', Admin: 'Advanced', Shared: 'Shared' }[item.workspace] || item.workspace;
        detail.textContent = visibleWorkspace + ' · ' + item.detail;
        copy.appendChild(label);
        copy.appendChild(detail);
        const kind = document.createElement('span');
        kind.className = 'command-palette-kind';
        kind.textContent = item.kind === 'product' ? 'Product' : item.kind === 'app' ? 'App' : 'Route';
        option.appendChild(icon);
        option.appendChild(copy);
        option.appendChild(kind);
        option.addEventListener('mouseenter', function() { setCommandPaletteActive(index); });
        option.addEventListener('click', function() { executeCommandPaletteItem(item); });
        fragment.appendChild(option);
      });
      results.appendChild(fragment);
      setCommandPaletteActive(0);
      if (status) status.textContent = commandPaletteItems.length + (commandPaletteItems.length === 1 ? ' match.' : ' matches.') + ' Local session only.';
    }

    function openCommandPalette() {
      const backdrop = document.getElementById('command-palette-backdrop');
      const input = document.getElementById('command-palette-input');
      const trigger = document.getElementById('global-search-trigger');
      if (!backdrop || !input) return;
      if (!backdrop.hidden) { input.focus(); input.select(); return; }
      closeAppLauncher(false);
      commandPaletteReturnFocus = document.activeElement;
      commandPalettePreviousOverflow = document.body.style.overflow;
      document.body.style.overflow = 'hidden';
      backdrop.hidden = false;
      input.value = '';
      input.setAttribute('aria-expanded', 'true');
      if (trigger) trigger.setAttribute('aria-expanded', 'true');
      renderCommandPaletteResults();
      window.requestAnimationFrame(function() { input.focus(); });
    }

    function closeCommandPalette(restoreFocus) {
      const backdrop = document.getElementById('command-palette-backdrop');
      const input = document.getElementById('command-palette-input');
      const trigger = document.getElementById('global-search-trigger');
      if (!backdrop || backdrop.hidden) return;
      backdrop.hidden = true;
      document.body.style.overflow = commandPalettePreviousOverflow;
      if (input) {
        input.setAttribute('aria-expanded', 'false');
        input.removeAttribute('aria-activedescendant');
      }
      if (trigger) trigger.setAttribute('aria-expanded', 'false');
      if (restoreFocus && commandPaletteReturnFocus && commandPaletteReturnFocus.focus) commandPaletteReturnFocus.focus();
      commandPaletteReturnFocus = null;
    }

    function closeCommandPaletteOnBackdrop(event) {
      if (event && event.target === event.currentTarget) closeCommandPalette(true);
    }

    function executeCommandPaletteItem(item) {
      if (!item) return;
      closeCommandPalette(false);
      if (item.kind === 'product') {
        const exists = pbState.products.some(function(product) { return String(product.product_id || '') === item.productId; });
        if (!exists) { showToast('Product is no longer available'); return; }
        void pbOpenProduct(item.productId);
        return;
      }
      if (item.kind === 'app') {
        toggleAIPanel(true);
        return;
      }
      if (!PIF_PRIMARY_PAGES.includes(item.page)) { showToast('Route is unavailable'); return; }
      navigateTo(item.page);
    }

    function handleCommandPaletteKeydown(event) {
      if (event.key === 'Escape') {
        event.preventDefault();
        event.stopPropagation();
        closeCommandPalette(true);
        return;
      }
      if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
        event.preventDefault();
        const next = event.key === 'ArrowDown' ? commandPaletteActiveIndex + 1 : commandPaletteActiveIndex - 1;
        setCommandPaletteActive(next);
        return;
      }
      if (event.key === 'Enter' && commandPaletteActiveIndex >= 0) {
        event.preventDefault();
        executeCommandPaletteItem(commandPaletteItems[commandPaletteActiveIndex]);
        return;
      }
      if (event.key === 'Tab') {
        const input = document.getElementById('command-palette-input');
        const close = document.getElementById('command-palette-close');
        if (event.shiftKey && document.activeElement === input) { event.preventDefault(); close.focus(); }
        else if (!event.shiftKey && document.activeElement === close) { event.preventDefault(); input.focus(); }
      }
    }

    document.addEventListener('keydown', function(event) {
      if ((event.metaKey || event.ctrlKey) && event.key.toLocaleLowerCase() === 'k') {
        event.preventDefault();
        openCommandPalette();
      }
    });

    document.addEventListener('click', function(event) {
      const wrapper = document.querySelector('.app-launcher-wrap');
      if (wrapper && !wrapper.contains(event.target)) closeAppLauncher(false);
    });

    function navigateTo(pageId, options) {
      const routeOptions = options || {};
      if (!PIF_PRIMARY_PAGES.includes(pageId)) {
        showToast('Route is unavailable');
        return;
      }
      if (!routeOptions.skipDraftCapture && typeof pbCaptureVisibleDraft === 'function') pbCaptureVisibleDraft();
      appState.currentPage = pageId;
      const groupByPage = {
        problem: 'Discover', context: 'Discover', definition: 'Discover',
        actors: 'Model', requirements: 'Model', capabilities: 'Model',
        primitives: 'Compose', rules: 'Compose', workflow: 'Compose',
        cross_cutting: 'Govern', technology: 'Govern',
        blueprint: 'Deliver', export: 'Deliver'
      };
      if (groupByPage[pageId]) {
        Object.keys(appState.expandedGroups || {}).forEach(key => { appState.expandedGroups[key] = key === groupByPage[pageId]; });
      }
      if (isMobileViewport()) {
        closeSidebar();
      }
      renderApp();
      syncMobileTabs(pageId);
      saveState();
      window.scrollTo(0, 0);
      const workspace = document.getElementById('main-workspace');
      if (workspace) workspace.scrollTop = 0;
      window.requestAnimationFrame(function() { if (workspace) workspace.scrollTop = 0; });
    }

    function syncMobileTabs(pageId) {
      const mobileTabs = document.getElementById('mobile-tab-bar');
      if (mobileTabs) mobileTabs.hidden = !PI_PRODUCT_PAGES.includes(pageId);
      const tabMap = {
        pb_portfolio: 'mob-tab-home',
        discover: 'mob-tab-discover', research: 'mob-tab-discover', define: 'mob-tab-discover',
        solution: 'mob-tab-discover', gtm: 'mob-tab-discover',
        readiness: 'mob-tab-readiness', copilot: 'mob-tab-copilot'
      };
      document.querySelectorAll('.mob-tab').forEach(t => t.classList.remove('active'));
      const activeId = tabMap[pageId];
      if (activeId) {
        const el = document.getElementById(activeId);
        if (el) el.classList.add('active');
      }
    }

    async function selectProduct(productId) {
      const result = await apiPost('/api/products/open', { product_id: productId });
      if (result._err) { showToast('Product could not be opened'); return; }
      appState.aiPendingClarificationByProduct = {};
      pbState.activeProductId = productId;
      if (result.record) {
        pbSession(productId).record = result.record;
        const index = pbState.products.findIndex(function(item) { return item.product_id === productId; });
        if (index >= 0) pbState.products[index] = result.record;
        else pbState.products.push(result.record);
      }
      syncFoundationRegistry();
      navigateTo('overview');
    }

    function toggleTheme() {
      appState.theme = appState.theme === "light" ? "dark" : "light";
      document.documentElement.setAttribute("data-theme", appState.theme);
      const icon = document.getElementById("theme-icon");
      if (icon) { icon.dataset.icon = appState.theme === "light" ? "moon" : "sun"; icon.innerHTML = localIcon(icon.dataset.icon); }
      saveState();
    }

    function toggleAIPanel(forceState) {
      if (typeof forceState === "boolean") {
        appState.aiPanelOpen = forceState;
      } else {
        appState.aiPanelOpen = !appState.aiPanelOpen;
      }

      const shell = document.getElementById("app-shell");
      const aiSidebar = document.getElementById("ai-sidebar");
      const aiBackdrop = document.getElementById("ai-backdrop");
      const aiToggleBtn = document.getElementById("ai-panel-open-btn") || document.getElementById("ai-toggle-btn");

      if (appState.aiPanelOpen) {
        if (typeof renderAIPanel === 'function') renderAIPanel(typeof activeCopilotProduct === 'function' ? activeCopilotProduct() : getActiveProduct());
        if (isMobileViewport()) closeSidebar();
        if (shell) shell.classList.remove("ai-closed");
        if (aiSidebar) aiSidebar.classList.add("open");
        if (aiBackdrop && isMobileViewport()) aiBackdrop.classList.add("open");
        if (aiToggleBtn) aiToggleBtn.setAttribute("aria-expanded", "true");
      } else {
        if (shell) shell.classList.add("ai-closed");
        if (aiSidebar) aiSidebar.classList.remove("open");
        if (aiBackdrop) aiBackdrop.classList.remove("open");
        if (aiToggleBtn) {
          aiToggleBtn.setAttribute("aria-expanded", "false");
          aiToggleBtn.focus();
        }
      }
      applyAIDisplayMode();
      saveState();
      if (appState.aiPanelOpen) {
        window.requestAnimationFrame(function() {
          const target = document.getElementById('ai-input-field') || document.querySelector('#ai-sidebar [role="tab"][aria-selected="true"]');
          if (target) target.focus();
        });
      }
    }

    function setAIMode(mode) {
      appState.aiRunMode = mode === 'fast' ? 'fast' : 'normal';
      const product = activeCopilotProduct();
      const productKey = product ? (product.product_id || product.id || 'default') : 'default';
      if (appState.aiPendingClarificationByProduct) delete appState.aiPendingClarificationByProduct[productKey];
      renderAIPanel(activeCopilotProduct());
      window.requestAnimationFrame(function() { document.getElementById('ai-run-mode')?.focus(); });

    function applyAIDisplayMode() {
      const sidebar = document.getElementById('ai-sidebar');
      if (!sidebar) return;
      const expanded = appState.aiPanelOpen === true && appState.aiExpanded === true && window.innerWidth >= 768;
      sidebar.classList.toggle('ai-full', expanded);
      sidebar.setAttribute('aria-modal', expanded ? 'true' : 'false');
      const workspace = document.getElementById('main-workspace');
      if (workspace) workspace.inert = expanded;
    }

    function toggleAIFullscreen(forceState) {
      appState.aiExpanded = typeof forceState === 'boolean' ? forceState : appState.aiExpanded !== true;
      renderAIPanel(activeCopilotProduct());
      applyAIDisplayMode();
      window.requestAnimationFrame(function() { document.querySelector('#ai-sidebar .ai-display-toggle')?.focus(); });

        const isOpen = sb && sb.classList.contains("open");
        if (isOpen) {
          closeSidebar();
        } else {
          openSidebar();
        }

        appState.sidebarOpen = !appState.sidebarOpen;
        applySidebarState();
        saveState();
      }

    function openSidebar() {
      const sb = document.getElementById("left-sidebar");
      const backdrop = document.getElementById("sidebar-backdrop");
      const trigger = document.getElementById("mobile-sidebar-trigger");

      if (appState.aiPanelOpen && isMobileViewport()) toggleAIPanel(false);

      renderSidebarNav();

      if (sb) sb.classList.add("open");
      if (backdrop) backdrop.classList.add("open");
      if (trigger) trigger.setAttribute("aria-expanded", "true");

      if (isMobileViewport()) {
        document.body.style.overflow = "hidden";

      const closeBtn = sb ? sb.querySelector(".sidebar-close-btn") : null;

    function closeSidebar() {
      const sb = document.getElementById("left-sidebar");
      const backdrop = document.getElementById("sidebar-backdrop");
      const trigger = document.getElementById("mobile-sidebar-trigger");

      if (sb) sb.classList.remove("open");
      if (backdrop) backdrop.classList.remove("open");
      if (trigger) {
        trigger.setAttribute("aria-expanded", "false");
        trigger.focus();
      }

      document.body.style.overflow = "";
    }

    function applySidebarState() {
      const shell = document.getElementById("app-shell");
      if (!shell) return;
      if (appState.sidebarOpen === false) {
        shell.classList.add("sidebar-closed");
      } else {
        shell.classList.remove("sidebar-closed");
      }
      const trigger = document.getElementById("sidebar-toggle-trigger");
      if (trigger) {
        trigger.setAttribute("title", appState.sidebarOpen ? "Collapse navigation" : "Expand navigation");
        trigger.setAttribute("aria-label", appState.sidebarOpen ? "Collapse navigation" : "Expand navigation");
        trigger.setAttribute("aria-expanded", appState.sidebarOpen ? "true" : "false");
        trigger.innerHTML = localIcon(appState.sidebarOpen ? "layout-sidebar-left-collapse" : "layout-sidebar-left-expand");
      }

      toggleSidebar();
    }

    function toggleMobileSidebar() {

    }

    // Keydown listener for Escape key to close drawers
    window.addEventListener("keydown", (e) => {
      if (e.key === "Escape") {
        const createDialog = document.getElementById('pb-create-form');
        if (createDialog && !createDialog.hidden) { pbHideCreateProduct(); return; }
        closeSidebar();
        if (appState.aiPanelOpen) {
          toggleAIPanel(false);
        }
      }
      if (e.key === 'Tab') {
        const createDialog = document.getElementById('pb-create-form');
        if (createDialog && !createDialog.hidden) {
          const focusable = Array.from(createDialog.querySelectorAll('button:not([disabled]), input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])'));
          if (focusable.length) {
            const first = focusable[0], last = focusable[focusable.length - 1];
            if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
            else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
          }

      }

    function showSaveIndicator(text) {
      const pill = document.getElementById("cloud-sync-pill") || document.querySelector(".save-status-pill");
      if (pill) {

    function deleteProduct(id) {
      if (appState.products.length <= 1) {
        showToast("Cannot delete the only product blueprint in workspace");
        return;

      if (confirm("Delete this product blueprint from local prototype state?")) {
        appState.products = appState.products.filter(item => item.id !== id);

        if (FEATURE_FLAGS.externalPersistence) {

        case 'cross_cutting':
          return groups.cross_cutting ?

            { status: 'incomplete', icon: '<span class="icon" data-icon="circle" style="color:rgba(255,255,255,0.3)" aria-hidden="true">○</span>' };
        case 'technology':
          return groups.technology ? 
            { status: 'complete', icon: '<span class="icon" data-icon="circle-check" style="color:#4C7A5E" aria-hidden="true">✓</span>' } : 
            { status: 'incomplete', icon: '<span class="icon" data-icon="circle" style="color:rgba(255,255,255,0.3)" aria-hidden="true">○</span>' };
        case 'blueprint':
          return calculateCompletion(prod) >= 70 ?
            { status: 'warning', icon: '<span class="icon" data-icon="circle-exclamation" style="color:#B8791A" aria-hidden="true">!</span>' } :
            { status: 'incomplete', icon: '<span class="icon" data-icon="circle" aria-hidden="true"></span>' };
        case 'export':
          return { status: 'incomplete', icon: '<span class="icon" data-icon="circle" aria-hidden="true"></span>' };
        default:
          return { status: 'incomplete', icon: '<span class="icon" data-icon="circle" style="color:rgba(255,255,255,0.3)" aria-hidden="true">○</span>' };
      }
    }

    function prependFoundationBreadcrumb(container, product, pageId) {
      if (!container || !product) return;

        overview: 'Overview', problem: 'Problem', context: 'Context', definition: 'Definition',

        primitives: 'Primitives & objects', rules: 'Rules', workflow: 'Workflow',

      breadcrumb.setAttribute('aria-label', 'Breadcrumb');
      ['Products', product.name || 'Unnamed product', 'Frame idea', labels[pageId] || 'Overview'].forEach(function(label, index) {

    let foundationDialogReturnFocus = null;

    function activateFoundationDialog(root) {
      const dialog = root && root.querySelector('.modal-container, .drawer-container');
      if (!dialog) return;
      foundationDialogReturnFocus = document.activeElement;
      dialog.setAttribute('role', 'dialog');
      dialog.setAttribute('aria-modal', 'true');
      const heading = dialog.querySelector('h1, h2, h3');
      if (heading) {
        if (!heading.id) heading.id = 'foundation-dialog-title-' + Date.now();
        dialog.setAttribute('aria-labelledby', heading.id);
      }
      Array.from(dialog.querySelectorAll('input, select, textarea')).forEach(function(control, index) {
        if (!control.id) control.id = 'foundation-dialog-field-' + index;
        const group = control.closest('.form-group');
        const label = group && group.querySelector('label');
        if (label && !label.htmlFor) label.htmlFor = control.id;
      });
      dialog.addEventListener('keydown', function(event) {
        if (event.key === 'Escape') {
          event.preventDefault();
          dialog.classList.contains('drawer-container') ? closeDrawer() : closeModal();
          return;
        }
        if (event.key !== 'Tab') return;
        const focusable = Array.from(dialog.querySelectorAll('button:not([disabled]), input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [href], [tabindex]:not([tabindex="-1"])')).filter(function(item) { return !item.hidden; });
        if (!focusable.length) return;
        const first = focusable[0];
        const last = focusable[focusable.length - 1];
        if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
        else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
      });
      const shell = document.getElementById('app-shell');
      if (shell) shell.inert = true;
      window.requestAnimationFrame(function() {
        const target = dialog.querySelector('input:not([disabled]), textarea:not([disabled]), select:not([disabled]), button:not([disabled])');
        if (target) target.focus();
      });
    }

    function restoreFoundationDialogFocus() {
      const shell = document.getElementById('app-shell');
      if (shell) shell.inert = false;
      const target = foundationDialogReturnFocus;
      foundationDialogReturnFocus = null;
      if (target && target.isConnected && target.focus) target.focus();
    }

    function closeModal() {
      document.getElementById("modal-root").innerHTML = "";
      restoreFoundationDialogFocus();
    }

    function saveContextModal() {
      const p = getActiveProduct();
      if (!p.context) p.context = [];
      const type = document.getElementById("ctx-type").value;
      const description = document.getElementById("ctx-desc").value.trim();
      const source = document.getElementById("ctx-source").value.trim() || "Not provided";
      if (!description) { showToast('Add context description'); return; }
      const entry = {
        id: "c-" + Date.now(),
        type,
        description,
        source,
        confidence: "Unverified",
        importance: "Not rated"
      };
      if (p._canonicalProductId) {
        const session = pbSession(p._canonicalProductId);
        const target = type === 'Business Rule' || type === 'Regulation' ? 'constraints' : 'evidence';
        const current = session.discoverDraft[target] || '';
        session.discoverDraft[target] = [current, description + ' (Source: ' + source + ')'].filter(Boolean).join('\n');
        session.dirty = true;
        pbInvalidateFrom('discover');
        syncFoundationRegistry();
      } else {
        p.context.push(entry);
      }
      saveState();
      closeModal();
      renderApp();
      showToast("Added operational context entry");
    }

    function removeContext(id) {
      const p = getActiveProduct();
      if (p._canonicalProductId && (id === 'shared-evidence' || id === 'shared-constraints')) {
        const session = pbSession(p._canonicalProductId);
        session.discoverDraft[id === 'shared-evidence' ? 'evidence' : 'constraints'] = '';

        pbInvalidateFrom('discover');
        syncFoundationRegistry();
      } else {
        p.context = p.context.filter(c => c.id !== id);
      }
      saveState();
      renderApp();
    }

    function renderDiffProposalCard(proposal) {

    }

    function getProductAIChat(productId) {
      if (window.PIFCore && window.PIFCore.getProductAIChat) {
        if (!appState.aiChatByProduct) appState.aiChatByProduct = {};
        const id = productId || appState.currentProductId || 'default';
        return window.PIFCore.getProductAIChat(appState.aiChatByProduct, id, appState.aiChatMessages);
      }
      if (!appState.aiChatByProduct) appState.aiChatByProduct = {};
      const id = productId || appState.currentProductId || 'default';
      if (!appState.aiChatByProduct[id]) {
        // Fallback to legacy messages if available for initial migration
        if (appState.aiChatMessages && appState.aiChatMessages.length > 0) {
          appState.aiChatByProduct[id] = [...appState.aiChatMessages];
        } else {
          appState.aiChatByProduct[id] = [
            {
              id: "msg-init-" + id,
              sender: "assistant",
              timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
              text: "Ask about this product. I can explain gaps, suggest next steps, and prepare changes for your review."
            }
          ];
        }
      }
      return appState.aiChatByProduct[id];
    }

    function clearAIChat() {
      if (confirm("Clear π Gen conversation for this product?")) {
        const selected = activeCopilotProduct();
        const id = selected ? (selected.product_id || selected.id || 'default') : 'default';
        if (aiResponseTimers[id]) { window.clearTimeout(aiResponseTimers[id]); delete aiResponseTimers[id]; }
        appState.aiProcessingByProduct[id] = false;
        if (!appState.aiChatByProduct) appState.aiChatByProduct = {};
        appState.aiChatByProduct[id] = [

            sender: "assistant",
            timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),

          }
        ];
        if (appState.aiPendingClarificationByProduct) delete appState.aiPendingClarificationByProduct[id];
        if (appState.aiStagedImageByProduct) delete appState.aiStagedImageByProduct[id];
        saveState();
        const activeProd = selected;
        renderAIPanel(activeProd);
        showToast("π Gen conversation cleared");
      }
    }

    function aiCancelClarification() {
      const product = activeCopilotProduct();
      const productKey = product ? (product.product_id || product.id || 'default') : 'default';
      if (appState.aiPendingClarificationByProduct) delete appState.aiPendingClarificationByProduct[productKey];
      const messages = getProductAIChat(productKey);
      for (let index = messages.length - 1; index >= 0; index -= 1) {
        const answer = messages[index] && messages[index].answer;
        if (!answer || !answer.clarifyingQuestion) continue;
        answer.clarifyingQuestion = '';
        answer.recommendation = 'Question cleared. Ask again when ready.';
        answer.nextDecision = 'Describe decision you want help with.';
        break;
      }
      saveState();
      renderAIPanel(product);
      showToast('Clarifying question cleared');
    }

    function handleAIChatKeydown(e) {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        const product = activeCopilotProduct();
        const productKey = product ? (product.product_id || product.id || 'default') : 'default';
        if (!appState.aiProcessingByProduct?.[productKey]) sendAIChat();
      }
    }

    function updateAIComposerState() {

        const product = activeCopilotProduct();
        const productKey = product ? (product.product_id || product.id || 'default') : 'default';

        const processing = appState.aiProcessingByProduct?.[productKey] === true;

    function aiStopResponse(productKey) {
      const key = String(productKey || 'default');
      if (aiResponseTimers[key]) {
        window.clearTimeout(aiResponseTimers[key]);
        delete aiResponseTimers[key];
      }
      if (!appState.aiProcessingByProduct?.[key]) return;
      appState.aiProcessingByProduct[key] = false;

        timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),

    }

    function aiStageImage(event) {
      const input = event && event.target;
      const file = input && input.files && input.files[0];
      if (!file) return;
      const allowedTypes = ['image/png', 'image/jpeg', 'image/webp'];
      if (!allowedTypes.includes(file.type)) {
        if (input) input.value = '';
        showToast('Choose PNG, JPEG, or WebP image');
        return;
      }
      if (file.size > 5 * 1024 * 1024) {
        if (input) input.value = '';
        showToast('Image must be 5 MB or smaller');
        return;
      }
      const product = activeCopilotProduct();
      const productKey = product ? (product.product_id || product.id || 'default') : 'default';
      if (!appState.aiStagedImageByProduct) appState.aiStagedImageByProduct = {};
      appState.aiStagedImageByProduct[productKey] = {
        kind: 'image',
        name: String(file.name || 'Local image').slice(0, 160),
        type: file.type,
        size: file.size
      };
      if (input) input.value = '';
      renderAIPanel(product);
      window.setTimeout(function() { document.getElementById('ai-input-field')?.focus(); }, 0);
      showToast('Image name staged; contents not read');
    }

    function aiAnswerPlainText(message) {
      if (!message) return '';
      const answer = message.answer;
      if (!answer) return String(message.text || '');
      const blocks = [];
      const add = function(label, value) {
        if (value == null || value === '' || (Array.isArray(value) && !value.length)) return;
        blocks.push(label + '\n' + (Array.isArray(value) ? value.map(function(item) { return '- ' + item; }).join('\n') : String(value)));
      };
      add('Action refused', answer.refusal);
      add('Recommendation', answer.recommendation);
      add('Plan', answer.plan);
      add('Evidence used', answer.evidenceUsed);
      add('Assumptions', answer.assumptions);
      add('Open questions', answer.unknowns);
      add('Contradictions', answer.contradictions);
      add('Confidence', answer.confidence);
      add('Next decision', answer.nextDecision);
      return blocks.join('\n\n');
    }

      const copy = aiAnswerPlainText(message);
      if (!copy || !navigator.clipboard) { showToast('Copy is unavailable'); return; }
      navigator.clipboard.writeText(copy).then(function() {
        showToast('π Gen response copied');
      }).catch(function() { showToast('Copy failed. Select response text manually.'); });

    function aiRetryResponse(messageId) {
      const product = activeCopilotProduct();
      const productKey = product ? (product.product_id || product.id || 'default') : 'default';
      const messages = getProductAIChat(productKey);
      const responseIndex = messages.findIndex(function(item) { return String(item.id) === String(messageId); });
      if (responseIndex < 0) return;
      let prompt = null;
      for (let index = responseIndex - 1; index >= 0; index -= 1) {
        if (messages[index]?.sender === 'user') { prompt = messages[index]; break; }
      }
      if (!prompt) { showToast('No earlier question to retry'); return; }
      const response = messages[responseIndex];
      const mode = response.answer?.mode || appState.aiRunMode;
      const answer = aiBuildAnswer(String(prompt.text || ''), product, pbSession(productKey), mode, '');
      if ((prompt.attachments || []).length) answer.assumptions.unshift('Image filename was staged only. π Gen did not read or inspect the file.');
      response.answer = answer;
      response.text = answer.recommendation;
      response.timestamp = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      if (!appState.aiPendingClarificationByProduct) appState.aiPendingClarificationByProduct = {};
      if (answer.clarifyingQuestion) appState.aiPendingClarificationByProduct[productKey] = { originalText: prompt.text, mode: mode };
      else delete appState.aiPendingClarificationByProduct[productKey];
      aiActivity(productKey, 'retry', 'Retried response with current local context');
      saveState();
      renderAIPanel(product);
      aiFocusResponseAction(messageId, 'retry');
      showToast('Response rebuilt with fixed local rules');

    function aiBuildAnswer(question, product, sourceSession, requestedMode, clarificationText) {
      const session = sourceSession || pbCurrentSession();
      const lower = question.toLowerCase();
      const mode = requestedMode === 'fast' ? 'fast' : 'normal';
      const context = aiContextItems(product, session);
      const stages = pbStageCompletion(session);
      const missing = stages.filter(function(stage) { return !stage.complete; });
      const readiness = session.results.readiness || {};
      const blockers = (readiness.blockers || readiness.missing_items || []).map(pbHumanLabel);
      const unknowns = (readiness.unknown_metrics || readiness.unknowns || []).map(pbHumanLabel);
      const approvals = (readiness.pending_approvals || readiness.approvals || []).filter(function(item) { return !!item && item.required !== false && String(item.status || 'PENDING').toUpperCase() !== 'APPROVED'; });
      const defineResult = session.results.define || {};
      const defineBlocked = (defineResult.gate_status || defineResult.status) === 'BLOCKED';
      const unresolvedGate = readiness.status === 'BLOCKED' || blockers.length > 0 || approvals.length > 0;
      const asksAboutApproval = /\b(who|what|when|how|which)\b.{0,36}\b(approve|approval)\b/i.test(question);
      const unsafeReadyClaim = /\b(mark|set|declare|force|pretend|say|claim)\b.{0,40}\b(ready|approved|complete)\b/i.test(question);
      const unsafeApproval = !asksAboutApproval && /\b(approve|accept|apply)\b.{0,40}\b(change|proposal|product|request)\b/i.test(question);
      const unsafeBypass = /\b(bypass|ignore|skip|override)\b.{0,36}\b(blocker|policy|approval|gate)\b/i.test(question);
      const unsafeGatedAction = unresolvedGate && (/\b(export|publish|ship|deploy|release|apply)\b.{0,50}\b(anyway|despite|ignore|without|even if)\b/i.test(question) || /\b(anyway|despite|ignore|without|even if)\b.{0,50}\b(export|publish|ship|deploy|release|apply)\b/i.test(question));
      const unsafe = unsafeReadyClaim || unsafeApproval || unsafeBypass || unsafeGatedAction;
      const scopeChecks = [
        ['Evidence review', /\b(evidence|research|source|contradiction)\b/i],
        ['Hypothesis review', /\bhypothesis\b/i],
        ['Definition review', /\b(definition|problem statement|vision)\b/i],
        ['Solution decision', /\b(solution|option|compare|prioriti[sz])\b/i],
        ['Launch planning', /\b(launch|market|gtm|channel|pricing|positioning)\b/i],
        ['Readiness review', /\b(ready|readiness|blocker|approval)\b/i],
        ['Handoff review', /\b(export|handoff|share|preview)\b/i]
      ];
      const matchedScopes = scopeChecks.filter(function(item) { return item[1].test(question); }).map(function(item) { return item[0]; });
      const intent = matchedScopes[0] || 'Next decision';
      const discover = session.discoverDraft || {};
      const coreMissing = [];
      if (!pbHasText(discover.problem) && !pbHasText(product?.problem?.statement)) coreMissing.push('problem to solve');
      if (!pbHasText(discover.users) && !pbHasText(product?.problem?.whoExperiences)) coreMissing.push('intended user');
      if (!pbHasText(discover.decision) && !pbHasText(product?.problem?.desiredOutcome)) coreMissing.push('desired measurable outcome');
      const vaguePrompt = /^(help|do it|continue|review this|plan it|what next)[.!?\s]*$/i.test(question.trim()) || (question.trim().split(/\s+/).length < 3 && matchedScopes.length === 0);
      const needsCoreContext = ['Evidence review','Hypothesis review','Definition review','Solution decision','Launch planning','Next decision'].includes(intent);
      let clarifyingQuestion = '';
      if (!unsafe && mode === 'normal' && !pbHasText(clarificationText)) {
        if (matchedScopes.length > 1) clarifyingQuestion = 'Which should I focus on first: ' + matchedScopes.slice(0, 3).join(', ') + '?';
        else if (vaguePrompt) clarifyingQuestion = 'What product decision should I help you make?';
        else if (needsCoreContext && coreMissing.length) clarifyingQuestion = 'Describe ' + coreMissing.slice(0, 2).join(' and ') + '.';
      }
      if (pbHasText(clarificationText)) context.unshift({ path: 'chat.clarification', label: 'Clarification reply', value: clarificationText, display: String(clarificationText).slice(0, 180), provenance: 'Session chat · not saved', evidenceId: null });
      const contradictions = [];
      if (session.exportPreviewReady && (readiness.status === 'BLOCKED' || blockers.length)) contradictions.push('Handoff preview exists while decision readiness remains blocked.');
      if (session.results.gtm && Object.values(session.gtmDraft || {}).some(pbHasText)) contradictions.push('Session launch notes are visible, but current check uses saved plan only.');
      if (defineBlocked && pbHasText(session.defineDraft?.hypothesis)) contradictions.push('Editable hypothesis exists, but saved evidence link is blocked.');

      let recommendation = '';
      let nextDecision = '';
      let refusal = '';
      if (unsafe) {
        refusal = 'Cannot mark ready, approve, bypass policy, or export around unresolved gates. π Gen has no write authority.';
        recommendation = blockers.length ? 'Resolve first decision blocker: ' + blockers[0] + '.' : approvals.length ? 'Obtain required approval before any readiness or export claim.' : 'Run readiness assessment and review explicit gates first.';
      } else if (lower.includes('unknown')) {
        recommendation = unknowns.length ? 'Prioritize metric needing input: ' + unknowns[0] + '.' : 'No metric gap has been checked yet. Run readiness check before claiming completeness.';
      } else if (lower.includes('evidence') || lower.includes('contradiction')) {
        recommendation = contradictions.length ? 'Resolve contradiction before progressing: ' + contradictions[0] : context.length ? 'Review cited session fields and sample evidence; do not treat them as validated market facts.' : 'Add problem and intended-user context before asking for evidence-based guidance.';
      } else if (lower.includes('explain')) {
        recommendation = 'Use this step to turn current inputs into a reviewable draft outcome. Draft completion stays separate from decision, delivery, and approval readiness.';
      } else if (lower.includes('missing') || lower.includes('gap')) {
        recommendation = missing.length ? 'Complete next draft gap: ' + missing[0].label + '.' : blockers.length ? 'Draft workflow is prepared; resolve decision blocker: ' + blockers[0] + '.' : 'Draft workflow is prepared. Delivery and approval still require separate assessment.';
      } else {
        recommendation = defineBlocked ? 'Resolve Definition evidence link before comparing solutions.' : blockers.length ? 'Resolve first decision blocker: ' + blockers[0] + '.' : approvals.length ? 'Review pending approval before handoff.' : missing.length ? 'Complete next draft gap: ' + missing[0].label + '.' : 'Review handoff preview against audience and purpose; do not infer delivery readiness.';
      }
      nextDecision = defineBlocked ? 'Choose supported evidence-backed finding and revalidate Definition.' : blockers.length ? 'Assign evidence for ' + blockers[0] + '.' : approvals.length ? 'Seek explicit review for ' + pbHumanLabel(approvals[0]?.id || 'pending approval') + '.' : unknowns.length ? 'Set baseline, target, source, and timebox for ' + unknowns[0] + '.' : missing.length ? 'Prepare ' + missing[0].label + '.' : 'Decide whether preview is fit for intended audience.';
      const guidedPlan = [];
      if (clarifyingQuestion) guidedPlan.push('Clarify missing product context.');
      if (defineBlocked) guidedPlan.push('Resolve Definition evidence link.');
      else if (missing.length) guidedPlan.push('Prepare ' + missing[0].label + ' draft.');
      if (blockers.length) guidedPlan.push('Resolve decision blocker: ' + blockers[0] + '.');
      else if (unknowns.length) guidedPlan.push('Define metric evidence for ' + unknowns[0] + '.');
      if (!guidedPlan.length) guidedPlan.push('Review current evidence and choose next decision.');
      const plan = unsafe || clarifyingQuestion || mode === 'fast' ? [] : guidedPlan.slice(0, 3);
      const substantiveContext = context.filter(function(item) { return !['product.name','rules.draft_stages','rules.delivery','rules.external_model'].includes(item.path); });
      const evidenceUsed = substantiveContext.slice(0, 5).map(function(item) { return item.label + ': ' + item.display; });
      if (!evidenceUsed.length) evidenceUsed.push('No product fields selected.');
      if (clarifyingQuestion) {
        recommendation = 'Answer one question so guidance can use your product context.';
        nextDecision = 'Reply to clarifying question or clear it.';
      }
      const proposalTarget = /\bproblem statement\b/i.test(question) ? 'definition:problem_statement' : /\bvision\b/i.test(question) ? 'definition:vision' : /\bpositioning\b/i.test(question) ? 'gtm:positioning' : '';
      const linkedEvidenceIds = Array.from(new Set(substantiveContext.map(function(item) { return item.evidenceId; }).filter(Boolean)));
      return {
        mode,
        intent,
        clarifyingQuestion,
        plan,
        recommendation,
        evidenceUsed,
        assumptions: mode === 'fast' ? ['Uses current selected context only.'] : ['Session text is unverified user input.', 'Research uses sample local records.', 'No live model or external source was queried.'],
        unknowns: unknowns.length ? unknowns.slice(0, 6) : missing.length ? missing.slice(0, 4).map(function(stage) { return stage.label + ' draft remains incomplete'; }) : ['Delivery readiness and stakeholder approval have not been checked yet.'],
        contradictions: contradictions,
        confidence: substantiveContext.some(function(item) { return item.evidenceId; }) && substantiveContext.length >= 4 ? 'Medium-low · sample evidence and structured local context' : 'Low · limited or unverified local context',
        nextDecision,
        refusal,
        proposalTarget,
        linkedEvidenceIds,
        sourceFields: context,
        canPropose: mode === 'normal' && !unsafe && !clarifyingQuestion && !!proposalTarget && !!recommendation && linkedEvidenceIds.length > 0
      };
    }

    function sendAIChat(customText) {
      const input = document.getElementById("ai-input-field");
      const activeProd = activeCopilotProduct();
      const productKey = String(activeProd ? (activeProd.product_id || activeProd.id || 'default') : 'default');
      if (appState.aiProcessingByProduct?.[productKey]) return;
      const text = String(customText || (input ? input.value : "")).trim();
      if (!text) return;
      const requestedMode = appState.aiRunMode === 'fast' ? 'fast' : 'normal';

      if (input) input.value = "";
      const chatList = getProductAIChat(productKey);
      chatList.push({
        id: "msg-" + Date.now(),
        sender: "user",
        timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
        text: text
      });
      aiActivity(productKey, 'ask', text);
      appState.aiProcessingByProduct[productKey] = true;
      saveState();
      renderAIPanel(activeProd);

      // Deterministic in-page response. Delay exists only to expose Send/Stop state.
      aiResponseTimers[productKey] = window.setTimeout(function() {
        delete aiResponseTimers[productKey];
        if (!appState.aiProcessingByProduct?.[productKey]) return;
        const sourceSession = pbSession(productKey);
        if (!appState.aiPendingClarificationByProduct) appState.aiPendingClarificationByProduct = {};
        const pending = appState.aiPendingClarificationByProduct[productKey];
        const selectedMode = pending?.mode === 'fast' ? 'fast' : requestedMode;
        const interpretedText = pending ? pending.originalText + '\nClarification: ' + text : text;
        const answer = aiBuildAnswer(interpretedText, activeProd, sourceSession, selectedMode, pending ? text : '');
        if (answer.clarifyingQuestion) appState.aiPendingClarificationByProduct[productKey] = { originalText: text, mode: selectedMode };
        else delete appState.aiPendingClarificationByProduct[productKey];
        chatList.push({
          id: "msg-assistant-" + Date.now() + '-' + Math.random().toString(16).slice(2),
          sender: "assistant",
          timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
          text: answer.recommendation,
          answer: answer
        });
        appState.aiProcessingByProduct[productKey] = false;
        aiActivity(productKey, answer.refusal ? 'refusal' : answer.clarifyingQuestion ? 'question' : 'answer', answer.refusal || answer.clarifyingQuestion || answer.recommendation);
        saveState();
        const nowActive = activeCopilotProduct();
        const nowKey = String(nowActive ? (nowActive.product_id || nowActive.id || 'default') : 'default');
        if (nowKey === productKey) renderAIPanel(activeProd);
      }, 420);
    }

    function runParallelTasks() {
      const p = getActiveProduct();
      const tasks = getProductParallelTasks(p ? p.id : 'default');
      let dispatched = 0;

      tasks.forEach(task => {
        const depsMet = task.dependencies.every(depId => {
          const dep = tasks.find(t => t.id === depId);
          return dep && dep.status === "Complete";
        });

        if (depsMet && (task.status === "Queued" || task.status === "Blocked" || task.status === "Running")) {
          task.status = "Running";
          dispatched++;
        }
      });

      saveState();
      renderAIPanel(p);
      showToast(dispatched > 0 ? `Coordinator dispatched ${dispatched} parallel agent tasks ⚡` : "All eligible tasks are already running or completed.");

      if (dispatched > 0) {
        setTimeout(() => {
          let completedAny = false;
          tasks.forEach(task => {
            if (task.status === "Running") {
              task.status = "Review";
              if (task.id === "TSK-102") task.output = "Generated 8 REST CRUD endpoints with JSON validation.";
              if (task.id === "TSK-103") task.output = "Generated ABAC middleware & 12 security policy rules.";
              completedAny = true;
            }
          });

          tasks.forEach(task => {
            if (task.status === "Blocked") {
              const depsMet = task.dependencies.every(depId => {
                const dep = tasks.find(t => t.id === depId);
                return dep && (dep.status === "Complete" || dep.status === "Review");
              });
              if (depsMet) task.status = "Queued";
            }
          });

          saveState();
          renderAIPanel(p);
          if (completedAny) showToast("Parallel agent tasks finished! Review outputs ✓");
        }, 1500);
      }
    }

    function pauseParallelTasks() {
      const p = getActiveProduct();
      const tasks = getProductParallelTasks(p ? p.id : 'default');
      let count = 0;
      tasks.forEach(task => {
        if (task.status === "Running") {
          task.status = "Queued";
          count++;
        }
      });
      saveState();
      renderAIPanel(p);
      showToast(count > 0 ? "Paused running parallel tasks" : "No running tasks to pause");
    }

    function updateTaskAgent(taskId, newAgent) {
      const p = getActiveProduct();

    function aiContextItems(p, sourceSession) {
      const options = appState.aiContextOptions || {};
      const session = sourceSession || pbCurrentSession();
      const record = session.record || (pbState.bootstrapData && p && pbState.bootstrapData.product?.product_id === p.product_id ? pbState.bootstrapData.product : null);
      const items = [];
      const seen = new Set();
      const displayValue = function(value) {
        if (Array.isArray(value)) return value.length ? value.map(function(item) { return typeof item === 'object' ? pbReadableToken(item.id || item.kind || item.status || 'Item') : pbReadableToken(item); }).join(', ') : 'No items yet';
        if (value && typeof value === 'object') return JSON.stringify(value);
        if (value == null || value === '') return 'Not provided';
        return pbReadableToken(value);
      };
      const add = function(path, label, value, provenance, evidenceId) {
        if (seen.has(path)) return;
        if (value == null || value === '' || (Array.isArray(value) && value.length === 0)) return;
        seen.add(path);
        const raw = displayValue(value);
        items.push({ path: path, label: label, value: value, display: raw.length > 180 ? raw.slice(0, 177) + '...' : raw, provenance: provenance, evidenceId: evidenceId || null });
      };
      add('product.name', 'Product', p ? (p.name || 'Unnamed product') : 'No product selected', 'Local product record');

      const addDiscover = function() {
        const d = session.discoverDraft || {};
        add('discover.problem', 'Problem', d.problem, 'Session draft');
        add('discover.users', 'Intended user', d.users, 'Session draft');
        add('discover.evidence', 'Evidence note', d.evidence, 'Unverified session input');
        add('discover.constraints', 'Constraints', d.constraints, 'Session draft');
        add('discover.decision', 'Desired decision or outcome', d.decision, 'Session draft');
      };
      const addDefine = function() {
        const d = session.defineDraft || {};
        add('define.problem_statement', 'Problem statement', d.problemStatement, 'Session draft');
        add('define.hypothesis', 'Editable hypothesis', d.hypothesis, 'Session-only note');
        add('define.expected_outcome', 'Expected outcome', d.outcome, 'Session-only note');
        add('define.gate', 'Definition check', session.results.define?.gate_status || session.results.define?.status || 'Not checked yet', 'Local check');
      };
      const addResearch = function() {
        const r = session.results.research || {};
        add('research.status', 'Research status', r.status || 'Not checked yet', 'Sample research data');
        add('research.synthesis_gate', 'Evidence check', r.research?.synthesis_gate || 'Not checked yet', 'Sample research data');
        add('research.evidence_count', 'Evidence records', r.research?.evidence?.length || 0, 'Sample record count');
        (r.research?.evidence || []).slice(0, 5).forEach(function(item, index) {
          add('research.evidence.' + (item.id || index), pbHumanLabel(item.source_ref || 'Evidence ' + (index + 1)), item.observation, 'Sample evidence · confidence ' + (item.confidence == null ? 'not provided' : item.confidence), item.id || null);
        });
        (r.rankings?.ranked_problems || []).slice(0, 3).forEach(function(item, index) {
          add('research.problem.' + (item.id || index), 'Ranked problem ' + (index + 1), pbHumanLabel(item.id || 'Problem') + (item.score == null ? '' : ' · score ' + item.score), 'Fixed local ranking');
        });
        (r.research?.risks || []).slice(0, 3).forEach(function(item, index) {
          add('research.risk.' + (item.id || index), 'Research risk', item.description || item.name || pbHumanLabel(item.id || 'Risk'), 'Sample research finding');
        });
      };
      const addSolution = function() {
        add('solution.options', 'Solution options', (session.solutionDraft?.options || []).filter(pbHasText), 'Session draft');
        add('solution.method', 'Prioritization method', session.solutionDraft?.method || session.results.solution?.method, 'Session choice');
        add('solution.evidence_linked', 'Evidence-linked result', session.results.solution?.evidence_linked === true ? 'Yes' : 'Not confirmed', 'Local validator');
      };
      const addGtm = function() {
        const d = session.gtmDraft || {};
        add('gtm.audience', 'Target audience', d.audience, 'Session planning note');
        add('gtm.geography', 'Geography', d.geography, 'Session planning note');
        add('gtm.channels', 'Channels', d.channels, 'Session planning note');
        add('gtm.pricing', 'Pricing or adoption', d.pricing, 'Session planning note');
        add('gtm.budget', 'Budget', d.budget, 'Session planning note');
        add('gtm.launch_goal', 'Launch goal', d.launchGoal, 'Session planning note');
        add('gtm.timeframe', 'Timeframe', d.timeframe, 'Session planning note');
        add('gtm.validator_status', 'Saved launch-plan check', session.results.gtm?.status || 'Not checked yet', 'Local check; session notes not used');
      };
      const addReadiness = function() {
        const r = session.results.readiness || {};
        add('readiness.status', 'Decision readiness', r.status || 'Not checked yet', 'Local evidence check');
        add('readiness.score', 'Readiness check score', r.product_readiness_score == null ? 'Not checked yet' : Math.round(r.product_readiness_score * 100) + '%', 'Local rules check');
        add('readiness.blockers', 'Decision blockers', r.blockers || r.missing_items || [], 'Local evidence assessment');
        add('readiness.missing_evidence', 'Missing evidence', r.missing_evidence || [], 'Local evidence assessment');
        add('readiness.unknowns', 'Metrics needing input', r.unknown_metrics || r.unknowns || [], 'Local evidence check');
        add('readiness.approvals', 'Pending approvals', r.pending_approvals || r.approvals || [], 'Local evidence assessment');
      };
      const addHandoff = function() {
        const d = session.exportDraft || {};
        add('handoff.audience', 'Handoff audience', d.audience, 'Session draft');
        add('handoff.purpose', 'Handoff purpose', d.purpose, 'Session draft');
        add('handoff.tone', 'Tone', d.tone, 'Session draft');
        add('handoff.detail', 'Detail level', d.detail, 'Session draft');
        add('handoff.preview', 'Preview prepared', session.exportPreviewReady ? 'Yes' : 'No', 'Session state');
      };
      const addFoundation = function() {
        add('foundation.problem_statement', 'Foundation problem', p?.problem?.statement, 'Shared product foundation');
        add('foundation.intended_user', 'Foundation intended user', p?.problem?.whoExperiences, 'Shared product foundation');
        add('foundation.desired_outcome', 'Foundation desired outcome', p?.problem?.desiredOutcome, 'Shared product foundation');
        add('foundation.hypothesis', 'Foundation hypothesis', p?.definition?.hypothesis, 'Shared product foundation');
        (p?.context || []).slice(0, 4).forEach(function(item, index) {
          add('foundation.context.' + (item.id || index), item.type || 'Foundation context', item.description, item.source || 'Foundation workspace');
        });
      };

      if (options.includeCurrentSection) {
        const sectionBuilders = { discover: addDiscover, research: addResearch, define: addDefine, solution: addSolution, gtm: addGtm, readiness: addReadiness, copilot: addHandoff };
        if (sectionBuilders[appState.currentPage]) sectionBuilders[appState.currentPage]();
        else if (PI_FOUNDATION_PAGES.includes(appState.currentPage)) addFoundation();
        else add('workspace.section', 'Current page', aiCurrentScopeLabel(), 'Visible page');
      }
      if (options.includeFullProduct) {
        addFoundation(); addDiscover(); addResearch(); addDefine(); addSolution(); addGtm(); addReadiness(); addHandoff();
      }
      if (options.includeBlueprintRules) {
        add('rules.draft_stages', 'Draft stages prepared', pbStageCompletion(session).filter(function(stage) { return stage.complete; }).length + '/7', 'Product workflow rule');
        add('rules.delivery', 'Delivery readiness', 'Not checked yet', 'Product workflow rule');
        add('rules.external_model', 'External model', 'Off', 'Local app boundary');
      }
      return items;
    }

    function aiRenderAnswer(answer, messageId) {
      if (!answer) return '';
      if (answer.mode === 'fast') {
        return '<div class="ai-answer-card ai-answer-fast">' +
          (answer.refusal ? '<div class="pif-safety-note" role="alert"><strong>Action refused</strong><div style="margin-top:3px;font-weight:400;">' + esc(answer.refusal) + '</div></div>' : '') +
          '<p class="ai-reply-text">' + esc(answer.recommendation || '') + '</p>' +
          (answer.nextDecision ? '<p class="ai-next-line"><strong>Next:</strong> ' + esc(answer.nextDecision) + '</p>' : '') +
          '</div>';
      }
      const list = function(title, values) {
        if (!values || !values.length) return '';
        return '<div class="ai-answer-section"><strong>' + esc(title) + '</strong><ul>' + values.map(function(value) { return '<li>' + esc(value) + '</li>'; }).join('') + '</ul></div>';
      };
      const sources = (answer.sourceFields || []).map(function(item) {
        return '<div><strong>' + esc(item.label) + '</strong><span>' + esc(item.display) + '</span><span>' + esc(item.provenance) + '</span></div>';
      }).join('');
      const action = answer.canPropose ? '<button class="btn btn-secondary btn-sm" onclick="aiPrepareProposal(' + esc(JSON.stringify(String(messageId || ''))) + ')">' + localIcon('arrows-diff') + 'Create proposal</button>' : '';
      const details =
        list('Plan', answer.plan) +
        list('Evidence used', answer.evidenceUsed) +
        list('Assumptions', answer.assumptions) +
        list('Open questions', answer.unknowns) +
        list('Contradictions', answer.contradictions) +
        '<div class="ai-answer-section"><strong>Confidence</strong><p>' + esc(answer.confidence || 'Low') + '</p></div>' +
        '<details class="ai-source-details"><summary>Source fields</summary><div class="ai-source-list">' + (sources || '<div><strong>No source fields</strong><span>Add product context, then ask again.</span></div>') + '</div></details>';
      return '<div class="ai-answer-card">' +
        (answer.refusal ? '<div class="pif-safety-note" role="alert"><strong>Action refused</strong><div style="margin-top:3px;font-weight:400;">' + esc(answer.refusal) + '</div></div>' : '') +
        (answer.clarifyingQuestion ? '<div class="ai-clarifying-card"><strong>Quick question</strong><div style="margin-top:3px;">' + esc(answer.clarifyingQuestion) + '</div><button type="button" class="btn btn-ghost btn-sm" style="margin-top:6px;" onclick="aiCancelClarification()">Skip</button></div>' : '') +

        (action ? '<div class="ai-answer-meta">' + action + '</div>' : '') +
        '<details class="ai-answer-details"><summary>Why this answer</summary>' + details + '</details></div>';
    }

    function aiPrepareProposal(messageId) {
      const product = activeCopilotProduct();
      const productKey = product ? (product.product_id || product.id || 'local-product') : 'local-product';
      const message = getProductAIChat(productKey).find(function(item) { return String(item.id) === String(messageId); });
      if (!message?.answer?.recommendation || message.answer.canPropose !== true) {
        showToast('This response is guidance only');
        return;
      }
      const session = pbCurrentSession();
      const allowedTargets = ['definition:vision', 'definition:problem_statement', 'gtm:positioning'];
      const target = allowedTargets.includes(message.answer.proposalTarget) ? message.answer.proposalTarget : '';
      if (!target) { showToast('This guidance has no supported field change'); return; }
      const evidenceIds = Array.from(new Set((message.answer.linkedEvidenceIds || []).filter(Boolean)));
      if (!evidenceIds.length) { showToast('Add linked evidence before creating proposal'); return; }
      session.copilotSeed = {
        target: target,
        change: message.answer.recommendation,
        rationale: 'Grounded in selected session fields. Review evidence, assumptions, and unknowns before acceptance.',
        evidenceIds: evidenceIds
      };
      aiActivity(productKey, 'proposal draft', message.answer.recommendation);
      toggleAIPanel(false);
      navigateTo('copilot');
      showToast('Proposal draft prepared for review');
    }

    function askCopilotAbout(scope) {
      const allowed = ['hypothesis','solution options','launch goal','readiness metrics'];
      const trustedScope = allowed.includes(scope) ? scope : 'current field';
      pbCaptureVisibleDraft();
      appState.aiActiveTab = 'chat';
      toggleAIPanel(true);
      renderAIPanel(activeCopilotProduct());

        if (!input) return;
        input.value = 'Review ' + trustedScope + '. Identify evidence, assumptions, unknowns, contradictions, and next decision.';
        updateAIComposerState();
        input.focus();
      }, 0);
    }

    function filterBlueprintDoc(query) {
      appState.blueprintSearchQuery = query;
      const activeProd = getActiveProduct();
      renderBlueprintScreen(document.getElementById("main-workspace"), activeProd);
    }

    function setBlueprintApprovalStatus(status) {
      const product = getActiveProduct();
      if (status === 'Reviewed' && !foundationExportAllowed(product)) {
        appState.blueprintApprovalStatus = 'In review';
        showToast('Complete Foundation gaps before marking reviewed');
        renderBlueprintScreen(document.getElementById('main-workspace'), product);
        return;
      }
      appState.blueprintApprovalStatus = status;
      saveState();
      showToast(`Review label set to: ${status}`);
    }

    function exportFoundationBlueprint(format) {
      const product = getActiveProduct();
      if (!product) return;
      if (!foundationExportAllowed(product)) {
        showToast('Complete Foundation gaps before export');
        return;
      }
      const stem = (String(product.name || 'product').replace(/[^a-z0-9_-]+/gi, '_').replace(/^_+|_+$/g, '').slice(0, 80) || 'product');
      if (format === 'json') {
        exportFile(stem + '.json', JSON.stringify(product, null, 2), 'application/json');
        return;
      }
      if (format === 'yaml') {
        exportFile(stem + '.yaml', generateSimpleYaml(product), 'text/yaml');
        return;
      }
      exportFile(stem + '_Foundation.md', generateBlueprintMarkdown(product), 'text/markdown');
    }

    function esc(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    async function apiGet(path) {
      try {
        const r = await fetch(path, { signal: AbortSignal.timeout(15000) });
        const data = await r.json();
        if (!r.ok) return { _err: data.error || 'HTTP ' + r.status };
        return data;
      } catch (e) {
        return { _err: e.name === 'TimeoutError' ? 'Request timed out' : 'Network error — run: python3 layer_a.py serve' };
      }
    }

    async function apiPost(path, body) {
      try {
        const r = await fetch(path, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
          signal: AbortSignal.timeout(30000)
        });
        const data = await r.json();
        if (!r.ok) return { _err: data.error || 'HTTP ' + r.status };
        return data;
      } catch (e) {
        return { _err: e.name === 'TimeoutError' ? 'Request timed out' : 'Network error — run: python3 layer_a.py serve' };
      }
    }

    function pbSession(productId) {
      const key = productId || pbState.activeProductId || 'local-product';
      if (!pbState.sessions[key]) {
        pbState.sessions[key] = {
          discoverDraft: {},
          defineDraft: {},
          solutionDraft: { options: ['', '', ''], method: '' },
          gtmDraft: {},
          exportDraft: { audience: 'Leadership', purpose: 'Decision review', tone: 'Concise', detail: 'Summary' },
          results: {},
          record: null,
          intakePrepared: false,
          exportPreviewReady: false,
          dirty: false
        };
      }
      return pbState.sessions[key];
    }

    function pbCurrentSession() {
      return pbSession(pbState.activeProductId);
    }

    function pbSetSessionResult(name, value) {
      const session = pbCurrentSession();
      pbInvalidateFrom(name);
      session.results[name] = value;
      pbState[name + 'Result'] = value;
      session.dirty = true;
    }

    function pbSessionResult(name) {
      return pbCurrentSession().results[name] || null;
    }

    function pbHasText(value) {
      return typeof value === 'string' && value.trim().length > 0;
    }

    const PB_STATE_LABELS = Object.freeze({
      PASS: 'Passed',
      BLOCKED: 'Blocked',
      READY: 'Ready',
      READY_FOR_REVIEW: 'Ready for review',
      UNKNOWN: 'Needs input',
      ASSESSED: 'Checked',
      NOT_RELEVANT: 'Not needed',
      NOT_CHECKED: 'Not checked yet',
      PENDING: 'Pending',
      APPROVED: 'Approved',
      VERIFIED: 'Verified',
      UNSIGNED: 'Unsigned',
      INVALID: 'Invalid',
      INTERNAL: 'Internal',
      EXTERNAL: 'External',
      PLATFORM: 'Platform',
      DRAFT: 'Draft',
      ACTIVE: 'Active',
      INACTIVE: 'Inactive',
      ENABLED: 'Enabled',
      DISABLED: 'Disabled',
      HUMAN: 'Human',
      AI: 'AI',
      SYSTEM: 'System',
      MUST: 'Must have',
      SHOULD: 'Should have',
      COULD: 'Could have',
      WONT: 'Not now'
    });

    function pbHumanLabel(value) {
      const text = String(value == null ? '' : value)
        .replace(/^(problem|opportunity|user-group|hypothesis|metric|experiment|risk|readiness|approval|milestone|research|evidence)-/i, '')
        .replace(/[._:-]+/g, ' ')
        .replace(/\b\w/g, function(letter) { return letter.toUpperCase(); });
      return text || 'Not provided';
    }

    function pbStateLabel(value) {
      const raw = String(value == null ? '' : value).trim();
      return PB_STATE_LABELS[raw.toUpperCase()] || pbHumanLabel(raw);
    }

    function pbReadableToken(value, fallback) {
      const raw = String(value == null ? '' : value).trim();
      if (!raw) return fallback || 'Not provided';
      if (PB_STATE_LABELS[raw.toUpperCase()]) return PB_STATE_LABELS[raw.toUpperCase()];
      const machineToken = /^[a-z0-9]+(?:[._:-][a-z0-9]+)+$/i.test(raw) || /^[A-Z][A-Z0-9]+(?:_[A-Z0-9]+)+$/.test(raw);
      return machineToken ? pbHumanLabel(raw) : raw;
    }

    function pbStageCompletion(sourceSession) {
      const session = sourceSession || pbCurrentSession();
      const discover = session.discoverDraft || {};
      const define = session.defineDraft || {};
      const solution = session.solutionDraft || {};
      const gtm = session.gtmDraft || {};
      const researchResult = session.results.research || {};
      const defineResult = session.results.define || {};
      const solutionResult = session.results.solution || {};
      const gtmResult = session.results.gtm || {};
      const readinessResult = session.results.readiness || {};
      const defineReady = (defineResult.gate_status || defineResult.status) === 'READY_FOR_REVIEW' && !(defineResult.blockers || []).length;
      return [
        { key: 'discover', label: 'Problem brief', state: 'Problem brief prepared', complete: ['problem','users','decision'].every(k => pbHasText(discover[k])) && session.intakePrepared === true },
        { key: 'research', label: 'Research review', state: 'Evidence reviewed', complete: researchResult.status === 'PASS' && researchResult.research?.synthesis_gate === 'PASS' },
        { key: 'define', label: 'Definition', state: 'Ready for review', complete: pbHasText(define.problemStatement) && pbHasText(define.hypothesis) && defineReady },
        { key: 'solution', label: 'Solution comparison', state: 'Options compared', complete: (solution.options || []).filter(pbHasText).length >= 2 && solutionResult.evidence_linked === true },
        { key: 'gtm', label: 'Launch preparation', state: 'Inputs captured; saved plan checked', complete: ['audience','launchGoal','timeframe'].every(k => pbHasText(gtm[k])) && gtmResult.status === 'PASS' },
        { key: 'readiness', label: 'Readiness assessment', state: 'Assessment completed', complete: Array.isArray(readinessResult.checks) && readinessResult.checks.length > 0 },
        { key: 'copilot', label: 'Handoff preview', state: 'Preview prepared', complete: session.exportPreviewReady === true }
      ];
    }

    function pbReadinessTruth() {
      const session = pbCurrentSession();
      const stages = pbStageCompletion();
      const completed = stages.filter(function(stage) { return stage.complete; }).length;
      const research = session.results.research || {};
      const readiness = session.results.readiness || {};
      const blockers = readiness.blockers || readiness.missing_items || [];
      const approvals = readiness.pending_approvals || readiness.approvals || [];
      const pendingApprovals = approvals.filter(function(item) {
        return !!item && item.required !== false && String(item.status || 'PENDING').toUpperCase() !== 'APPROVED';
      });
      const researchReady = research.status === 'PASS' && research.research?.synthesis_gate === 'PASS';
      return {
        completed,
        percent: Math.round((completed / stages.length) * 100),
        workflow: completed + '/' + stages.length + ' prepared',
        evidence: researchReady ? 'Per item; no combined confidence' : 'Not checked yet',
        decision: readiness.status === 'READY' && !blockers.length ? 'Ready for decision' : readiness.status === 'BLOCKED' || blockers.length ? 'Blocked' : 'Not checked yet',
        delivery: 'Not checked yet',
        approval: pendingApprovals.length ? pendingApprovals.length + ' pending' : approvals.length ? 'Reviewed' : 'Not checked yet',
        blockers,
        pendingApprovals
      };
    }

    function pbProductExportGate() {
      const incomplete = pbStageCompletion().slice(0, 6).filter(function(stage) { return !stage.complete; });
      const truth = pbReadinessTruth();
      const gaps = incomplete.map(function(stage) { return stage.label; });
      if (truth.decision !== 'Ready for decision') gaps.push('decision readiness');
      if (truth.approval !== 'Reviewed') gaps.push('required approval');
      return { allowed: gaps.length === 0, gaps: gaps };
    }

    function pbStatusStripHtml() {
      const truth = pbReadinessTruth();
      const items = [
        ['Workflow preparation', truth.workflow],
        ['Evidence detail', truth.evidence],
        ['Decision readiness', truth.decision],
        ['Delivery readiness', truth.delivery],
        ['Approval status', truth.approval]
      ];
      return '<div class="pif-truth-strip" aria-label="Product status summary">' + items.map(function(item) {
        return '<div><small>' + esc(item[0]) + '</small><strong title="' + esc(item[1]) + '">' + esc(item[1]) + '</strong></div>';
      }).join('') + '</div>';
    }

    function pbInvalidateFrom(stage) {
      const session = pbCurrentSession();
      const order = ['discover','research','define','solution','gtm','readiness'];
      if (stage === 'copilot') {
        session.exportPreviewReady = false;
        return;
      }
      const start = order.indexOf(stage);
      if (start < 0) return;
      order.slice(start).forEach(function(key) {
        delete session.results[key];
        pbState[key + 'Result'] = null;
      });
      if (stage === 'discover') session.intakePrepared = false;
      session.exportPreviewReady = false;
    }

    function pbCaptureVisibleDraft() {
      const session = pbCurrentSession();
      const before = JSON.stringify({ discoverDraft: session.discoverDraft, defineDraft: session.defineDraft, solutionDraft: session.solutionDraft, gtmDraft: session.gtmDraft, exportDraft: session.exportDraft });
      let captured = false;
      let capturedStage = '';
      const take = function(id) { const el = document.getElementById(id); return el ? el.value.trim() : null; };
      if (document.getElementById('pb-q-problem')) {
        ['problem','users','evidence','constraints','decision'].forEach(function(key) {
          const value = take('pb-q-' + key);
          if (value !== null) session.discoverDraft[key] = value;
        });
        pbState.intakeAnswers = Object.assign({}, session.discoverDraft);
        captured = true;
        capturedStage = 'discover';
      }
      if (document.getElementById('pb-def-problem-statement')) {
        session.defineDraft.problemStatement = take('pb-def-problem-statement') || '';
        session.defineDraft.hypothesis = take('pb-def-hypothesis') || '';
        session.defineDraft.outcome = take('pb-def-outcome') || '';
        session.defineDraft.selectedProblemIds = Array.from(document.querySelectorAll('input[name="pb-def-problem"]:checked')).map(function(input) { return input.value; });
        captured = true;
        capturedStage = 'define';
      }
      if (document.getElementById('pb-solution-option-0')) {
        session.solutionDraft.options = [0,1,2].map(i => take('pb-solution-option-' + i) || '');
        captured = true;
        capturedStage = 'solution';
      }
      if (document.getElementById('pb-gtm-audience')) {
        ['audience','geography','channels','pricing','budget','launchGoal','timeframe'].forEach(function(key) {
          const value = take('pb-gtm-' + key.replace(/[A-Z]/g, m => '-' + m.toLowerCase()));
          if (value !== null) session.gtmDraft[key] = value;
        });
        captured = true;
        capturedStage = 'gtm';
      }
      if (document.getElementById('pb-export-audience')) {
        ['audience','purpose','tone','detail'].forEach(function(key) {
          const value = take('pb-export-' + key);
          if (value !== null) session.exportDraft[key] = value;
        });
        captured = true;
        capturedStage = 'copilot';
      }
      const after = JSON.stringify({ discoverDraft: session.discoverDraft, defineDraft: session.defineDraft, solutionDraft: session.solutionDraft, gtmDraft: session.gtmDraft, exportDraft: session.exportDraft });
      if (captured && before !== after) {
        session.dirty = true;
        pbInvalidateFrom(capturedStage);
        syncFoundationRegistry();
      }
    }

    function pbDraftInput() {
      pbCaptureVisibleDraft();
      pbSyncChrome();
    }

    function pbConfirmDiscardDraft() {
      const session = pbCurrentSession();
      if (!session.dirty || confirm('Discard unsaved draft from this tab? This cannot be undone.')) {
        session.discoverDraft = {};
        session.defineDraft = {};
        session.solutionDraft = { options: ['', '', ''], method: '' };
        session.gtmDraft = {};
        session.exportDraft = { audience: 'Leadership', purpose: 'Decision review', tone: 'Concise', detail: 'Summary' };
        session.results = {};
        session.intakePrepared = false;
        session.exportPreviewReady = false;
        session.copilotSeed = null;
        session.dirty = false;
        renderApp();

    /* ==========================================
       B8: COPILOT + EXPORT SCREEN
       ========================================== */
    function renderCopilotScreen(container) {
      const session = pbCurrentSession();
      const decided = session.proposalDecided === true;
      const hasPending = !!session.pendingProposal;
      const exportDraft = session.exportDraft;
      const incomplete = pbStageCompletion().slice(0, 6).filter(stage => !stage.complete);
      const truth = pbReadinessTruth();
      const exportGate = pbProductExportGate();
      const seed = session.copilotSeed || {};
      const proposalTarget = ['definition:vision','definition:problem_statement','gtm:positioning'].includes(seed.target) ? seed.target : 'definition:vision';
      const proposalOption = function(value, label) { return '<option value="' + value + '"' + (proposalTarget === value ? ' selected' : '') + '>' + label + '</option>'; };
      const proposalRecord = session.record || {};
      const proposalEvidence = proposalRecord.blueprint?.research?.evidence || pbState.bootstrapData?.default_product?.research?.evidence || [];
      const seededEvidenceId = (seed.evidenceIds || []).find(function(id) { return proposalEvidence.some(function(item) { return item.id === id; }); }) || '';
      const proposalReady = !!seededEvidenceId && !!String(seed.change || '').trim() && !!String(seed.rationale || '').trim();
      const proposalEvidenceOptions = proposalEvidence.map(function(item, index) {
        const id = String(item.id || '');
        const label = pbHumanLabel(item.source_ref || item.factor || id || 'Evidence ' + (index + 1));
        return '<option value="' + esc(id) + '"' + (seededEvidenceId === id ? ' selected' : '') + '>' + esc(label) + '</option>';
      }).join('');
      const unresolved = [truth.decision !== 'Ready for decision' ? 'Decision: ' + truth.decision : '', truth.delivery !== 'Ready' ? 'Delivery: ' + truth.delivery : '', truth.approval !== 'Reviewed' ? 'Approval: ' + truth.approval : ''].filter(Boolean);
      const missingHtml = '<div class="pif-completeness-warning" role="alert"><span class="icon" data-icon="alert-circle" aria-hidden="true"></span><div><strong>' + (incomplete.length ? 'Workflow preparation has gaps' : 'Workflow prepared; readiness remains separate') + '</strong><p>' + (incomplete.length ? 'Needs input: ' + incomplete.map(stage => esc(stage.label)).join(', ') + '. ' : '') + 'Unresolved: ' + unresolved.map(esc).join(' · ') + '. Preview remains available and does not mark product ready.</p></div></div>';

      container.innerHTML = '<div class="pif-page-shell">' + pbPageHeader('Preview & Share', 'Review controlled changes, preview audience fit, then export') + pbDataBoundaryNotice('Proposal and export requests stay inside local app. Draft text stays in page memory and clears on refresh.') + '<div class="pif-step-contract"><div><strong>You provide</strong><span>Change request and handoff intent</span></div><div><strong>PI prepares</strong><span>Reviewable field change and preview</span></div><div><strong>Still unknown</strong><span>Stakeholder approval and delivery readiness</span></div><div><strong>Why it matters</strong><span>Prevents blind export or silent edits</span></div></div>' + missingHtml +
        '<section class="bento-card" style="margin-bottom:24px;"><div class="bento-stat-label">1 · Optional controlled change</div><h2>Draft reviewed change</h2><p class="section-intro">Nothing writes until proposal is accepted.</p>' +
        '<div class="form-group"><label class="form-label" for="pb-cop-field">Product field</label><select class="form-control" id="pb-cop-field">' + proposalOption('definition:vision', 'Definition · vision') + proposalOption('definition:problem_statement', 'Definition · problem statement') + proposalOption('gtm:positioning', 'Launch plan · positioning') + '</select><p class="field-helper">Only supported scalar fields appear. Proposal shows current and proposed values before acceptance.</p></div>' +
        '<div class="form-group"><label class="form-label" for="pb-cop-evidence">Evidence used</label><select class="form-control" id="pb-cop-evidence" onchange="pbUpdateProposalButton()"><option value="">Select evidence</option>' + proposalEvidenceOptions + '</select><p class="field-helper">Choose exact sample evidence record supporting this change.</p></div>' +
        '<div class="form-group"><label class="form-label" for="pb-cop-change">Proposed value</label><textarea class="form-control" id="pb-cop-change" rows="3" maxlength="800" placeholder="Describe exact reviewed value" aria-required="true" aria-describedby="pb-cop-change-error" oninput="pbUpdateProposalButton()">' + esc(seed.change || '') + '</textarea><div class="field-error" id="pb-cop-change-error" hidden></div></div>' +
        '<div class="form-group"><label class="form-label" for="pb-cop-rationale">Rationale for change</label><textarea class="form-control" id="pb-cop-rationale" rows="2" maxlength="600" placeholder="Why this change is proposed" aria-required="true" aria-describedby="pb-cop-rationale-error" oninput="pbUpdateProposalButton()">' + esc(seed.rationale || '') + '</textarea><div class="field-error" id="pb-cop-rationale-error" hidden></div></div>' +
        '<button class="btn btn-secondary" id="pb-propose-btn" onclick="pbCreateProposal()"' + (proposalReady ? '' : ' disabled') + '>Prepare change for review</button>' +
        '<div id="pb-copilot-status" aria-live="polite" style="margin-top:8px;font-size:13px;color:var(--text-secondary);"></div></section>' +
        '<div id="pb-proposal-review"' + (hasPending ? '' : ' hidden') + '></div>' +
        '<section class="bento-card" style="margin-bottom:16px;"><div class="bento-stat-label">2 · Preview handoff</div><h2>Shape export</h2><p class="section-intro">Audience and purpose guide preview only; export format stays unchanged.</p><div class="pif-form-grid"><div class="form-group"><label class="form-label" for="pb-export-audience">Audience</label><select class="form-control" id="pb-export-audience" onchange="pbDraftInput()"><option' + (exportDraft.audience === 'Leadership' ? ' selected' : '') + '>Leadership</option><option' + (exportDraft.audience === 'Product team' ? ' selected' : '') + '>Product team</option><option' + (exportDraft.audience === 'Delivery team' ? ' selected' : '') + '>Delivery team</option><option' + (exportDraft.audience === 'Customer' ? ' selected' : '') + '>Customer</option></select></div><div class="form-group"><label class="form-label" for="pb-export-purpose">Purpose</label><select class="form-control" id="pb-export-purpose" onchange="pbDraftInput()"><option' + (exportDraft.purpose === 'Decision review' ? ' selected' : '') + '>Decision review</option><option' + (exportDraft.purpose === 'Pilot kickoff' ? ' selected' : '') + '>Pilot kickoff</option><option' + (exportDraft.purpose === 'Delivery handoff' ? ' selected' : '') + '>Delivery handoff</option><option' + (exportDraft.purpose === 'Stakeholder update' ? ' selected' : '') + '>Stakeholder update</option></select></div><div class="form-group"><label class="form-label" for="pb-export-tone">Tone</label><select class="form-control" id="pb-export-tone" onchange="pbDraftInput()"><option' + (exportDraft.tone === 'Concise' ? ' selected' : '') + '>Concise</option><option' + (exportDraft.tone === 'Neutral' ? ' selected' : '') + '>Neutral</option><option' + (exportDraft.tone === 'Persuasive' ? ' selected' : '') + '>Persuasive</option><option' + (exportDraft.tone === 'Technical' ? ' selected' : '') + '>Technical</option></select></div><div class="form-group"><label class="form-label" for="pb-export-detail">Detail level</label><select class="form-control" id="pb-export-detail" onchange="pbDraftInput()"><option' + (exportDraft.detail === 'Summary' ? ' selected' : '') + '>Summary</option><option' + (exportDraft.detail === 'Standard' ? ' selected' : '') + '>Standard</option><option' + (exportDraft.detail === 'Detailed' ? ' selected' : '') + '>Detailed</option></select></div></div><button class="btn btn-primary" onclick="pbPreviewHandoff()">Preview handoff</button><div id="pb-export-preview" style="margin-top:16px;">' + (session.exportPreviewReady ? pbHandoffPreviewHtml() : '<div class="pif-empty-state"><span class="icon" data-icon="file-export" aria-hidden="true"></span><strong>No preview yet</strong><p>Choose audience and purpose, then preview before export.</p></div>') + '</div></section>' +
        '<section class="bento-card" style="margin-bottom:16px;"><div class="bento-stat-label">3 · Export</div><h2>Generate handoff file</h2><p class="section-intro">Preview first. Export unlocks only after workflow preparation, decision readiness, and required approval pass.</p>' + (exportGate.allowed ? '' : '<div class="pif-safety-note"><strong>Export blocked</strong><div style="margin-top:4px;font-weight:400;">Resolve: ' + exportGate.gaps.map(esc).join(', ') + '.</div></div>') + '<div class="export-format-grid"><button class="btn btn-secondary" onclick="pbRunExport(\'json\')"' + (session.exportPreviewReady && exportGate.allowed ? '' : ' disabled') + '>JSON data</button><button class="btn btn-secondary" onclick="pbRunExport(\'markdown\')"' + (session.exportPreviewReady && exportGate.allowed ? '' : ' disabled') + '>Markdown</button><button class="btn btn-secondary" onclick="pbRunExport(\'prd\')"' + (session.exportPreviewReady && exportGate.allowed ? '' : ' disabled') + '>Product requirements</button><button class="btn btn-secondary" onclick="pbRunExport(\'executive_brief\')"' + (session.exportPreviewReady && exportGate.allowed ? '' : ' disabled') + '>Executive brief</button></div><div id="pb-export-status" aria-live="polite" class="action-status"></div><div id="pb-export-result" style="margin-top:16px;"></div></section></div>';

      if (hasPending) pbRenderProposalReview();
    }

    function pbHandoffPreviewHtml() {
      const session = pbCurrentSession();
      const draft = session.exportDraft || {};
      const stages = pbStageCompletion().slice(0, 6);
      return '<div class="handoff-preview"><div><span class="badge badge-info">Preview only</span><h3>' + esc(draft.purpose || 'Product handoff') + '</h3><p>For ' + esc(draft.audience || 'selected audience') + ' · ' + esc(draft.tone || 'Neutral') + ' tone · ' + esc(draft.detail || 'Standard') + ' detail</p></div><ul>' + stages.map(stage => '<li>' + localIcon(stage.complete ? 'circle-check' : 'alert-circle') + '<span>' + esc(stage.label) + '</span><span class="badge badge-' + (stage.complete ? 'info' : 'warning') + '">' + (stage.complete ? 'Draft included' : 'Gap') + '</span></li>').join('') + '</ul><p class="section-intro">Preview preparation does not change decision, delivery, or approval status.</p></div>';
    }

    function pbPreviewHandoff() {
      pbCaptureVisibleDraft();
      const session = pbCurrentSession();
      session.exportPreviewReady = true;
      const preview = document.getElementById('pb-export-preview');
      if (preview) preview.innerHTML = pbHandoffPreviewHtml();
      renderCopilotScreen(document.getElementById('main-workspace'));
      renderSidebarNav();
      showToast('Handoff preview prepared; readiness unchanged');
    }

    function pbUpdateProposalButton() {
      const button = document.getElementById('pb-propose-btn');
      if (!button) return;
      const evidence = String(document.getElementById('pb-cop-evidence')?.value || '').trim();
      const change = String(document.getElementById('pb-cop-change')?.value || '').trim();
      const rationale = String(document.getElementById('pb-cop-rationale')?.value || '').trim();
      button.disabled = !(evidence && change && rationale);
    }

    async function pbCreateProposal() {
      const btn = document.getElementById('pb-propose-btn');
      const status = document.getElementById('pb-copilot-status');
      const target = document.getElementById('pb-cop-field')?.value || 'definition:vision';
      const allowedTargets = { 'definition:vision': ['definition','vision'], 'definition:problem_statement': ['definition','problem_statement'], 'gtm:positioning': ['gtm','positioning'] };
      const targetParts = allowedTargets[target];
      if (!targetParts) { if (status) status.textContent = 'Unsupported proposal field.'; return; }
      const section = targetParts[0];
      const fieldName = targetParts[1];
      const change = (document.getElementById('pb-cop-change')?.value || '').trim();
      const rationale = (document.getElementById('pb-cop-rationale')?.value || '').trim();
      pbSetFieldError('pb-cop-change', '');
      pbSetFieldError('pb-cop-rationale', '');
      if (!change) { pbSetFieldError('pb-cop-change', 'Describe exact change to review.'); if (status) status.textContent = 'Requested change is required.'; document.getElementById('pb-cop-change')?.focus(); return; }
      if (!rationale) { pbSetFieldError('pb-cop-rationale', 'Explain why this change should be reviewed.'); if (status) status.textContent = 'Rationale is required.'; document.getElementById('pb-cop-rationale')?.focus(); return; }
      if (btn) btn.disabled = true;
      if (status) status.textContent = 'Creating proposal...';
      const prod = pbActiveProduct();
      const session = pbCurrentSession();
      const record = session.record || {};
      const currentSection = record.blueprint?.[section] || pbState.bootstrapData?.default_product?.[section] || {};
      const evidenceRecords = record.blueprint?.research?.evidence || pbState.bootstrapData?.default_product?.research?.evidence || [];
      const evidenceId = document.getElementById('pb-cop-evidence')?.value || '';
      const evidenceRecord = evidenceRecords.find(function(item) { return item.id === evidenceId; });
      const patch = {};
      patch[fieldName] = change;
      if (!evidenceRecord) { if (btn) btn.disabled = false; if (status) status.textContent = 'Select evidence linked to this change.'; document.getElementById('pb-cop-evidence')?.focus(); return; }
      const result = await apiPost('/api/copilot/propose', { product_id: prod && prod.product_id, section, patch, rationale, evidence_ids: [evidenceId], unknowns: ['Proposed value remains unverified until human review.'] });
      if (btn) btn.disabled = false;
      if (result._err) { if (status) status.textContent = 'Error: ' + result._err; return; }
      result.proposal.current_values = {};
      result.proposal.current_values[fieldName] = currentSection[fieldName] == null ? '' : currentSection[fieldName];
      pbState.pendingProposal = result.proposal;
      pbState.proposalDecided = false;
      session.pendingProposal = result.proposal;
      session.proposalDecided = false;
      session.copilotSeed = null;
      const productKey = prod ? (prod.product_id || prod.id || 'local-product') : 'local-product';
      aiActivity(productKey, 'proposal', 'Proposed ' + pbHumanLabel(section) + ' · ' + pbHumanLabel(fieldName));
      if (status) status.textContent = 'Proposal ready for review.';
      const d = document.getElementById('pb-proposal-review');
      if (d) d.hidden = false;
      pbRenderProposalReview();
    }

    function pbRenderProposalReview() {
      const container = document.getElementById('pb-proposal-review');
      if (!container) return;
      const session = pbCurrentSession();
      const p = session.pendingProposal;
      if (!p) { container.hidden = true; return; }
      const decided = session.proposalDecided === true;
      const patch = p.patch || {};
      const patchHtml = Object.entries(patch).map(function(kv) { const current = p.current_values?.[kv[0]]; return '<div class="pif-field-diff"><strong>' + esc(pbHumanLabel(kv[0])) + '</strong><span><small>Current</small>' + esc(current == null || current === '' ? 'Not provided' : String(current)) + '</span><span><small>Proposed</small>' + esc(String(kv[1])) + '</span></div>'; }).join('');
      const sources = (p.sources || []).map(function(source) { return '<span class="badge badge-info">' + esc(pbHumanLabel(source.source_ref || source.source_type || 'Linked evidence')) + '</span>'; }).join(' ');
      const unknownList = (p.unknowns || []).map(function(u) { return '<li style="font-size:13px;">' + esc(u) + '</li>'; }).join('');

      container.innerHTML = '<div class="bento-card" style="margin-bottom:24px;border-color:var(--accent-color);"><div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;"><h3 style="font-size:15px;font-weight:800;flex:1;">Proposal review</h3><span class="badge badge-info">' + esc(pbHumanLabel(p.section || '')) + '</span>' + (decided ? '<span class="badge badge-neutral">Decision recorded</span>' : '<span class="badge badge-required">Awaiting decision</span>') + '</div>' +
        '<p style="font-size:13px;margin-bottom:10px;"><strong>Rationale:</strong> ' + esc(p.rationale || '') + '</p>' +
        '<div style="background:var(--bg-body);border:1px solid var(--border-color);border-radius:var(--radius-md);padding:10px;margin-bottom:10px;"><strong style="font-size:12px;color:var(--text-muted);">Field-level change</strong>' + patchHtml + '</div>' +
        (sources ? '<div style="margin-bottom:8px;"><strong style="font-size:12px;color:var(--text-muted);">Sources:</strong> ' + sources + '</div>' : '') +
        (unknownList ? '<div style="margin-bottom:10px;"><strong style="font-size:12px;color:var(--text-muted);">Open questions:</strong><ul style="list-style:none;margin-top:4px;">' + unknownList + '</ul></div>' : '') +
        '<p style="font-size:12px;color:var(--text-muted);margin-bottom:12px;">Reject: no write. Accept: applies once. Decision cannot be replayed.</p>' +
        '<div style="display:flex;gap:10px;"><button class="btn btn-sm" style="background:var(--danger-color);color:#fff;border-color:var(--danger-color);" id="pb-reject-btn" onclick="pbRequestProposalReject()"' + (decided ? ' disabled' : '') + '>Reject</button><button class="btn btn-primary btn-sm" id="pb-accept-btn" onclick="pbDecideProposal(true)"' + (decided ? ' disabled' : '') + '>Accept</button></div>' +
        '<div id="pb-decision-status" aria-live="polite" style="margin-top:8px;font-size:13px;color:var(--text-secondary);"></div></div>';
    }

    function pbRequestProposalReject() {
      const status = document.getElementById('pb-decision-status');
      if (status) status.innerHTML = '<div class="pif-inline-confirm"><strong>Reject proposal?</strong><div style="margin:4px 0 10px;font-weight:400;">No product changes will be written.</div><div style="display:flex;gap:8px;flex-wrap:wrap;"><button class="btn btn-danger" onclick="pbDecideProposal(false)">Confirm rejection</button><button class="btn btn-secondary" onclick="pbCancelProposalReject()">Cancel</button></div></div>';
    }

    function pbCancelProposalReject() {
      const status = document.getElementById('pb-decision-status');
      if (status) status.textContent = 'Proposal remains awaiting decision.';
    }

    async function pbDecideProposal(approved) {
      const session = pbCurrentSession();
      if (session.proposalDecided) return;
      const p = session.pendingProposal;
      if (!p) return;
      const status = document.getElementById('pb-decision-status');
      const acceptBtn = document.getElementById('pb-accept-btn');
      const rejectBtn = document.getElementById('pb-reject-btn');
      if (acceptBtn) acceptBtn.disabled = true;
      if (rejectBtn) rejectBtn.disabled = true;
      if (status) status.textContent = approved ? 'Applying...' : 'Rejecting...';
      const result = await apiPost('/api/copilot/decision', { proposal_id: p.proposal_id, approved });
      if (result._err) {
        if (status) status.textContent = 'Error: ' + result._err;
        if (acceptBtn) acceptBtn.disabled = false;
        if (rejectBtn) rejectBtn.disabled = false;
        return;
      }
      pbState.proposalDecided = true;
      session.proposalDecided = true;
      const product = pbActiveProduct();
      const productKey = product ? (product.product_id || product.id || 'local-product') : 'local-product';
      if (!approved) { if (status) status.textContent = 'Rejected — no write occurred.'; showToast('Proposal rejected — no changes written'); }
      else {
        if (result.record) {
          session.record = result.record;
          const index = pbState.products.findIndex(function(item) { return item.product_id === result.record.product_id; });
          if (index >= 0) pbState.products[index] = result.record;
          syncFoundationRegistry();
        }
        pbInvalidateFrom(p.section === 'definition' ? 'define' : p.section === 'gtm' ? 'gtm' : 'discover');
        if (status) status.textContent = result.new_revision == null ? 'Accepted. Change applied once.' : 'Accepted · revision ' + String(result.new_revision) + '. Change applied once.';
        showToast('Proposal accepted and applied');
      }
      aiActivity(productKey, approved ? 'accepted proposal' : 'rejected proposal', pbHumanLabel(p.section || 'Product') + ' proposal');
      pbRenderProposalReview();
    }

    async function pbRunExport(format) {
      const status = document.getElementById('pb-export-status');
      const resultDiv = document.getElementById('pb-export-result');
      if (!pbCurrentSession().exportPreviewReady) {
        if (status) status.textContent = 'Preview handoff before export.';
        return;
      }
      const exportGate = pbProductExportGate();
      if (!exportGate.allowed) {
        if (status) status.textContent = 'Export blocked. Resolve: ' + exportGate.gaps.join(', ') + '.';
        return;
      }
      if (status) status.textContent = 'Generating ' + format + '...';
      const prod = pbActiveProduct();
      const result = await apiPost('/api/export', { product_id: prod && prod.product_id, format });
      if (result._err) { if (status) status.textContent = 'Error: ' + result._err; return; }
      const content = result.content || result.export_content || '';
      const revision = result.revision;
      const evidenceCount = result.evidence_count;
      const unknownCount = result.unknown_count;
      if (status) status.textContent = 'Format: ' + esc(result.format || format) + ' · Revision: ' + esc(String(revision == null ? 'Not provided' : revision)) + ' · Evidence: ' + esc(String(evidenceCount == null ? 'Not provided' : evidenceCount)) + ' · Open items: ' + esc(String(unknownCount == null ? 'Not provided' : unknownCount));
      window._pbExportContent = typeof content === 'string' ? content : JSON.stringify(content, null, 2);
      const contentEl = document.createElement('div');
      contentEl.style.cssText = 'background:var(--bg-body);border:1px solid var(--border-color);border-radius:var(--radius-md);padding:16px;';
      const copyBtn = document.createElement('button');
      copyBtn.id = 'pb-copy-btn';
      copyBtn.className = 'btn btn-ghost btn-sm';
      copyBtn.style.marginBottom = '10px';
      copyBtn.innerHTML = localIcon('file-export') + '<span>Copy</span>';
      copyBtn.onclick = pbCopyExport;
      const pre = document.createElement('pre');
      pre.id = 'pb-export-content';
      pre.style.cssText = 'font-size:12px;font-family:var(--font-mono);white-space:pre-wrap;max-height:400px;overflow-y:auto;word-break:break-word;margin:0;';
      pre.textContent = window._pbExportContent;
      contentEl.appendChild(copyBtn);
      contentEl.appendChild(pre);
      if (resultDiv) { resultDiv.innerHTML = ''; resultDiv.appendChild(contentEl); }
    }

    function pbCopyExport() {
      if (!navigator.clipboard || !window._pbExportContent) { showToast('Copy is unavailable'); return; }
      const btn = document.getElementById('pb-copy-btn');
      navigator.clipboard.writeText(window._pbExportContent).then(function() {
        showToast('Copied to clipboard');
        if (btn) { btn.innerHTML = localIcon('circle-check') + '<span>Copied</span>'; setTimeout(function() { if (btn) btn.innerHTML = localIcon('file-export') + '<span>Copy</span>'; }, 2000); }
      }).catch(function() { showToast('Copy failed. Select text manually.'); });
    }

    /* ==========================================
       AI & INTEGRATIONS — LOCAL BUILDER PREVIEW
       ========================================== */
    function pbAdvancedHeader(title, subtitle) {
      const breadcrumb = '<nav class="pi-breadcrumb" aria-label="Breadcrumb"><span>Advanced</span><span>' + esc(title) + '</span></nav>';
      const warning = title === 'Advanced' ? '<div class="pif-completeness-warning"><span class="icon" data-icon="alert-circle" aria-hidden="true"></span><div><strong>Local builder preview · access control not implemented</strong><p>No authentication, role checks, credential vault, or remote provider activation. Configuration screens never claim those protections.</p></div></div>' : '';
      return breadcrumb + '<div class="pif-page-heading"><div class="pif-page-heading-row"><h1>' + esc(title) + '</h1><span class="badge badge-warning">Builder preview</span></div><p class="page-subtitle">' + esc(subtitle) + '</p></div>' + warning;
    }

    function renderAIOverviewScreen(container) {
      container.innerHTML = '<div class="pif-page-shell">' + pbAdvancedHeader('Advanced', 'AI capability, extensions, and policy outside product workflow') + '<div class="pif-info-grid advanced-overview"><div><strong>π Gen</strong><span>Mock response rules · no live model</span><span class="badge badge-info">Mock available</span></div><div><strong>External network</strong><span>No remote provider requests</span><span class="badge badge-neutral">Off</span></div><div><strong>Credentials</strong><span>No secure key vault or browser key storage</span><span class="badge badge-warning">Unavailable in local preview</span></div><div><strong>Prompt retention</strong><span>Page memory only; cleared on refresh</span><span class="badge badge-info">Cleared on refresh</span></div></div><div class="bento-card"><h2>Technical details</h2><p class="section-intro">For builders, not normal product workflow.</p><div class="technical-detail-list"><div><strong>Runtime</strong><span>Local Python process</span></div><div><strong>Product records</strong><span>Saved after explicit actions</span></div><div><strong>Research</strong><span>Fixed sample data</span></div><div><strong>Integrations</strong><span>Off unless local service supports action</span></div></div></div></div>';
    }

    function renderModelsScreen(container) {
      container.innerHTML = '<div class="pif-page-shell">' + pbAdvancedHeader('AI behavior', 'Inspect mock response behavior and compare safe samples') + '<div class="bento-card" style="margin-bottom:16px;"><div class="card-heading-row"><div><h2>Mock local response rules</h2><p class="section-intro">Used for π Gen and sample research demonstrations.</p></div><span class="badge badge-info">Mock available</span></div><div class="technical-detail-list"><div><strong>Provider</strong><span>No external provider</span></div><div><strong>External requests</strong><span>No external requests</span></div><div><strong>Input retention</strong><span>Page memory for current tab</span></div><div><strong>Suitable for</strong><span>Interface and data-format demonstration only</span></div></div></div><div class="bento-card"><h2>Compare sample outputs</h2><p class="section-intro">Use local JSON samples to inspect gaps. No provider calls.</p><button class="btn btn-secondary" onclick="navigateTo(\'compare\')">Open comparison</button></div></div>';
    }

    function renderCredentialsScreen(container) {
      const steps = ['Choose provider', 'Enter key', 'Verify with sample data', 'Select model', 'Review permissions', 'Activate'];
      container.innerHTML = '<div class="pif-page-shell">' + pbAdvancedHeader('Credentials', 'Provider keys stay unavailable until secure server vault exists') + '<div class="bento-card"><div class="card-heading-row"><div><h2>Provider connection</h2><p class="section-intro">No key field shown. Browser storage is never used for provider keys.</p></div><span class="badge badge-warning">Unavailable in local preview</span></div><ol class="secure-flow">' + steps.map((step, index) => '<li><span>' + (index + 1) + '</span><div><strong>' + esc(step) + '</strong><small>' + (index === 0 ? 'Provider list unavailable in local preview' : 'Locked until secure server-side key storage exists') + '</small></div></li>').join('') + '</ol><div class="pif-sticky-actions"><div><strong>Connection unavailable</strong><span>Requires authentication, secure key vault, key rotation, limits, location, retention, and emergency controls.</span></div><button class="btn btn-primary" disabled>Connect provider</button></div></div></div>';
    }

    function renderSkillsScreen(container) {
      container.innerHTML = '<div class="pif-page-shell">' + pbAdvancedHeader('Skills', 'Review bundled local workflow capability') + '<article class="bento-card"><div class="card-heading-row"><div><span class="icon skill-icon" data-icon="microscope" aria-hidden="true"></span><h2>Product discovery</h2><p class="section-intro">Turns problem context into sample evidence, ranked problems, and open questions.</p></div><span class="badge badge-success">Bundled</span></div><div class="technical-detail-list"><div><strong>Source</strong><span>Local product-discovery skill</span></div><div><strong>Version</strong><span>Bundled workspace version</span></div><div><strong>License</strong><span>Project license applies</span></div><div><strong>Permissions</strong><span>Local workflow data only</span></div><div><strong>Scope</strong><span>Discover and research review</span></div></div><h3 style="margin-top:18px;">Workflow capabilities</h3><p class="section-intro">Hypothesis framing and handoff preparation are product steps, not separate installed skills.</p></article></div>';
    }

    function renderPolicyAuditScreen(container) {
      container.innerHTML = '<div class="pif-page-shell">' + pbAdvancedHeader('Policy', 'Local controls and production gaps') + '<div class="pif-info-grid advanced-overview"><div><strong>External model traffic</strong><span>Blocked in local preview</span><span class="badge badge-success">Off</span></div><div><strong>Browser storage</strong><span>No local storage, cookies, or URL state</span><span class="badge badge-success">Off</span></div><div><strong>Prompt logging</strong><span>No prompt analytics or audit log</span><span class="badge badge-success">Off</span></div><div><strong>Local database</strong><span>Not encrypted; unsuitable for shared sensitive data</span><span class="badge badge-warning">Not encrypted</span></div></div><div class="bento-card"><h2>Production controls unavailable</h2><ul class="policy-list"><li>Authenticated builder access</li><li>Secret vault with masked fingerprint</li><li>Rotate and revoke credentials</li><li>Spending limit and fallback model</li><li>Data residency and retention policy</li><li>Emergency disable all AI</li></ul><button class="btn btn-danger" disabled title="Emergency AI control is unavailable">Disable all AI</button></div><div class="bento-card" style="margin-top:16px;"><h2>Audit activity</h2><div class="pif-empty-state"><span class="icon" data-icon="shield-lock" aria-hidden="true"></span><strong>No audit log in local preview</strong><p>Session activity appears in π Gen only and clears on refresh.</p></div></div></div>';
    }

    /* ==========================================
       PLUGIN SCREEN
       ========================================== */
    async function renderPluginScreen(container) {
      const pluginSubtitle = 'Local extension lifecycle and trust boundary';
      const renderToken = 'plugin-' + Date.now() + '-' + Math.random().toString(16).slice(2);
      container.dataset.asyncRenderToken = renderToken;
      container.innerHTML = pbPageLoading('Plugins', pluginSubtitle, 'Loading plugin status...');
      const [pub, admin] = await Promise.all([apiGet('/api/plugin'), apiGet('/api/plugin/admin')]);
      if (container.dataset.asyncRenderToken !== renderToken || appState.currentPage !== 'plugin') return;
      if (pub._err) { container.innerHTML = pbPageError('Plugins', pluginSubtitle, pub._err); return; }
      pbState.pluginData = pub;

      const status = pub.status || 'UNKNOWN';
      const trust = pub.trust_state || 'UNKNOWN';
      const name = pub.name || '';
      const version = pub.version || '';
      const lifecycle = (admin.lifecycle) || {};
      const inspection = (admin.inspection) || {};
      const isActive = !!lifecycle.active_version;
      const canRollback = !!lifecycle.rollback_available || (Array.isArray(lifecycle.versions) && lifecycle.versions.length > 1);
      const trustColor = trust === 'VERIFIED' ? 'var(--success-color)' : trust === 'UNSIGNED' ? 'var(--warning-color)' : 'var(--danger-color)';
      const trustNote = trust === 'VERIFIED' ? 'Verified does not mean behavior is safe' : trust === 'UNSIGNED' ? 'Unsigned activation disabled until authentication and policy enforcement exist' : 'Invalid packages cannot activate';
      const lifecycleLabel = trust === 'UNSIGNED' || trust === 'INVALID' ? 'Blocked' : pbStateLabel(status);
      const lifecycleBadge = lifecycleLabel === 'Blocked' ? 'danger' : status === 'PASS' ? 'success' : 'warning';
      const metadataValue = function(value, fallback) {
        if (Array.isArray(value)) return value.length ? value.map(pbHumanLabel).join(', ') : (fallback || 'Not declared');
        return pbHasText(value) ? pbReadableToken(value) : (fallback || 'Not provided');
      };
      const publisher = metadataValue(inspection.publisher || inspection.author);
      const origin = metadataValue(inspection.origin || inspection.source);
      const checksum = metadataValue(inspection.checksum || inspection.digest);
      const license = metadataValue(inspection.license);
      const dataAccess = metadataValue(inspection.data_access || inspection.permissions, 'Not declared');
      const adminJson = JSON.stringify({ status: inspection.status, trust: inspection.trust_state, version: inspection.version, canonical_id: inspection.canonical_id }, null, 2);

      const adminPre = document.createElement('pre');
      adminPre.style.cssText = 'font-size:11px;font-family:var(--font-mono);white-space:pre-wrap;max-height:300px;overflow-y:auto;margin:0;';
      adminPre.textContent = adminJson;

      const wrapper = document.createElement('div');
      wrapper.className = 'pif-page-shell';
      wrapper.innerHTML = pbAdvancedHeader('Plugins', pluginSubtitle) +
        (trust === 'UNSIGNED' ? '<div class="pif-safety-note" role="alert"><strong>Unsigned plugin</strong><div style="margin-top:4px;font-weight:400;">Package identity is not cryptographically verified. Activation stays disabled until authentication and enforceable policy exist.</div></div>' : '') +
        '<div class="grid-2" style="gap:16px;margin-bottom:24px;"><div class="bento-card"><div class="bento-stat-label">Plugin</div><div class="bento-stat-value" style="font-size:20px;">' + esc(name || 'Unnamed plugin') + '</div><div style="font-size:12px;color:var(--text-muted);">' + (version ? 'v' + esc(version) : 'Version not provided') + '</div></div><div class="bento-card"><div class="bento-stat-label">Trust state</div><div class="bento-stat-value" style="font-size:20px;color:' + trustColor + ';">' + esc(pbStateLabel(trust)) + '</div><div style="font-size:12px;color:var(--text-muted);">' + trustNote + '</div></div></div>' +
        '<div class="bento-card" style="margin-bottom:16px;"><h3 style="font-size:15px;font-weight:800;margin-bottom:12px;">Lifecycle controls</h3><div style="margin-bottom:12px;font-size:13px;">Active: <strong>' + esc(String(lifecycle.active_version || 'No active version')) + '</strong> · Status: <span class="badge badge-' + lifecycleBadge + '">' + esc(lifecycleLabel) + '</span></div><div style="display:flex;gap:10px;flex-wrap:wrap;"><button class="btn ' + (trust === 'UNSIGNED' ? 'btn-warning' : 'btn-primary') + '" onclick="pbRequestPluginAction(\'enable\')"' + (trust === 'UNSIGNED' ? ' disabled title="Unsigned activation requires authentication and policy enforcement"' : isActive ? ' disabled title="Plugin already enabled"' : '') + '>' + (trust === 'UNSIGNED' ? 'Cannot enable unsigned plugin' : 'Enable plugin') + '</button><button class="btn btn-secondary" onclick="pbRequestPluginAction(\'disable\')"' + (!isActive ? ' disabled title="No active plugin"' : '') + '>Disable</button><button class="btn btn-secondary" onclick="pbRequestPluginAction(\'rollback\')"' + (!canRollback ? ' disabled title="No previous version available"' : '') + '>Rollback</button></div><div id="pb-plugin-status" aria-live="polite" style="margin-top:8px;font-size:13px;color:var(--text-secondary);"></div></div>' +
        '<div class="bento-card" style="margin-bottom:16px;"><h3 style="font-size:15px;font-weight:800;margin-bottom:12px;">Package details</h3><div class="technical-detail-list"><div><strong>Publisher</strong><span>' + esc(publisher) + '</span></div><div><strong>Origin</strong><span>' + esc(origin) + '</span></div><div><strong>Checksum</strong><span>' + esc(checksum) + '</span></div><div><strong>License</strong><span>' + esc(license) + '</span></div><div><strong>Data access</strong><span>' + esc(dataAccess) + '</span></div></div></div>';

      const details = document.createElement('details');
      details.style.marginBottom = '16px';
      const summary = document.createElement('summary');
      summary.style.cssText = 'cursor:pointer;font-size:13px;font-weight:700;color:var(--text-secondary);padding:8px 0;';
      summary.textContent = 'Admin evidence (advanced)';
      const adminCard = document.createElement('div');
      adminCard.className = 'bento-card';
      adminCard.style.marginTop = '8px';
      adminCard.appendChild(adminPre);
      details.appendChild(summary);
      details.appendChild(adminCard);
      wrapper.appendChild(details);

      container.innerHTML = '';
      container.appendChild(wrapper);
    }

    function pbRequestPluginAction(action) {
      const status = document.getElementById('pb-plugin-status');
      if (!status) return;
      if (action === 'enable' && pbState.pluginData?.trust_state === 'UNSIGNED') {
        status.textContent = 'Unsigned activation blocked. Authentication and enforceable policy are unavailable in local preview.';
        return;
      }
      const label = action.charAt(0).toUpperCase() + action.slice(1);
      status.innerHTML = '<div class="pif-inline-confirm"><strong>' + esc(label) + ' plugin?</strong><div style="margin:4px 0 10px;font-weight:400;">This changes local plugin state and requires explicit approval.</div><div style="display:flex;gap:8px;flex-wrap:wrap;"><button class="btn btn-primary" onclick="pbPluginAction(\'' + action + '\')">Confirm ' + esc(action) + '</button><button class="btn btn-secondary" onclick="pbCancelPluginAction()">Cancel</button></div></div>';
    }

    function pbCancelPluginAction() {
      const status = document.getElementById('pb-plugin-status');
      if (status) status.textContent = 'No change made.';
    }

    async function pbPluginAction(action) {
      const status = document.getElementById('pb-plugin-status');
      const runningLabels = { enable: 'Enabling plugin...', disable: 'Disabling plugin...', rollback: 'Rolling back plugin...' };
      const completeLabels = { enable: 'Plugin enabled', disable: 'Plugin disabled', rollback: 'Plugin rolled back' };
      if (status) status.textContent = runningLabels[action] || 'Updating plugin...';
      const result = await apiPost('/api/plugin/' + action, { approved: true });
      if (result._err) { if (status) status.textContent = 'Error: ' + result._err; return; }
      pbState.pluginData = null;
      showToast(completeLabels[action] || 'Plugin updated');
      await renderPluginScreen(document.getElementById('main-workspace'));
    }

    /* ==========================================
       COMPARE SCREEN
       ========================================== */
    function renderCompareScreen(container) {
      container.innerHTML = '<div class="pif-page-shell">' + pbPageHeader('Model Comparison', 'Compare two candidates locally — no external calls') +
        '<div class="bento-card" style="margin-bottom:16px;"><h2>Local comparison</h2><p style="font-size:13px;color:var(--text-secondary);margin-bottom:16px;">Paste outputs created from same prompt, or load safe sample data. Nothing is sent externally.</p><div class="pif-compare-grid"><div><div class="form-group"><label class="form-label" for="pb-compare-name-a">Candidate A</label><input class="form-control" id="pb-compare-name-a" maxlength="100" value="Candidate A" oninput="pbValidateCompareJSON()"></div><div class="form-group"><label class="form-label" for="pb-compare-output-a">JSON output</label><textarea class="form-control" id="pb-compare-output-a" rows="6" maxlength="50000" placeholder="Paste candidate A JSON" oninput="this.dataset.touched=\'true\';pbValidateCompareJSON()" aria-describedby="pb-compare-output-a-error"></textarea><div class="field-error" id="pb-compare-output-a-error" hidden></div></div></div><div><div class="form-group"><label class="form-label" for="pb-compare-name-b">Candidate B</label><input class="form-control" id="pb-compare-name-b" maxlength="100" value="Candidate B" oninput="pbValidateCompareJSON()"></div><div class="form-group"><label class="form-label" for="pb-compare-output-b">JSON output</label><textarea class="form-control" id="pb-compare-output-b" rows="6" maxlength="50000" placeholder="Paste candidate B JSON" oninput="this.dataset.touched=\'true\';pbValidateCompareJSON()" aria-describedby="pb-compare-output-b-error"></textarea><div class="field-error" id="pb-compare-output-b-error" hidden></div></div></div></div><div style="display:flex;gap:10px;flex-wrap:wrap;"><button class="btn btn-primary" id="pb-compare-btn" onclick="pbRunCompare()" disabled>Compare answers</button><button class="btn btn-secondary" id="pb-compare-mock-btn" onclick="pbLoadCompareMock()">Load safe samples</button></div><div id="pb-compare-status" aria-live="polite" style="margin-top:8px;font-size:13px;color:var(--text-secondary);"></div></div><div id="pb-compare-result" class="pif-empty-result"><div class="bento-card"><h3>Comparison result</h3><p style="margin-top:6px;color:var(--text-secondary);">Add two valid JSON candidates to compare local outputs.</p></div></div></div>';

      if (pbState.compareResult) {
        pbRenderCompareResult(document.getElementById('pb-compare-result'), pbState.compareResult);
      }
    }

    function pbValidateCompareJSON() {
      const ids = ['a', 'b'];
      let valid = true;
      ids.forEach(function(suffix) {
        const field = document.getElementById('pb-compare-output-' + suffix);
        const error = document.getElementById('pb-compare-output-' + suffix + '-error');
        if (!field) { valid = false; return; }
        const value = field.value.trim();
        let message = '';
        if (!value) { if (field.dataset.touched === 'true') message = 'JSON output required.'; valid = false; }
        else { try { JSON.parse(value); } catch (e) { message = 'Invalid JSON: ' + e.message; } }
        field.setAttribute('aria-invalid', message ? 'true' : 'false');
        if (error) { error.textContent = message; error.hidden = !message; }
        if (message) valid = false;
      });
      const names = ['a', 'b'].map(function(suffix) { return (document.getElementById('pb-compare-name-' + suffix)?.value || '').trim(); });
      if (!names[0] || !names[1] || names[0] === names[1]) valid = false;
      const btn = document.getElementById('pb-compare-btn');
      if (btn) btn.disabled = !valid;
      return valid;
    }

    async function pbLoadCompareMock() {
      const btn = document.getElementById('pb-compare-mock-btn');
      const status = document.getElementById('pb-compare-status');
      if (btn) btn.disabled = true;
      if (status) status.textContent = 'Loading safe samples...';
      const task = await apiGet('/api/task');
      if (btn) btn.disabled = false;
      if (task._err) { if (status) status.textContent = 'Error: ' + task._err; return; }
      const candidates = task.mock_candidates || [];
      if (candidates[0]) { document.getElementById('pb-compare-name-a').value = candidates[0].name || 'Candidate A'; document.getElementById('pb-compare-output-a').value = candidates[0].output || ''; }
      if (candidates[1]) { document.getElementById('pb-compare-name-b').value = candidates[1].name || 'Candidate B'; document.getElementById('pb-compare-output-b').value = candidates[1].output || ''; }
      document.getElementById('pb-compare-output-a').dataset.touched = 'true';
      document.getElementById('pb-compare-output-b').dataset.touched = 'true';
      pbValidateCompareJSON();
      if (status) status.textContent = 'Safe samples loaded. Review, then compare.';
    }

    async function pbRunCompare() {
      const btn = document.getElementById('pb-compare-btn');
      const status = document.getElementById('pb-compare-status');
      const candidates = [
        { name: (document.getElementById('pb-compare-name-a')?.value || '').trim(), output: document.getElementById('pb-compare-output-a')?.value || '' },
        { name: (document.getElementById('pb-compare-name-b')?.value || '').trim(), output: document.getElementById('pb-compare-output-b')?.value || '' }
      ];
      if (!pbValidateCompareJSON()) { if (status) status.textContent = 'Add unique names and valid JSON for both candidates.'; return; }
      if (btn) btn.disabled = true;
      if (status) status.textContent = 'Comparing locally...';
      const result = await apiPost('/api/compare', { candidates });
      if (btn) btn.disabled = false;
      if (result._err) { if (status) status.textContent = 'Error: ' + result._err; return; }
      pbState.compareResult = result;
      if (status) status.textContent = 'Comparison complete. Review scores and gaps.';
      const d = document.getElementById('pb-compare-result');
      if (d) pbRenderCompareResult(d, result);
    }

    async function pbRunCompareMock() {
      await pbLoadCompareMock();
      return pbRunCompare();
    }

    function pbRenderCompareResult(container, data) {
      const candidates = data.candidates || [];
      const winner = data.winner || null;
      container.innerHTML = '<div class="bento-card"><h3 style="font-size:15px;font-weight:800;margin-bottom:12px;">Comparison Results</h3>' +
        (winner ? '<p style="font-size:13px;margin-bottom:12px;">Winner: <strong>' + esc(winner) + '</strong></p>' : '') +
        (candidates.map(function(c, index) { return '<div style="background:var(--bg-body);border:1px solid var(--border-color);border-radius:var(--radius-md);padding:12px;margin-bottom:8px;"><div style="font-size:13px;font-weight:700;margin-bottom:6px;">' + esc(pbReadableToken(c.agent || c.name, 'Candidate ' + (index + 1))) + '</div><div style="font-size:12px;color:var(--text-secondary);">Score: ' + esc(String(c.score == null ? 'Not scored' : c.score)) + '</div>' + (c.gaps && c.gaps.length ? '<div style="font-size:12px;color:var(--warning-color);margin-top:4px;">Gaps: ' + c.gaps.map(function(g) { return esc(g); }).join(', ') + '</div>' : '') + '</div>'; }).join('') || '<p style="color:var(--text-muted);">No comparison data yet.</p>') +
        '</div>';
    }

  </script>
</body>

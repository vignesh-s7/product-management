    }

    async function pbInit() {
      const liveRegion = document.getElementById('pb-live-region');
      if (liveRegion) liveRegion.textContent = 'Loading workspace...';
      const [boot, prods] = await Promise.all([apiGet('/api/bootstrap'), apiGet('/api/products')]);
      if (boot._err || prods._err) {
        if (liveRegion) liveRegion.textContent = 'Backend not available. Run: python3 layer_a.py serve';
        return;
      }
      pbState.bootstrapData = boot;
      pbState.products = prods.products || [];
      if (!pbState.activeProductId && pbState.products.length > 0) {
        pbState.activeProductId = pbState.products[0].product_id;
      }
      if (boot.product && boot.product.product_id) pbSession(boot.product.product_id).record = boot.product;
      syncFoundationRegistry();
      pbSyncChrome();
      renderSidebarNav();
      renderWorkspace();
      syncMobileTabs(appState.currentPage);
      if (liveRegion) liveRegion.textContent = 'Workspace ready. Sample product data loaded.';
    }

    function pbActiveProduct() {
      if (pbState.activeProductId) {
        const found = pbState.products.find(p => p.product_id === pbState.activeProductId);
        if (found) return found;
      }
      return pbState.products[0] || (pbState.bootstrapData && pbState.bootstrapData.product) || null;
    }

    function pbFoundationRecord(record) {
      if (!record) return null;
      const id = record.product_id || record.id;
      if (!id) return null;
      const session = pbSession(id);
      const sourceRecord = session.record || record;
      const sourceBlueprint = sourceRecord.blueprint || {};
      const sourceDefinition = sourceBlueprint.definition || {};
      let product = pbState.foundationProducts[id];
      if (!product) {
        product = {
          id,
          _canonicalProductId: id,
          name: record.name || 'Unnamed product',
          industry: 'Not provided',
          lineOfBusiness: 'Not provided',
          productType: 'Not provided',
          variant: 'Not provided',
          status: record.status || 'Not provided',
          revision: record.revision ?? 'Not provided',
          problem: { statement: '', whoExperiences: '', desiredOutcome: '', painSeverity: 'Not provided', frequency: 'Not provided', impacts: [] },
          context: [], actors: [], requirements: [], capabilities: [], primitives: {}, objects: [], rules: [], workflowNodes: [],
          crossCutting: {},
          technology: {}
        };
        pbState.foundationProducts[id] = product;
      }
      const discover = session.discoverDraft || {};
      const define = session.defineDraft || {};
      const createContext = session.createContext || {};
      product._canonicalProductId = id;
      product.name = sourceRecord.name || record.name || 'Unnamed product';
      product.status = sourceRecord.status || record.status || 'Not provided';
      product.revision = sourceRecord.revision ?? record.revision ?? 'Not provided';
      if (createContext.domain) product.industry = createContext.domain;
      if (createContext.type) {
        product.productType = createContext.type === 'external' ? 'Customer Portal' : 'Workflow Application';
        product.variant = createContext.type === 'external' ? 'B2C Consumer' : 'Internal Enterprise';
      }
      const has = function(object, key) { return Object.prototype.hasOwnProperty.call(object || {}, key); };
      const canonicalHypothesis = Array.isArray(sourceDefinition.hypotheses) && sourceDefinition.hypotheses[0] ? sourceDefinition.hypotheses[0].change || '' : '';
      product.problem.statement = has(define, 'problemStatement') ? define.problemStatement : has(discover, 'problem') ? discover.problem : sourceDefinition.problem_statement || '';
      product.problem.whoExperiences = has(discover, 'users') ? discover.users : ((sourceDefinition.personas || [])[0]?.name || '');
      product.problem.desiredOutcome = has(define, 'outcome') ? define.outcome : has(discover, 'decision') ? discover.decision : ((sourceDefinition.hypotheses || [])[0]?.expected_outcome || '');
      product.definition = Object.assign({}, sourceDefinition, product.definition || {}, { hypothesis: has(define, 'hypothesis') ? define.hypothesis : canonicalHypothesis });
      const retainedContext = (product.context || []).filter(item => !String(item.id || '').startsWith('shared-'));
      if (pbHasText(discover.evidence)) retainedContext.unshift({ id: 'shared-evidence', type: 'Evidence note', description: discover.evidence, source: 'Product workspace', confidence: 'Unverified', importance: 'Not rated' });
      if (pbHasText(discover.constraints)) retainedContext.push({ id: 'shared-constraints', type: 'Constraint', description: discover.constraints, source: 'Product workspace', confidence: 'Unverified', importance: 'Not rated' });
      product.context = retainedContext;
      // Solution ideas never become requirements without a separate reviewed conversion.
      product.requirements = (product.requirements || []).filter(item => !String(item.id || '').startsWith('shared-option-'));
      product.gtm = Object.assign({}, session.gtmDraft || {});
      product._readinessResult = session.results?.readiness || null;
      return product;
    }

    function syncFoundationRegistry() {
      if (!pbState || !Array.isArray(pbState.products) || !pbState.products.length) return null;
      appState.products = pbState.products.map(pbFoundationRecord).filter(Boolean);
      const selectedId = pbState.activeProductId || appState.products[0]?.id;
      appState.currentProductId = selectedId;
      return appState.products.find(item => item.id === selectedId) || appState.products[0] || null;
    }

    function pbSyncChrome() {
      const product = pbActiveProduct();
      const headerName = document.getElementById('header-product-name');
      const savePill = document.getElementById('cloud-sync-pill');
      const productName = product ? (product.name || 'Unnamed product') : '';

      const field = document.getElementById(fieldId);

    function pbPageHeader(title, subtitle) {
      const titleToPage = { Discover: 'discover', Research: 'research', Define: 'define', Solution: 'solution', Launch: 'gtm', GTM: 'gtm', 'Go-to-Market': 'gtm', Readiness: 'readiness', 'Copilot & Export': 'copilot', 'Preview & Share': 'copilot' };
      const currentPage = titleToPage[title];
      const stages = pbStageCompletion();
      const current = stages.find(step => step.key === currentPage);
      const truth = pbReadinessTruth();
      const completed = truth.completed;
      const percent = truth.percent;
      const next = stages.find(step => !step.complete);
      const finalCopy = !current ? '' : next
        ? (current.complete ? esc(current.state) + '. ' : 'Current step needs input. ') + 'Next preparation gap: ' + esc(next.label) + '.'
        : 'Workflow prepared. Decision: ' + esc(truth.decision) + ' · Delivery: ' + esc(truth.delivery) + ' · Approval: ' + esc(truth.approval) + '.';
      const progress = !current ? '' : '<div class="pif-progress" role="group" aria-label="Workflow preparation"><div class="pif-progress-label"><strong>' + completed + ' of ' + stages.length + ' steps prepared · Current: ' + esc(current.label) + '</strong><span>' + percent + '% prepared</span></div><div class="pif-progress-track"><div class="pif-progress-value" style="width:' + percent + '%"></div></div><div class="pif-progress-next">' + finalCopy + '</div></div>' + pbStatusStripHtml();
      const product = pbActiveProduct();
      const productName = product ? (product.name || 'Unnamed product') : 'No product selected';
      const breadcrumb = '<nav class="pi-breadcrumb" aria-label="Breadcrumb"><span>Products</span>' + (title === 'Portfolio' ? '' : '<span title="' + esc(productName) + '">' + esc(productName) + '</span>') + '<span>' + esc(title) + '</span></nav>';
      return breadcrumb + '<div class="pif-page-heading"><div class="pif-page-heading-row"><h1>' + esc(title) + '</h1><span class="badge badge-neutral" title="Drafts stay in current page memory">Session workspace</span></div>' + (subtitle ? '<p class="page-subtitle">' + esc(subtitle) + '</p>' : '') + '</div>' + progress;
    }

    function pbDataBoundaryNotice(extra) {
      return '<details class="pif-boundary-disclosure"><summary><span class="icon" data-icon="shield-lock" aria-hidden="true"></span>Data &amp; AI boundary</summary><div class="pif-boundary-copy"><p>Drafts and assistant messages stay in page memory and clear on refresh. Product records write to local database only after explicit actions. No external model, live monitoring, or remote request.</p>' + (extra ? '<p>' + esc(extra) + '</p>' : '') + '</div></details>';

    /* ==========================================
       B1: PORTFOLIO SCREEN
       ========================================== */
    function pbApplyPortfolioFilters() {
      const search = (document.getElementById('pb-portfolio-search')?.value || '').toLocaleLowerCase().trim();
      const type = (document.getElementById('pb-portfolio-type')?.value || '').toLocaleLowerCase();
      const phase = (document.getElementById('pb-portfolio-phase')?.value || '').toLocaleLowerCase();
      const status = (document.getElementById('pb-portfolio-status')?.value || '').toLocaleLowerCase();
      const records = Array.from(document.querySelectorAll('#pb-portfolio-records .pb-portfolio-record'));
      records.forEach(function(record) {
        const matches = (!search || record.dataset.productSearch.includes(search)) &&
          (!type || record.dataset.productType === type) &&
          (!phase || record.dataset.productPhase === phase) &&
          (!status || record.dataset.productStatus === status);
        record.hidden = !matches;
      });
      const visibleCount = records.filter(function(record) { return record.classList.contains('pb-portfolio-row') && !record.hidden; }).length;
      const count = document.getElementById('pb-portfolio-filter-count');
      const empty = document.getElementById('pb-portfolio-filter-empty');
      const clear = document.getElementById('pb-portfolio-clear');
      if (count) count.textContent = visibleCount + (visibleCount === 1 ? ' product shown' : ' products shown');
      if (empty) empty.hidden = visibleCount !== 0;
      if (clear) clear.disabled = !(search || type || phase || status);
    }

    function pbResetPortfolioFilters() {
      ['pb-portfolio-search', 'pb-portfolio-type', 'pb-portfolio-phase', 'pb-portfolio-status'].forEach(function(id) {
        const field = document.getElementById(id);
        if (field) field.value = '';
      });
      pbApplyPortfolioFilters();
      const search = document.getElementById('pb-portfolio-search');
      if (search) search.focus();
    }

    function pbShowCreateProduct() {
      const f = document.getElementById('pb-create-form');
      if (f) { window._pbCreateTrigger = document.activeElement; f.hidden = false; document.body.style.overflow = 'hidden'; pbUpdateCreateProductButton(); const n = document.getElementById('pb-new-name'); if (n) n.focus(); }
    }

    function pbUpdateCreateProductButton() {
      const button = document.getElementById('pb-create-btn');
      if (!button) return;
      const complete = ['pb-new-name', 'pb-new-pitch', 'pb-new-user', 'pb-new-outcome'].every(function(id) {
        return !!String(document.getElementById(id)?.value || '').trim();
      });
      button.disabled = !complete;
    }

    function pbHideCreateProduct() {
      const f = document.getElementById('pb-create-form');
      if (f) f.hidden = true;
      document.body.style.overflow = '';
      if (window._pbCreateTrigger && window._pbCreateTrigger.focus) window._pbCreateTrigger.focus();
    }

    function pbHandleDialogKeydown(event) {
      const backdrop = document.getElementById('pb-create-form');
      if (!backdrop || backdrop.hidden) return;
      if (event.key === 'Escape') { event.preventDefault(); pbHideCreateProduct(); return; }
      if (event.key !== 'Tab') return;
      const focusable = Array.from(backdrop.querySelectorAll('button:not([disabled]), input:not([disabled]), textarea:not([disabled]), select:not([disabled])'));
      if (!focusable.length) return;
      const first = focusable[0]; const last = focusable[focusable.length - 1];
      if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
      else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
    }

    document.addEventListener('keydown', pbHandleDialogKeydown);

    function pbNavigateCreate() {
      navigateTo('pb_portfolio');
      window.setTimeout(pbShowCreateProduct, 0);
    }

    async function pbCreateProduct() {
      const btn = document.getElementById('pb-create-btn');
      const status = document.getElementById('pb-create-status');
      const name = (document.getElementById('pb-new-name')?.value || '').trim();
      const pitch = (document.getElementById('pb-new-pitch')?.value || '').trim();
      const intendedUser = (document.getElementById('pb-new-user')?.value || '').trim();
      const desiredOutcome = (document.getElementById('pb-new-outcome')?.value || '').trim();
      const stage = document.getElementById('pb-new-stage')?.value || 'idea';
      const domain = (document.getElementById('pb-new-domain')?.value || '').trim();
      const type = document.querySelector('input[name="pb-new-type"]:checked')?.value || 'internal';
      const apiType = type === 'external' ? 'external' : 'internal';
      pbSetFieldError('pb-new-name', '');
      pbSetFieldError('pb-new-pitch', ''); pbSetFieldError('pb-new-user', ''); pbSetFieldError('pb-new-outcome', '');
      const required = [{ id: 'pb-new-name', value: name, message: 'Enter product name.' }, { id: 'pb-new-pitch', value: pitch, message: 'Describe idea in one sentence.' }, { id: 'pb-new-user', value: intendedUser, message: 'Name intended user.' }, { id: 'pb-new-outcome', value: desiredOutcome, message: 'Describe desired outcome.' }];
      const missing = required.filter(item => !item.value);
      missing.forEach(item => pbSetFieldError(item.id, item.message));
      if (missing.length) { if (status) status.textContent = 'Complete highlighted setup fields.'; document.getElementById(missing[0].id)?.focus(); return; }
      if (btn) btn.disabled = true;
      if (status) status.textContent = 'Creating...';
      const result = await apiPost('/api/products/create', { name, owner: 'current-local-user', type: apiType });
      if (btn) btn.disabled = false;
      if (result._err) { if (status) status.textContent = 'Error: ' + result._err; return; }
      const rec = result.record || {};
      pbState.activeProductId = rec.product_id || name;
      const session = pbCurrentSession();
      session.record = rec;
      session.discoverDraft = { problem: pitch, users: intendedUser, evidence: '', constraints: '', decision: desiredOutcome };
      session.createContext = { stage, domain, type, desiredOutcome };
      session.dirty = true;
      if (status) status.textContent = 'Product record created. Idea draft kept in this tab.';
      showToast('Product created');
      await renderPortfolioScreen(document.getElementById('main-workspace'));
      syncFoundationRegistry();
      pbSyncChrome();
      renderSidebarNav();
    }

    async function pbOpenProduct(productId) {
      const result = await apiPost('/api/products/open', { product_id: productId });
      if (result._err) { showToast('Error: ' + result._err); return; }
      if (typeof pbCaptureVisibleDraft === 'function') pbCaptureVisibleDraft();
      appState.aiPendingClarificationByProduct = {};
      pbState.activeProductId = productId;
      if (result.record) {
        pbSession(productId).record = result.record;
        const existingIndex = pbState.products.findIndex(item => item.product_id === productId);
        if (existingIndex >= 0) pbState.products[existingIndex] = result.record;
        else pbState.products.push(result.record);
      }
      syncFoundationRegistry();
      pbSyncChrome();
      showToast('Product opened');
      navigateTo('discover', { skipDraftCapture: true });
    }

    /* ==========================================
       B2: DISCOVER SCREEN
       ========================================== */
    function renderDiscoverScreen(container) {
      const session = pbCurrentSession();
      const draft = session.discoverDraft || {};
      const q = (pbState.bootstrapData && pbState.bootstrapData.questions) || [
        { id: 'problem',     label: 'What problem or idea are you exploring?',          max_characters: 400, required: true },
        { id: 'users',       label: 'Who experiences this problem?',                    max_characters: 250, required: true },
        { id: 'evidence',    label: 'What evidence or observations do you already have?', max_characters: 300, required: false },
        { id: 'constraints', label: 'What constraints or risks matter?',               max_characters: 150, required: false },
        { id: 'decision',    label: 'What decision should this research support?',      max_characters: 100, required: true },
      ];
      const fieldHtml = {};
      const examples = {
        problem: 'Example: Support leads lose time manually identifying urgent requests.',
        users: 'Example: Support team leads handling 100+ requests each day.',
        evidence: 'Example: 18 of 30 sampled requests were reassigned at least once.',
        constraints: 'Example: No personal data; must fit current ticket workflow.',
        decision: 'Example: Decide whether to test assisted triage this quarter.'
      };
      q.forEach(function(f) {
        const fieldId = 'pb-q-' + f.id;
        fieldHtml[f.id] = '<div class="form-group ' + (f.id === 'problem' ? 'pif-span-2' : '') + '"><label class="form-label" for="' + esc(fieldId) + '">' + esc(f.label) + (f.required ? ' <span aria-hidden="true" style="color:var(--danger-color)">*</span>' : '') + '</label><textarea class="form-control" id="' + esc(fieldId) + '" rows="' + (f.id === 'problem' ? '3' : '2') + '" maxlength="' + (f.max_characters || 400) + '" placeholder="' + esc(examples[f.id] || '') + '" aria-required="' + (f.required ? 'true' : 'false') + '" aria-describedby="' + esc(fieldId) + '-help ' + esc(fieldId) + '-error" oninput="pbDraftInput()">' + esc(draft[f.id] || '') + '</textarea><p class="field-helper" id="' + esc(fieldId) + '-help">' + esc(f.required ? 'Required for problem confirmation.' : 'Optional. Leave blank if not known yet.') + ' Up to ' + (f.max_characters || 400) + ' characters.</p><div class="field-error" id="' + esc(fieldId) + '-error" hidden></div></div>';
      });
      const coreFields = ['problem', 'users', 'decision'].map(id => fieldHtml[id] || '').join('');
      const contextFields = ['evidence', 'constraints'].map(id => fieldHtml[id] || '').join('');

      container.innerHTML = '<div class="pif-page-shell">' + pbPageHeader('Discover', 'Clarify rough idea before evidence or solutions') + pbDataBoundaryNotice('This draft is not written to browser storage.') + '<div class="pif-step-contract"><div><strong>You provide</strong><span>Problem, user, decision</span></div><div><strong>PI prepares</strong><span>Research-ready brief</span></div><div><strong>Still unknown</strong><span>Evidence strength and solution</span></div><div><strong>Why it matters</strong><span>Prevents solution-first bias</span></div></div><div class="bento-card" style="margin-bottom:16px;"><h2>Clarify problem</h2><p class="section-intro">Short, concrete answers work best. Draft remains available while this tab stays open.</p><div class="pif-form-grid">' + coreFields + '</div><details class="pif-disclosure"><summary>Add evidence and constraints</summary><div class="pif-disclosure-body"><div class="pif-form-grid">' + contextFields + '</div></div></details><div class="pif-sticky-actions"><div><strong>Recommended next action</strong><span>Confirm problem, then plan research.</span></div><button class="btn btn-primary" id="pb-intake-btn" onclick="pbRunIntake()">Confirm problem</button></div><div id="pb-discover-status" aria-live="polite" class="action-status"></div></div><div id="pb-discover-result"></div></div>';

      if (session.results.discover) {
        pbRenderDiscoverResult(document.getElementById('pb-discover-result'), session.results.discover);
      }
    }

    function pbCollectAnswers() {
      const answers = {};
      ['problem','users','evidence','constraints','decision'].forEach(function(id) {
        const el = document.getElementById('pb-q-' + id);
        if (el) answers[id] = el.value.trim();
      });
      if (JSON.stringify(pbCurrentSession().discoverDraft || {}) !== JSON.stringify(answers)) {
        pbInvalidateFrom('discover');
        pbCurrentSession().dirty = true;
      }
      pbState.intakeAnswers = answers;
      pbCurrentSession().discoverDraft = Object.assign({}, answers);
      syncFoundationRegistry();
      return answers;
    }

    function pbBuildDefinitionDraft(answers) {
      const source = answers || pbCurrentSession().discoverDraft || {};
      const session = pbCurrentSession();
      const foundationComplete = pbHasText(source.problem) && pbHasText(source.users) && pbHasText(source.decision);
      if (!pbHasText(session.defineDraft.problemStatement) && pbHasText(source.problem)) {
        session.defineDraft.problemStatement = (source.users ? source.users + ' experience this problem: ' : '') + source.problem;
      }
      if (!pbHasText(session.defineDraft.hypothesis) && foundationComplete) {
        session.defineDraft.hypothesis = 'We believe helping ' + (source.users || 'intended users') + ' address this problem will improve their outcome. We will test this belief against evidence before choosing a solution.';
      }
      if (!pbHasText(session.defineDraft.outcome)) session.defineDraft.outcome = source.decision || '';
      return session.defineDraft;
    }

    async function pbRunDiscover() {
      const btn = document.getElementById('pb-discover-btn');
      const status = document.getElementById('pb-discover-status');
      const answers = pbCollectAnswers();
      ['problem','users','decision'].forEach(id => pbSetFieldError('pb-q-' + id, ''));
      const missing = ['problem','users','decision'].filter(id => !answers[id]);
      missing.forEach(id => pbSetFieldError('pb-q-' + id, 'Required before research.'));
      if (missing.length) { if (status) status.textContent = 'Complete highlighted fields.'; document.getElementById('pb-q-' + missing[0])?.focus(); return; }
      if (btn) btn.disabled = true;
      if (status) status.textContent = 'Preparing research sample...';
      const result = await apiPost('/api/discover', { message: answers.problem, answers });
      if (btn) btn.disabled = false;
      if (result._err) { if (status) status.textContent = 'Error: ' + result._err; return; }
      const session = pbCurrentSession();
      session.results.discover = result;
      session.dirty = true;
      if (status) status.textContent = 'Research sample prepared. Review evidence and gaps.';
      const d = document.getElementById('pb-discover-result');
      if (d) pbRenderDiscoverResult(d, result);
    }

    async function pbRunIntake() {
      const btn = document.getElementById('pb-intake-btn');
      const status = document.getElementById('pb-discover-status');
      const answers = pbCollectAnswers();
      ['problem','users','decision'].forEach(id => pbSetFieldError('pb-q-' + id, ''));
      const missing = ['problem','users','decision'].filter(id => !answers[id]);
      missing.forEach(id => pbSetFieldError('pb-q-' + id, 'Required before definition.'));
      if (missing.length) { if (status) status.textContent = 'Complete highlighted fields.'; document.getElementById('pb-q-' + missing[0])?.focus(); return; }
      if (btn) btn.disabled = true;
      if (status) status.textContent = 'Preparing intake...';
      const result = await apiPost('/api/intake', { answers });
      if (btn) btn.disabled = false;
      if (result._err) { if (status) status.textContent = 'Error: ' + result._err; return; }
      const session = pbCurrentSession();
      session.intakePrepared = true;
      session.intakeResult = result;
      session.dirty = true;
      pbBuildDefinitionDraft(answers);
      if (status) status.textContent = 'Problem confirmed. Research plan ready.';
      showToast('Problem confirmed');
      navigateTo('research');
    }

    function pbRenderDiscoverResult(container, data) {
      const insight = data.insight || {};
      const factors = insight.research_coverage || data.research_coverage || [];
      const problems = insight.ranked_problems || data.ranked_problems || [];
      const opportunities = insight.ranked_opportunities || data.ranked_opportunities || [];
      const risks = insight.risks || data.risks || [];
      const unknowns = insight.unknowns || data.unknowns || [];
      const limitation = esc(data.limitation || 'Sample data only. No live research.');
      const summary = esc(insight.summary || data.summary || 'Research sample ready');

      const factorRows = factors.map(function(f) {
        const statusText = f.status === 'ASSESSED' ? 'Checked' : f.status === 'UNKNOWN' ? 'Needs evidence' : pbHumanLabel(f.status || 'In review');

      const oppItems = opportunities.map(function(o, i) {
        return '<li style="padding:8px 0;border-bottom:1px solid var(--border-subtle);"><strong style="font-size:13px;">' + esc(pbHumanLabel(o.label || o.name || o.id || 'Opportunity ' + (i + 1))) + '</strong><span style="float:right;font-size:12px;color:var(--accent-text);">' + (o.score == null ? 'Not scored' : 'Score ' + esc(String(o.score))) + '</span><div style="font-size:12px;color:var(--text-secondary);margin-top:2px;">Reach ' + esc(String(o.addressable_value_or_reach == null ? 'Not provided' : o.addressable_value_or_reach)) + ' &middot; Motivation ' + esc(String(o.user_motivation == null ? 'Not provided' : o.user_motivation)) + '</div></li>';

        '<div class="pif-form-grid">' +
        (problems.length ? '<section class="bento-card"><h3 style="font-size:14px;font-weight:800;margin-bottom:8px;">Ranked problems</h3><ul style="list-style:none;">' + probItems + '</ul></section>' : '') +
        (opportunities.length ? '<section class="bento-card"><h3 style="font-size:14px;font-weight:800;margin-bottom:8px;">Ranked opportunities</h3><ul style="list-style:none;">' + oppItems + '</ul></section>' : '') + '</div>' +
        (factors.length ? '<details class="pif-disclosure"><summary>Research coverage · ' + factors.length + ' factors</summary><div class="pif-disclosure-body pif-data-table-wrap"><table style="width:100%;border-collapse:collapse;font-size:13px;"><thead><tr style="border-bottom:1px solid var(--border-color);"><th style="padding:6px 10px;text-align:left;font-size:11px;color:var(--text-muted);">Factor</th><th style="padding:6px 10px;text-align:left;font-size:11px;color:var(--text-muted);">Status</th><th style="padding:6px 10px;text-align:left;font-size:11px;color:var(--text-muted);">Gap</th></tr></thead><tbody>' + factorRows + '</tbody></table></div></details>' : '') +

    /* ==========================================

       ========================================== */
    function renderResearchScreen(container) {
      const result = pbSessionResult('research');
      const questions = ['Who has problem and how often?', 'How severe is current friction?', 'What workarounds exist?', 'What evidence supports claim?', 'What evidence contradicts it?', 'Who buys or approves?', 'Which alternatives compete?', 'Which constraints shape solution?', 'What privacy or security limits apply?', 'What outcome can be measured?', 'Which assumptions remain weakest?'];
      container.innerHTML = '<div class="pif-page-shell">' +
        pbPageHeader('Research', 'Plan evidence review before using sample local analysis') +
        pbDataBoundaryNotice('Research uses sample local data. It is not live market evidence.') +
        '<div class="pif-step-contract"><div><strong>You provide</strong><span>Confirmed problem brief</span></div><div><strong>PI prepares</strong><span>Evidence map and confidence</span></div><div><strong>Still unknown</strong><span>Live-source validation</span></div><div><strong>Why it matters</strong><span>Surfaces weak assumptions</span></div></div>' +
        '<div class="bento-card research-preview" style="margin-bottom:24px;"><div class="card-heading-row"><div><span class="badge badge-info">Preview</span><h2>Research plan</h2></div><span class="badge badge-neutral">11 questions</span></div><div class="research-question-grid">' + questions.map((q, i) => '<div><span>' + (i + 1) + '</span><p>' + esc(q) + '</p></div>').join('') + '</div><div class="pif-info-grid"><div><strong>Evidence policy</strong><span>Sample records only; sources and conflicts shown.</span></div><div><strong>Output</strong><span>Coverage, evidence, ranked problems, risks.</span></div><div><strong>Confidence</strong><span>Shown for each item; missing details stay visible.</span></div><div><strong>Limitation</strong><span>No browsing, interviews, or external validation.</span></div></div><div class="pif-sticky-actions"><div><strong>Recommended next action</strong><span>Run local analysis, then review evidence.</span></div><button class="btn btn-primary" id="pb-research-run-btn" onclick="pbRunResearch()">' + (result ? 'Run analysis again' : 'Run local analysis') + '</button></div><div id="pb-research-status" aria-live="polite" class="action-status"></div></div>' +
        '<div id="pb-research-result"></div></div>';
      if (result) {
        pbRenderResearchResult(document.getElementById('pb-research-result'), result);
      }
    }

    async function pbRunResearch() {
      const btn = document.getElementById('pb-research-run-btn');
      const status = document.getElementById('pb-research-status');
      const resultDiv = document.getElementById('pb-research-result');
      if (btn) btn.disabled = true;
      if (status) status.textContent = 'Checking 11 sample evidence factors...';
      if (resultDiv) resultDiv.innerHTML = pbLoading('Analysing...');
      const prod = pbActiveProduct();
      const result = await apiPost('/api/research', { product_id: prod && prod.product_id });
      if (btn) btn.disabled = false;
      if (result._err) { if (status) status.textContent = 'Error: ' + result._err; if (resultDiv) resultDiv.innerHTML = pbError(result._err); return; }
      pbSetSessionResult('research', result);
      renderResearchScreen(document.getElementById('main-workspace'));
      const refreshedStatus = document.getElementById('pb-research-status');
      if (refreshedStatus) refreshedStatus.textContent = 'Research review prepared · sample local data only.';
      renderSidebarNav();
    }

    function pbRenderResearchResult(container, result) {
      const research = result.research || {};
      const rankings = result.rankings || {};
      const factors = research.factor_coverage || [];
      const evidence = research.evidence || [];
      const problems = rankings.ranked_problems || [];
      const opportunities = rankings.ranked_opportunities || [];
      const risks = research.risks || [];
      const evidenceById = Object.fromEntries(evidence.map(function(item) { return [item.id, item]; }));

      const factorRows = factors.map(function(f) {
        const statusText = f.status === 'ASSESSED' ? 'Checked' : f.status === 'NOT_RELEVANT' ? 'Not needed' : 'Needs evidence';
        const evidenceLabels = (f.evidence_ids || []).map(function(id) { const item = evidenceById[id] || {}; return '<span class="badge badge-info" style="margin-right:4px;">' + esc(pbHumanLabel(item.source_ref || item.factor || id)) + '</span>'; }).join('');
        return '<tr><td style="padding:8px 12px;font-size:13px;font-weight:700;">' + esc(pbHumanLabel(f.factor || 'Not provided')) + '</td><td style="padding:8px 12px;"><span class="badge badge-' + (f.status === 'ASSESSED' ? 'info' : f.status === 'NOT_RELEVANT' ? 'neutral' : 'required') + '">' + esc(statusText) + '</span></td><td style="padding:8px 12px;font-size:12px;color:var(--text-secondary);">' + (evidenceLabels || 'No linked evidence yet') + '</td></tr>';
      }).join('');

      const evidenceItems = evidence.map(function(e) {
        return '<div style="background:var(--bg-body);border:1px solid var(--border-color);border-radius:var(--radius-md);padding:12px;margin-bottom:8px;"><div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;"><span class="badge badge-info">' + esc(pbHumanLabel(e.source_type || 'Evidence')) + '</span><span style="font-size:11px;color:var(--text-muted);">' + esc(pbHumanLabel(e.factor || 'Not provided')) + '</span><span style="font-size:11px;color:var(--text-muted);margin-left:auto;">Confidence ' + esc(String(e.confidence == null ? 'Not provided' : e.confidence)) + '</span></div><p style="font-size:13px;margin:0;">' + esc(e.observation || 'No observation provided') + '</p><p style="font-size:11px;color:var(--text-muted);margin-top:4px;">Source: ' + esc(pbReadableToken(e.source_ref, 'Not provided')) + '</p></div>';
      }).join('');

      const probRows = problems.map(function(p, i) {
        return '<tr><td style="padding:8px 12px;font-size:13px;font-weight:700;">' + esc(pbHumanLabel(p.label || p.name || p.id || 'Problem ' + (i + 1))) + '</td><td style="padding:8px 12px;">' + esc(String(p.impact == null ? 'Not provided' : p.impact)) + '</td><td style="padding:8px 12px;">' + esc(String(p.frequency == null ? 'Not provided' : p.frequency)) + '</td><td style="padding:8px 12px;">' + esc(String(p.evidence_strength == null ? 'Not provided' : p.evidence_strength)) + '</td><td style="padding:8px 12px;font-size:12px;color:var(--accent-text);font-weight:700;">' + esc(String(p.score == null ? 'Not scored' : p.score)) + '</td></tr>';
      }).join('');

      const oppRows = opportunities.map(function(o, i) {
        return '<tr><td style="padding:8px 12px;font-size:13px;font-weight:700;">' + esc(pbHumanLabel(o.label || o.name || o.id || 'Opportunity ' + (i + 1))) + '</td><td style="padding:8px 12px;">' + esc(String(o.addressable_value_or_reach == null ? 'Not provided' : o.addressable_value_or_reach)) + '</td><td style="padding:8px 12px;">' + esc(String(o.user_motivation == null ? 'Not provided' : o.user_motivation)) + '</td><td style="padding:8px 12px;">' + esc(String(o.strategic_fit == null ? 'Not provided' : o.strategic_fit)) + '</td><td style="padding:8px 12px;font-size:12px;color:var(--accent-text);font-weight:700;">' + esc(String(o.score == null ? 'Not scored' : o.score)) + '</td></tr>';
      }).join('');

      const riskItems = risks.map(function(r) {
        return '<div style="display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid var(--border-subtle);"><span class="badge badge-' + (r.severity === 'HIGH' ? 'required' : 'info') + '">' + esc(pbHumanLabel(r.severity || 'Not rated')) + '</span><div><div style="font-size:13px;font-weight:700;">' + esc(pbHumanLabel(r.name || r.description || r.id || 'Risk')) + '</div><div style="font-size:12px;color:var(--text-secondary);">' + esc(r.mitigation || 'No mitigation provided') + '</div></div></div>';
      }).join('');

      container.innerHTML =
        '<div class="pif-safety-note">Sample evidence only · No live sources or network access</div>' +
        '<details class="pif-disclosure" open><summary>Research coverage · ' + factors.length + ' factors</summary><div class="pif-disclosure-body pif-data-table-wrap"><table style="width:100%;border-collapse:collapse;font-size:13px;"><thead><tr style="border-bottom:2px solid var(--border-color);"><th scope="col" style="padding:8px 12px;text-align:left;font-size:11px;color:var(--text-muted);">Factor</th><th scope="col" style="padding:8px 12px;text-align:left;font-size:11px;color:var(--text-muted);">Status</th><th scope="col" style="padding:8px 12px;text-align:left;font-size:11px;color:var(--text-muted);">Evidence</th></tr></thead><tbody>' + (factorRows || '<tr><td colspan="3" style="padding:12px;color:var(--text-muted);">No evidence items yet</td></tr>') + '</tbody></table></div></details>' +
        (evidence.length ? '<details class="pif-disclosure"><summary>Evidence library · ' + evidence.length + ' records</summary><div class="pif-disclosure-body">' + evidenceItems + '</div></details>' : '') +
        (problems.length ? '<section class="bento-card" style="margin-bottom:16px;"><h3 style="font-size:15px;font-weight:800;margin-bottom:4px;">Ranked problems</h3><p style="font-size:12px;color:var(--text-secondary);margin-bottom:12px;">Severity and evidence strength. Kept separate from opportunity value.</p><div class="pif-data-table-wrap"><table style="width:100%;border-collapse:collapse;font-size:13px;"><thead><tr style="border-bottom:2px solid var(--border-color);"><th scope="col" style="padding:8px 12px;text-align:left;font-size:11px;color:var(--text-muted);">Problem</th><th scope="col" style="padding:8px 12px;text-align:left;font-size:11px;color:var(--text-muted);">Impact</th><th scope="col" style="padding:8px 12px;text-align:left;font-size:11px;color:var(--text-muted);">Frequency</th><th scope="col" style="padding:8px 12px;text-align:left;font-size:11px;color:var(--text-muted);">Evidence</th><th scope="col" style="padding:8px 12px;text-align:left;font-size:11px;color:var(--text-muted);">Score</th></tr></thead><tbody>' + probRows + '</tbody></table></div></section>' : '') +
        (opportunities.length ? '<section class="bento-card" style="margin-bottom:16px;"><h3 style="font-size:15px;font-weight:800;margin-bottom:4px;">Ranked opportunities</h3><p style="font-size:12px;color:var(--text-secondary);margin-bottom:12px;">Reach, motivation, and strategic fit—not problem severity.</p><div class="pif-data-table-wrap"><table style="width:100%;border-collapse:collapse;font-size:13px;"><thead><tr style="border-bottom:2px solid var(--border-color);"><th scope="col" style="padding:8px 12px;text-align:left;font-size:11px;color:var(--text-muted);">Opportunity</th><th scope="col" style="padding:8px 12px;text-align:left;font-size:11px;color:var(--text-muted);">Reach</th><th scope="col" style="padding:8px 12px;text-align:left;font-size:11px;color:var(--text-muted);">Motivation</th><th scope="col" style="padding:8px 12px;text-align:left;font-size:11px;color:var(--text-muted);">Fit</th><th scope="col" style="padding:8px 12px;text-align:left;font-size:11px;color:var(--text-muted);">Score</th></tr></thead><tbody>' + oppRows + '</tbody></table></div></section>' : '') +
        (risks.length ? '<div class="bento-card" style="margin-bottom:16px;"><h3 style="font-size:15px;font-weight:800;margin-bottom:12px;">Risks</h3>' + riskItems + '</div>' : '') +
        '<div style="display:flex;gap:10px;"><button class="btn btn-secondary btn-sm" onclick="navigateTo(\'define\')"><span>Continue to define</span>' + localIcon('arrow-right') + '</button></div>';
    }

    /* ==========================================
       B4: DEFINE SCREEN
       ========================================== */
    function renderDefineScreen(container) {
      const session = pbCurrentSession();
      const source = session.discoverDraft || pbState.intakeAnswers || {};
      const draft = pbBuildDefinitionDraft(source);
      const activeDefinition = (session.record && session.record.blueprint && session.record.blueprint.definition) || {};
      const defaultDefinition = Object.keys(activeDefinition).length ? activeDefinition : ((pbState.bootstrapData && pbState.bootstrapData.default_product && pbState.bootstrapData.default_product.definition) || {});
      const defaultProblems = defaultDefinition.selected_problem_ids || [];
      const researchResult = pbSessionResult('research');
      const selectedProblems = Array.isArray(draft.selectedProblemIds) && draft.selectedProblemIds.length ? draft.selectedProblemIds : (researchResult ? defaultProblems : []);
      const supportedIds = new Set((defaultDefinition.hypotheses || []).map(function(item) { return item.problem_id; }).filter(Boolean));
      const discoverResult = session.results.discover || {};
      const rankedProblems = (researchResult && researchResult.rankings && researchResult.rankings.ranked_problems) || (discoverResult.insight && discoverResult.insight.ranked_problems) || [];
      const selectableProblems = rankedProblems.slice();
      if (researchResult) defaultProblems.forEach(function(id) { if (!selectableProblems.some(function(item) { return item.id === id; })) selectableProblems.push({ id: id }); });
      const problemOptions = selectableProblems.map(function(p, index) {
        const id = p.id || '';
        const supported = supportedIds.has(id);
        const label = p.title || p.statement || p.problem || pbHumanLabel(id) || 'Research finding ' + (index + 1);
        const evidence = p.evidence_strength == null ? 'Evidence pending' : 'Evidence ' + p.evidence_strength;
        const score = p.score == null ? '' : '<span class="badge badge-info">score ' + esc(String(p.score)) + '</span>';
        return '<label class="pif-problem-option' + (supported ? '' : ' is-disabled') + '"><input type="radio" name="pb-def-problem" value="' + esc(id) + '" ' + (selectedProblems.includes(id) && supported ? 'checked' : '') + (supported ? ' onchange="pbDraftInput()"' : ' disabled') + '><span><strong>' + esc(label) + '</strong><span>' + esc(evidence) + (supported ? '' : ' · No matching saved hypothesis') + '</span></span>' + score + '</label>';
      }).join('');

      container.innerHTML = '<div class="pif-page-shell">' + pbPageHeader('Define', 'Turn problem brief into one testable product belief') + pbDataBoundaryNotice('Generated wording is editable and remains unverified until reviewed.') + '<div class="pif-step-contract"><div><strong>You provide</strong><span>Edits and expected outcome</span></div><div><strong>PI prepares</strong><span>Problem statement and hypothesis</span></div><div><strong>Still unknown</strong><span>Whether hypothesis is true</span></div><div><strong>Why it matters</strong><span>Defines what evidence must prove</span></div></div>' +
        '<div class="bento-card" style="margin-bottom:16px;"><div class="card-heading-row"><div><h2>Review definition</h2><p class="section-intro">One editable hypothesis generated from Discover context.</p></div><span class="badge badge-neutral">Unverified draft</span></div>' +
        '<div class="form-group"><label class="form-label" for="pb-def-problem-statement">Problem statement <span aria-hidden="true" class="required-mark">*</span></label><textarea class="form-control" id="pb-def-problem-statement" maxlength="500" required oninput="pbDraftInput()">' + esc(draft.problemStatement || '') + '</textarea><div class="field-error" id="pb-def-problem-statement-error" hidden></div></div>' +
        '<div class="form-group"><div class="pif-field-heading"><label class="form-label" for="pb-def-hypothesis">Editable product hypothesis <span aria-hidden="true" class="required-mark">*</span></label><button type="button" class="btn btn-ghost ask-copilot-btn" onclick="askCopilotAbout(\'hypothesis\')">' + localIcon('message-spark') + 'Ask π Gen</button></div><textarea class="form-control" id="pb-def-hypothesis" maxlength="600" required oninput="pbDraftInput()">' + esc(draft.hypothesis || '') + '</textarea><p class="field-helper">Required for this draft. Check below uses saved evidence and does not save this wording.</p><div class="field-error" id="pb-def-hypothesis-error" hidden></div></div>' +
        '<div class="form-group"><label class="form-label" for="pb-def-outcome">Expected measurable outcome <span aria-hidden="true" class="required-mark">*</span></label><input class="form-control" id="pb-def-outcome" maxlength="240" value="' + esc(draft.outcome || '') + '" placeholder="Example: Reduce median triage time from 12 to 8 minutes in 6 weeks" oninput="pbDraftInput()" /><p class="field-helper">Session planning note; current saved-record check does not persist or score this field.</p><div class="field-error" id="pb-def-outcome-error" hidden></div></div>' +
        '<fieldset class="pif-evidence-fieldset"><legend>Select evidence-backed finding</legend>' + (problemOptions || '<div class="pif-safety-note">Research has not produced selectable evidence. Run Research first.</div>') + '<div class="field-error" id="pb-def-problems-error" hidden></div></fieldset>' +
        '<details class="pif-disclosure"><summary>Imported Discover context</summary><div class="pif-disclosure-body pif-imported-context"><div><strong>Intended user</strong><p>' + esc(source.users || 'Not provided') + '</p></div><div><strong>Decision</strong><p>' + esc(source.decision || 'Not provided') + '</p></div><div><strong>Constraints</strong><p>' + esc(source.constraints || 'Not provided') + '</p></div></div></details>' +
        '<div class="pif-sticky-actions"><div><strong>Recommended next action</strong><span>Check saved evidence link, then compare solutions.</span></div><button class="btn btn-primary" id="pb-define-btn" onclick="pbSubmitDefinition()">Check saved evidence link</button></div>' +
        '<div id="pb-define-status" aria-live="polite" class="action-status"></div></div>' +
        '<div id="pb-define-result"></div></div>';

      const result = pbSessionResult('define');
      if (result) {
        pbRenderDefineResult(document.getElementById('pb-define-result'), result);
      }
    }

    async function pbSubmitDefinition() {
      const btn = document.getElementById('pb-define-btn');
      const status = document.getElementById('pb-define-status');
      pbCaptureVisibleDraft();
      const session = pbCurrentSession();
      const draft = session.defineDraft;
      const source = session.discoverDraft || {};
      const answers = { problem: draft.problemStatement || '', users: source.users || '', evidence: source.evidence || '', constraints: source.constraints || '', decision: source.decision || '' };
      const selectedIds = Array.from(document.querySelectorAll('input[name="pb-def-problem"]:checked')).map(function(input) { return input.value; });
      const prod = pbActiveProduct();
      ['pb-def-problem-statement','pb-def-hypothesis','pb-def-outcome'].forEach(id => pbSetFieldError(id, ''));
      const missing = [{ id: 'pb-def-problem-statement', value: draft.problemStatement }, { id: 'pb-def-hypothesis', value: draft.hypothesis }, { id: 'pb-def-outcome', value: draft.outcome }].filter(item => !pbHasText(item.value));
      missing.forEach(item => pbSetFieldError(item.id, 'Required for definition.'));
      const problemError = document.getElementById('pb-def-problems-error');
      if (problemError) { problemError.textContent = selectedIds.length ? '' : 'Select at least one researched problem.'; problemError.hidden = selectedIds.length > 0; }
      if (missing.length || !selectedIds.length) { if (status) status.textContent = 'Complete highlighted definition fields.'; (missing.length ? document.getElementById(missing[0].id) : document.querySelector('input[name="pb-def-problem"]'))?.focus(); return; }
      if (btn) btn.disabled = true;
      if (status) status.textContent = 'Submitting...';
      const result = await apiPost('/api/definition', { product_id: prod && prod.product_id, answers, selected_problem_ids: selectedIds });
      if (btn) btn.disabled = false;
      if (result._err) { if (status) status.textContent = 'Error: ' + result._err; return; }
      pbSetSessionResult('define', result);
      const gateStatus = result.gate_status || result.status || 'BLOCKED';
      const blockers = result.blockers || [];
      renderDefineScreen(document.getElementById('main-workspace'));
      const refreshedStatus = document.getElementById('pb-define-status');
      if (refreshedStatus) refreshedStatus.textContent = gateStatus === 'READY_FOR_REVIEW' && !blockers.length ? 'Definition ready for review · review-only, not persisted.' : 'Definition blocked · resolve ' + blockers.map(pbHumanLabel).join(', ') + '.';
      renderSidebarNav();
    }

    function pbRenderDefineResult(container, data) {
      const status = data.gate_status || data.status || 'NOT_CHECKED';
      const proposal = data.definition_proposal || data.proposal || {};
      const hypotheses = proposal.hypotheses || data.hypotheses || [];
      const blockers = data.blockers || [];
      const ready = status === 'READY_FOR_REVIEW' && !blockers.length;
      const badge = ready ? 'success' : 'warning';
      const statusLabel = ready ? 'Ready for review' : 'Blocked';

      const hypoItems = hypotheses.map(function(h) {
        return '<div style="background:var(--bg-body);border:1px solid var(--border-color);border-radius:var(--radius-md);padding:10px;margin-bottom:6px;"><div style="font-size:13px;"><strong>' + esc(h.change || 'Not provided') + '</strong></div><div style="font-size:12px;color:var(--text-secondary);">Expected: ' + esc(h.expected_outcome || 'Not provided') + '</div><div style="font-size:12px;color:var(--text-muted);">Status: ' + esc(pbStateLabel(h.status || 'Draft')) + '</div></div>';
      }).join('');

      const blockerList = blockers.length ? '<div role="alert" style="background:var(--warning-light);border:1px solid var(--warning-color);border-radius:var(--radius-md);padding:10px;margin-top:8px;"><strong style="color:var(--warning-color);">Resolve before Solution:</strong><ul style="margin:6px 0 0 16px;">' + blockers.map(function(b) { return '<li style="font-size:13px;">' + esc(pbHumanLabel(b)) + '</li>'; }).join('') + '</ul></div>' : '';

      container.innerHTML = '<div class="bento-card"><div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;"><h3 style="font-size:15px;font-weight:800;flex:1;">Definition review</h3><span class="badge badge-' + badge + '">' + esc(statusLabel) + '</span><span class="badge badge-neutral">Review-only</span></div>' +
        (proposal.vision ? '<p style="font-size:13px;margin-bottom:8px;"><strong>Vision:</strong> ' + esc(proposal.vision) + '</p>' : '') +
        (proposal.problem_statement ? '<p style="font-size:13px;margin-bottom:8px;"><strong>Problem:</strong> ' + esc(proposal.problem_statement) + '</p>' : '') +
        (hypotheses.length ? '<h4 style="font-size:12px;font-weight:800;color:var(--text-muted);margin-bottom:6px;">Hypotheses</h4>' + hypoItems : '') +
        blockerList +
        '<div style="display:flex;gap:10px;margin-top:12px;"><button class="btn btn-primary btn-sm" onclick="navigateTo(\'solution\')"' + (ready ? '' : ' disabled title="Resolve definition blockers first"') + '>Compare solutions</button></div></div>';
    }

    /* ==========================================
       B5: SOLUTION SCREEN
       ========================================== */
    function pbRiceMetricsReady() {
      const session = pbCurrentSession();
      const record = session.record || pbActiveProduct() || {};
      const candidates = session.results.solution?.ranked_epics || session.results.solution?.epics || record.blueprint?.solution?.epics || [];
      if (!Array.isArray(candidates) || !candidates.length) return false;
      return candidates.every(function(item) {
        return ['reach', 'impact', 'confidence', 'effort'].every(function(key) {
          const value = Number(item && item[key]);
          return Number.isFinite(value) && value > 0;
        });
      });
    }

    function renderSolutionScreen(container) {
      const session = pbCurrentSession();
      const draft = session.solutionDraft || { options: ['', '', ''] };
      if (!Array.isArray(draft.options)) draft.options = ['', '', ''];
      const riceReady = pbRiceMetricsReady();
      container.innerHTML = '<div class="pif-page-shell">' + pbPageHeader('Solution', 'Compare solution options before prioritizing work') + pbDataBoundaryNotice('Options and scoring stay in this tab until explicit solution action.') + '<div class="pif-step-contract"><div><strong>You provide</strong><span>At least two solution options</span></div><div><strong>PI prepares</strong><span>Ranked experiment backlog</span></div><div><strong>Still unknown</strong><span>Real user response and effort</span></div><div><strong>Why it matters</strong><span>Prevents locking into first idea</span></div></div>' +
        '<div class="bento-card" style="margin-bottom:16px;"><div class="card-heading-row"><div><h2>Compare solution options</h2><p class="section-intro">Add distinct outcomes to test. Ideas remain options until separately converted and reviewed as requirements.</p></div><div style="display:flex;gap:8px;align-items:center;"><span class="badge badge-info">2 required</span><button type="button" class="btn btn-ghost ask-copilot-btn" onclick="askCopilotAbout(\'solution options\')">' + localIcon('message-spark') + 'Ask π Gen</button></div></div><div class="solution-option-list">' + [0,1,2].map(function(i) { return '<div class="form-group"><label class="form-label" for="pb-solution-option-' + i + '">Option ' + (i + 1) + (i < 2 ? ' <span class="required-mark">*</span>' : ' <span class="optional-label">Optional</span>') + '</label><textarea class="form-control" id="pb-solution-option-' + i + '" rows="2" maxlength="300" placeholder="Describe outcome, not requirement" oninput="pbDraftInput()">' + esc(draft.options[i] || '') + '</textarea><div class="field-error" id="pb-solution-option-' + i + '-error" hidden></div></div>'; }).join('') + '</div><div class="method-recommendation"><div><span class="badge badge-info">Recommended for draft</span><h3>Value vs effort</h3><p>Use RICE only after reach, impact, confidence, and effort values exist for every option.</p></div><div class="method-actions"><button class="btn btn-secondary" id="pb-sol-moscow" aria-pressed="false" onclick="pbRunSolution(\'moscow\')">MoSCoW</button><button class="btn btn-primary" id="pb-sol-ve" aria-pressed="true" onclick="pbRunSolution(\'value_effort\')">Value vs effort</button><button class="btn btn-secondary" id="pb-sol-rice" aria-pressed="false" onclick="pbRunSolution(\'rice\')"' + (riceReady ? '' : ' disabled title="Add reach, impact, confidence, and effort for every option"') + '>RICE</button></div></div><div id="pb-solution-status" aria-live="polite" class="action-status"></div></div><div id="pb-solution-result"></div></div>';
      const result = pbSessionResult('solution');
      if (result) {
        pbRenderSolutionResult(document.getElementById('pb-solution-result'), result);

    async function pbRunSolution(method) {
      const status = document.getElementById('pb-solution-status');
      pbCaptureVisibleDraft();
      const session = pbCurrentSession();
      const options = (session.solutionDraft.options || []).filter(pbHasText);
      [0,1].forEach(i => pbSetFieldError('pb-solution-option-' + i, ''));
      if (options.length < 2) {
        [0,1].forEach(i => { if (!pbHasText(session.solutionDraft.options[i])) pbSetFieldError('pb-solution-option-' + i, 'Add at least two solution options.'); });
        if (status) status.textContent = 'Add at least two options before prioritizing.';
        return;
      }
      if (method === 'rice' && !pbRiceMetricsReady()) {
        if (status) status.textContent = 'RICE needs reach, impact, confidence, and effort for every option.';
        return;
      }
      session.solutionDraft.method = method;
      ['pb-sol-moscow','pb-sol-ve','pb-sol-rice'].forEach(function(id) { const b = document.getElementById(id); if (b) b.disabled = true; });
      if (status) status.textContent = 'Prioritizing with ' + pbHumanLabel(method) + '...';
      const prod = pbActiveProduct();
      const result = await apiPost('/api/solution', { product_id: prod && prod.product_id, method });
      ['pb-sol-moscow','pb-sol-ve'].forEach(function(id) { const b = document.getElementById(id); if (b) b.disabled = false; });
      const riceButton = document.getElementById('pb-sol-rice'); if (riceButton) riceButton.disabled = !pbRiceMetricsReady();
      if (result._err) { if (status) status.textContent = 'Error: ' + result._err; return; }
      pbSetSessionResult('solution', result);
      if (status) status.textContent = 'Prioritization prepared with ' + pbHumanLabel(result.method || method) + '.';
      ['pb-sol-moscow','pb-sol-ve','pb-sol-rice'].forEach(function(id) { const b = document.getElementById(id); if (b) { b.className = 'btn btn-secondary'; b.setAttribute('aria-pressed', 'false'); } });
      const activeId = method === 'moscow' ? 'pb-sol-moscow' : method === 'value_effort' ? 'pb-sol-ve' : 'pb-sol-rice';
      const ab = document.getElementById(activeId); if (ab) { ab.className = 'btn btn-primary'; ab.setAttribute('aria-pressed', 'true'); }
      const d = document.getElementById('pb-solution-result');
      if (d) pbRenderSolutionResult(d, result);
      renderSolutionScreen(document.getElementById('main-workspace'));
      const refreshedStatus = document.getElementById('pb-solution-status');
      if (refreshedStatus) refreshedStatus.textContent = 'Draft prioritization prepared with ' + pbHumanLabel(result.method || method) + '.';
      renderSidebarNav();
    }

    async function pbRunGTM() {
      const btn = document.getElementById('pb-gtm-run-btn');

      const resultDiv = document.getElementById('pb-gtm-result');
      pbCaptureVisibleDraft();

      if (status) status.textContent = 'Checking saved plan...';

      const result = await apiPost('/api/gtm', { product_id: prod && prod.product_id });

    async function pbRunReadiness() {
      const btn = document.getElementById('pb-readiness-run-btn');
      const status = document.getElementById('pb-readiness-status');
      const resultDiv = document.getElementById('pb-readiness-result');
      if (btn) btn.disabled = true;
      if (status) status.textContent = 'Assessing product readiness...';
      if (resultDiv) resultDiv.innerHTML = pbLoading('Assessing...');
      const prod = pbActiveProduct();
      const result = await apiPost('/api/readiness', { product_id: prod && prod.product_id });
      if (btn) btn.disabled = false;
      if (result._err) { if (status) status.textContent = 'Error: ' + result._err; if (resultDiv) resultDiv.innerHTML = pbError(result._err); return; }
      pbSetSessionResult('readiness', result);
      renderReadinessScreen(document.getElementById('main-workspace'));
      const refreshedStatus = document.getElementById('pb-readiness-status');
      const decisionGaps = result.blockers || result.missing_items || [];
      const decisionState = String(result.status || '').toUpperCase();
      const decisionLabel = decisionState === 'READY' && !decisionGaps.length ? 'ready' : decisionState === 'BLOCKED' || decisionGaps.length ? 'blocked' : 'not checked yet';
      if (refreshedStatus) refreshedStatus.textContent = 'Assessment prepared · decision ' + decisionLabel + '. Review separate gaps below.';
      renderSidebarNav();
    }

    function pbRenderReadinessResult(container, result) {
      const score = result.product_readiness_score;
      const checks = result.checks || [];
      const blockers = result.blockers || [];
      const risks = result.open_risks || [];
      const approvals = result.pending_approvals || [];
      const unknowns = result.unknown_metrics || [];
      const missingEvidence = result.missing_evidence || [];
      const scorePct = score != null ? Math.round(score * 100) : null;
      const decisionReady = result.status === 'READY' && blockers.length === 0;
      const decisionBlocked = result.status === 'BLOCKED' || blockers.length > 0;
      const decisionLabel = decisionReady ? 'Ready' : decisionBlocked ? 'Blocked' : 'Not checked yet';
      const scoreColor = decisionReady ? 'var(--success-color)' : 'var(--peacock-blue)';
      const pendingApprovals = approvals.filter(function(item) { return !!item && item.required !== false && String(item.status || 'PENDING').toUpperCase() !== 'APPROVED'; });

      const checkItems = checks.map(function(c) {
        return '<div class="readiness-check">' + localIcon(c.passed ? 'circle-check' : 'circle') + '<div><strong>' + esc(pbHumanLabel(c.kind || 'Readiness check')) + '</strong>' + (c.blocker ? '<span class="badge badge-warning">Decision blocker</span>' : '') + '<small>Evidence weight ' + esc(String(c.weight == null ? 'Not scored' : c.weight)) + '</small></div><span class="badge badge-' + (c.passed ? 'info' : 'warning') + '">' + (c.passed ? 'Evidence present' : 'Needs work') + '</span></div>';
      }).join('');

      container.innerHTML =
        '<div class="pif-safety-note">Evidence assessment only. Decision status may be blocked even when score is high. Delivery, security, legal, and compliance have not been checked.</div>' +
        '<div class="pif-readiness-grid"><div class="bento-card"><div class="bento-stat-label">Configured readiness-check score</div><div class="bento-stat-value" style="color:' + scoreColor + ';">' + (scorePct != null ? scorePct + '%' : 'Not checked yet') + '</div>' + (scorePct != null ? '<div class="progress-track" style="margin-top:8px;"><div class="progress-bar" style="width:' + scorePct + '%;"></div></div>' : '') + '<p class="section-intro">Score does not represent overall evidence confidence or delivery readiness.</p></div><div class="bento-card"><div class="bento-stat-label">Decision readiness</div><div class="bento-stat-value" style="font-size:22px;">' + decisionLabel + '</div><p class="section-intro">' + blockers.length + ' blockers.</p></div><div class="bento-card"><div class="bento-stat-label">Delivery readiness</div><div class="bento-stat-value" style="font-size:22px;">Not checked yet</div><p class="section-intro">Delivery check is unavailable in local preview.</p></div><div class="bento-card"><div class="bento-stat-label">Approval status</div><div class="bento-stat-value" style="font-size:22px;">' + (pendingApprovals.length ? pendingApprovals.length + ' pending' : approvals.length ? 'Reviewed' : 'Not checked yet') + '</div><p class="section-intro">Required reviews stay separate from readiness score.</p></div></div>' +
        (checks.length ? '<div class="bento-card" style="margin-bottom:16px;"><h3 style="font-size:15px;font-weight:800;margin-bottom:12px;">Evidence checks</h3>' + checkItems + '</div>' : '') +

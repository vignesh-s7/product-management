            { status: 'incomplete', icon: '<span class="icon" data-icon="circle" style="color:rgba(255,255,255,0.3)" aria-hidden="true">○</span>' };
        case 'actors':
          return (prod.actors && prod.actors.length > 0) ? 
            { status: 'complete', icon: '<span class="icon" data-icon="circle-check" style="color:#4C7A5E" aria-hidden="true">✓</span>' } : 
            { status: 'incomplete', icon: '<span class="icon" data-icon="circle" style="color:rgba(255,255,255,0.3)" aria-hidden="true">○</span>' };
        case 'requirements':
          return (prod.requirements && prod.requirements.length > 0) ? 
            { status: 'complete', icon: '<span class="icon" data-icon="circle-check" style="color:#4C7A5E" aria-hidden="true">✓</span>' } : 
            { status: 'incomplete', icon: '<span class="icon" data-icon="circle" style="color:rgba(255,255,255,0.3)" aria-hidden="true">○</span>' };
        case 'capabilities':
          return (prod.capabilities && prod.capabilities.length > 0) ? 
            { status: 'complete', icon: '<span class="icon" data-icon="circle-check" style="color:#4C7A5E" aria-hidden="true">✓</span>' } : 
            { status: 'incomplete', icon: '<span class="icon" data-icon="circle" style="color:rgba(255,255,255,0.3)" aria-hidden="true">○</span>' };
        case 'primitives':
          return (prod.primitives && Object.keys(prod.primitives).length >= 4) ? 
            { status: 'complete', icon: '<span class="icon" data-icon="circle-check" style="color:#4C7A5E" aria-hidden="true">✓</span>' } : 
            { status: 'warning', icon: '<span class="icon" data-icon="circle-exclamation" style="color:#B8791A" aria-hidden="true">!</span>' };
        case 'rules':
          return (prod.rules && prod.rules.length > 0) ? 
            { status: 'complete', icon: '<span class="icon" data-icon="circle-check" style="color:#4C7A5E" aria-hidden="true">✓</span>' } : 
            { status: 'incomplete', icon: '<span class="icon" data-icon="circle" style="color:rgba(255,255,255,0.3)" aria-hidden="true">○</span>' };
        case 'workflow':
          return (prod.workflowNodes && prod.workflowNodes.length > 0) ? 
            { status: 'complete', icon: '<span class="icon" data-icon="circle-check" style="color:#4C7A5E" aria-hidden="true">✓</span>' } : 
            { status: 'incomplete', icon: '<span class="icon" data-icon="circle" style="color:rgba(255,255,255,0.3)" aria-hidden="true">○</span>' };
        case 'cross_cutting':
          return (prod.crossCutting && Object.keys(prod.crossCutting).length > 0) ? 
            { status: 'complete', icon: '<span class="icon" data-icon="circle-check" style="color:#4C7A5E" aria-hidden="true">✓</span>' } : 
            { status: 'incomplete', icon: '<span class="icon" data-icon="circle" style="color:rgba(255,255,255,0.3)" aria-hidden="true">○</span>' };
        case 'technology':
          return (prod.technology && prod.technology.llm) ? 
            { status: 'complete', icon: '<span class="icon" data-icon="circle-check" style="color:#4C7A5E" aria-hidden="true">✓</span>' } : 
            { status: 'incomplete', icon: '<span class="icon" data-icon="circle" style="color:rgba(255,255,255,0.3)" aria-hidden="true">○</span>' };
        case 'blueprint':
          return calculateCompletion(prod) >= 70 ? 
            { status: 'complete', icon: '<span class="icon" data-icon="circle-check" style="color:#4C7A5E" aria-hidden="true">✓</span>' } : 
            { status: 'warning', icon: '<span class="icon" data-icon="circle-exclamation" style="color:#B8791A" aria-hidden="true">!</span>' };
        case 'export':
          return calculateCompletion(prod) >= 80 ? 
            { status: 'complete', icon: '<span class="icon" data-icon="circle-check" style="color:#4C7A5E" aria-hidden="true">✓</span>' } : 
            { status: 'incomplete', icon: '<span class="icon" data-icon="circle" style="color:rgba(255,255,255,0.3)" aria-hidden="true">○</span>' };
        default:
          return { status: 'incomplete', icon: '<span class="icon" data-icon="circle" style="color:rgba(255,255,255,0.3)" aria-hidden="true">○</span>' };
      }
    }

- Problem statement lacks clear SLA metrics.

I recommend adding an automated escalation requirement.`;
        } else if (lower.includes("propose") || lower.includes("suggest") || lower.includes("requirement")) {

            field: "requirements",

Passed: Problem Statement, Actors Matrix, Primitive Settings.
Recommendation: Complete 10 Workflow Nodes before exporting to engineering.`;

          id: "msg-" + Date.now(),

    function runParallelTasks() {
      const p = getActiveProduct();
      const tasks = getProductParallelTasks(p ? p.id : 'default');
      let dispatched = 0;

      tasks.forEach(task => {
        const depsMet = task.dependencies.every(depId => {
          const dep = tasks.find(t => t.id === depId);
          return dep && dep.status === "Complete";
        });

        if (depsMet && (task.status === "Queued" || task.status === "Blocked" || task.status === "Running")) {
          task.status = "Running";
          dispatched++;
        }
      });

      saveState();
      renderAIPanel(p);
      showToast(dispatched > 0 ? `Coordinator dispatched ${dispatched} parallel agent tasks ⚡` : "All eligible tasks are already running or completed.");

      if (dispatched > 0) {
        setTimeout(() => {
          let completedAny = false;
          tasks.forEach(task => {
            if (task.status === "Running") {
              task.status = "Review";
              if (task.id === "TSK-102") task.output = "Generated 8 REST CRUD endpoints with JSON validation.";
              if (task.id === "TSK-103") task.output = "Generated ABAC middleware & 12 security policy rules.";
              completedAny = true;
            }
          });

          tasks.forEach(task => {
            if (task.status === "Blocked") {
              const depsMet = task.dependencies.every(depId => {
                const dep = tasks.find(t => t.id === depId);
                return dep && (dep.status === "Complete" || dep.status === "Review");
              });
              if (depsMet) task.status = "Queued";
            }
          });

          saveState();
          renderAIPanel(p);
          if (completedAny) showToast("Parallel agent tasks finished! Review outputs ✓");
        }, 1500);
      }
    }

    function pauseParallelTasks() {
      const p = getActiveProduct();
      const tasks = getProductParallelTasks(p ? p.id : 'default');
      let count = 0;
      tasks.forEach(task => {
        if (task.status === "Running") {
          task.status = "Queued";
          count++;
        }
      });
      saveState();
      renderAIPanel(p);
      showToast(count > 0 ? "Paused running parallel tasks" : "No running tasks to pause");
    }

    function saveTaskModal() {
      const title = document.getElementById("task-title").value.trim();
      const agent = document.getElementById("task-agent").value;
      const input = document.getElementById("task-input").value.trim();

      if (!title) {
        showToast("Task title is required");
        return;
      }

      const p = getActiveProduct();
      const tasks = getProductParallelTasks(p ? p.id : 'default');
      const newId = "TSK-" + (101 + tasks.length);

      tasks.push({
        id: newId,
        agent: agent,
        title: title,
        input: input || "Product context",
        dependencies: [],
        status: "Queued",
        output: "Queued for parallel agent coordinator execution.",
        requiresReview: true
      });

      saveState();
      closeModal();
      renderAIPanel(p);
      showToast(`Added task ${newId}`);
    }

    /* ==========================================

       ========================================== */
    function esc(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    async function apiGet(path) {
      try {
        const r = await fetch(path, { signal: AbortSignal.timeout(15000) });
        const data = await r.json();
        if (!r.ok) return { _err: data.error || 'HTTP ' + r.status };
        return data;
      } catch (e) {
        return { _err: e.name === 'TimeoutError' ? 'Request timed out' : 'Network error — run: python3 layer_a.py serve' };
      }
    }

    async function apiPost(path, body) {
      try {
        const r = await fetch(path, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
          signal: AbortSignal.timeout(30000)
        });
        const data = await r.json();
        if (!r.ok) return { _err: data.error || 'HTTP ' + r.status };
        return data;
      } catch (e) {
        return { _err: e.name === 'TimeoutError' ? 'Request timed out' : 'Network error — run: python3 layer_a.py serve' };
      }
    }

        if (liveRegion) liveRegion.textContent = 'Backend not available. Run: python3 layer_a.py serve';
        return;
      }
      pbState.bootstrapData = boot;
      pbState.products = prods.products || [];

        (factors.length ? '<h4 style="font-size:12px;font-weight:800;text-transform:uppercase;color:var(--text-muted);margin-bottom:8px;">Research Factor Coverage</h4><div style="overflow-x:auto;margin-bottom:16px;"><table style="width:100%;border-collapse:collapse;font-size:13px;"><thead><tr style="border-bottom:1px solid var(--border-color);"><th style="padding:6px 10px;text-align:left;font-size:11px;color:var(--text-muted);">Factor</th><th style="padding:6px 10px;text-align:left;font-size:11px;color:var(--text-muted);">Status</th><th style="padding:6px 10px;text-align:left;font-size:11px;color:var(--text-muted);">Gap</th></tr></thead><tbody>' + factorRows + '</tbody></table></div>' : '') +
        (problems.length ? '<h4 style="font-size:12px;font-weight:800;text-transform:uppercase;color:var(--text-muted);margin-bottom:6px;">Ranked Problems</h4><ul style="list-style:none;margin-bottom:16px;">' + probItems + '</ul>' : '') +
        (opportunities.length ? '<h4 style="font-size:12px;font-weight:800;text-transform:uppercase;color:var(--text-muted);margin-bottom:6px;">Ranked Opportunities</h4><ul style="list-style:none;margin-bottom:16px;">' + oppItems + '</ul>' : '') +
        (risks.length ? '<h4 style="font-size:12px;font-weight:800;text-transform:uppercase;color:var(--text-muted);margin-bottom:6px;">Risks</h4><ul style="list-style:none;margin-bottom:12px;">' + risks.map(function(r) { return '<li style="font-size:13px;padding:4px 0;">⚠ ' + esc(r.description || String(r)) + '</li>'; }).join('') + '</ul>' : '') +
        (unknowns.length ? '<h4 style="font-size:12px;font-weight:800;text-transform:uppercase;color:var(--text-muted);margin-bottom:6px;">Unknowns</h4><ul style="list-style:none;margin-bottom:12px;">' + unknowns.map(function(u) { return '<li style="font-size:13px;padding:4px 0;color:var(--warning-color);">? ' + esc(u) + '</li>'; }).join('') + '</ul>' : '') +
        '<p style="font-size:12px;color:var(--text-muted);border-top:1px solid var(--border-color);padding-top:10px;margin-top:4px;">' + limitation + '</p></div>' +
        '<div style="display:flex;gap:10px;margin-bottom:16px;"><button class="btn btn-secondary btn-sm" onclick="navigateTo(\'research\')">Full Research →</button><button class="btn btn-secondary btn-sm" onclick="navigateTo(\'define\')">Define →</button></div>';
    }

    /* ==========================================
       B3: RESEARCH SCREEN
       ========================================== */
    function renderResearchScreen(container) {
      container.innerHTML = '<div style="padding:24px;max-width:1100px;">' +
        pbPageHeader('Research', 'Parallel 11-factor research — local mocked data, no live sources') +
        '<div class="bento-card" style="margin-bottom:24px;"><h3 style="font-size:15px;font-weight:800;margin-bottom:12px;">Research Analysis</h3><p style="font-size:13px;color:var(--text-secondary);margin-bottom:16px;">Runs 11 parallel research factors. No live sources or network access.</p><div style="display:flex;gap:10px;flex-wrap:wrap;"><button class="btn btn-primary" id="pb-research-run-btn" onclick="pbRunResearch()">Run Research</button>' + (pbState.researchResult ? '<button class="btn btn-secondary btn-sm" onclick="pbRunResearch()">Re-run</button>' : '') + '</div><div id="pb-research-status" aria-live="polite" style="margin-top:8px;font-size:13px;color:var(--text-secondary);"></div></div>' +
        '<div id="pb-research-result"></div></div>';
      if (pbState.researchResult) {
        pbRenderResearchResult(document.getElementById('pb-research-result'), pbState.researchResult);
      }
    }

    async function pbRunResearch() {
      const btn = document.getElementById('pb-research-run-btn');
      const status = document.getElementById('pb-research-status');
      const resultDiv = document.getElementById('pb-research-result');
      if (btn) btn.disabled = true;
      if (status) status.textContent = 'Running parallel research (11 factors)...';
      if (resultDiv) resultDiv.innerHTML = pbLoading('Analysing...');
      const prod = pbActiveProduct();
      const result = await apiPost('/api/research', { product_id: prod && prod.product_id });
      if (btn) btn.disabled = false;
      if (result._err) { if (status) status.textContent = 'Error: ' + result._err; if (resultDiv) resultDiv.innerHTML = pbError(result._err); return; }
      pbState.researchResult = result;
      if (status) status.textContent = 'Research complete — network_used: false ✓';
      if (resultDiv) pbRenderResearchResult(resultDiv, result);
    }

    function pbRenderResearchResult(container, result) {
      const research = result.research || {};
      const rankings = result.rankings || {};
      const factors = research.factor_coverage || [];
      const evidence = research.evidence || [];
      const problems = rankings.ranked_problems || [];
      const opportunities = rankings.ranked_opportunities || [];
      const risks = research.risks || [];

      const factorRows = factors.map(function(f) {
        return '<tr><td style="padding:8px 12px;font-size:13px;font-weight:700;">' + esc(f.factor || '') + '</td><td style="padding:8px 12px;"><span class="badge badge-' + (f.status === 'ASSESSED' ? 'success' : f.status === 'NOT_RELEVANT' ? 'info' : 'required') + '">' + esc(f.status || 'UNKNOWN') + '</span></td><td style="padding:8px 12px;font-size:12px;color:var(--text-secondary);">' + (f.evidence_ids || []).map(function(id) { return '<span class="badge badge-info" style="margin-right:4px;">' + esc(id) + '</span>'; }).join('') + '</td></tr>';
      }).join('');

      const evidenceItems = evidence.map(function(e) {
        return '<div style="background:var(--bg-body);border:1px solid var(--border-color);border-radius:var(--radius-md);padding:12px;margin-bottom:8px;"><div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;"><span class="badge badge-info">' + esc(e.id || '') + '</span><span style="font-size:11px;color:var(--text-muted);">' + esc(e.factor || '') + '</span><span style="font-size:11px;color:var(--text-muted);margin-left:auto;">confidence ' + esc(String(e.confidence == null ? '?' : e.confidence)) + '</span></div><p style="font-size:13px;margin:0;">' + esc(e.observation || '') + '</p><p style="font-size:11px;color:var(--text-muted);margin-top:4px;">Source: ' + esc(e.source_ref || 'UNKNOWN') + ' · ' + esc(e.source_type || '') + '</p></div>';
      }).join('');

      const probRows = problems.map(function(p, i) {
        return '<tr><td style="padding:8px 12px;font-size:13px;font-weight:700;">' + esc(p.id || 'P' + (i + 1)) + '</td><td style="padding:8px 12px;">' + esc(String(p.impact == null ? '' : p.impact)) + '</td><td style="padding:8px 12px;">' + esc(String(p.frequency == null ? '' : p.frequency)) + '</td><td style="padding:8px 12px;">' + esc(String(p.evidence_strength == null ? '' : p.evidence_strength)) + '</td><td style="padding:8px 12px;font-size:12px;color:var(--accent-text);font-weight:700;">' + esc(String(p.score == null ? '' : p.score)) + '</td></tr>';
      }).join('');

      const oppRows = opportunities.map(function(o, i) {
        return '<tr><td style="padding:8px 12px;font-size:13px;font-weight:700;">' + esc(o.id || 'O' + (i + 1)) + '</td><td style="padding:8px 12px;">' + esc(String(o.addressable_value_or_reach == null ? '' : o.addressable_value_or_reach)) + '</td><td style="padding:8px 12px;">' + esc(String(o.user_motivation == null ? '' : o.user_motivation)) + '</td><td style="padding:8px 12px;">' + esc(String(o.strategic_fit == null ? '' : o.strategic_fit)) + '</td><td style="padding:8px 12px;font-size:12px;color:var(--accent-text);font-weight:700;">' + esc(String(o.score == null ? '' : o.score)) + '</td></tr>';
      }).join('');

      const riskItems = risks.map(function(r) {
        return '<div style="display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid var(--border-subtle);"><span class="badge badge-' + (r.severity === 'HIGH' ? 'required' : 'info') + '">' + esc(r.severity || 'UNKNOWN') + '</span><div><div style="font-size:13px;font-weight:700;">' + esc(r.id || '') + '</div><div style="font-size:12px;color:var(--text-secondary);">' + esc(r.mitigation || '') + '</div></div></div>';
      }).join('');

      container.innerHTML =
        '<div style="display:flex;gap:10px;margin-bottom:16px;"><span class="badge badge-info">network_used: false</span><span class="badge badge-info">live_sources_used: false</span></div>' +
        '<div class="bento-card" style="margin-bottom:16px;"><h3 style="font-size:15px;font-weight:800;margin-bottom:12px;">Factor Coverage (11)</h3><div style="overflow-x:auto;"><table style="width:100%;border-collapse:collapse;font-size:13px;"><thead><tr style="border-bottom:2px solid var(--border-color);"><th scope="col" style="padding:8px 12px;text-align:left;font-size:11px;color:var(--text-muted);">Factor</th><th scope="col" style="padding:8px 12px;text-align:left;font-size:11px;color:var(--text-muted);">Status</th><th scope="col" style="padding:8px 12px;text-align:left;font-size:11px;color:var(--text-muted);">Evidence IDs</th></tr></thead><tbody>' + (factorRows || '<tr><td colspan="3" style="padding:12px;color:var(--text-muted);">No factor data</td></tr>') + '</tbody></table></div></div>' +
        (evidence.length ? '<div class="bento-card" style="margin-bottom:16px;"><h3 style="font-size:15px;font-weight:800;margin-bottom:12px;">Evidence (' + evidence.length + ')</h3>' + evidenceItems + '</div>' : '') +
        (problems.length ? '<div class="bento-card" style="margin-bottom:16px;"><h3 style="font-size:15px;font-weight:800;margin-bottom:12px;">Ranked Problems (separate from opportunities)</h3><div style="overflow-x:auto;"><table style="width:100%;border-collapse:collapse;font-size:13px;"><thead><tr style="border-bottom:2px solid var(--border-color);"><th scope="col" style="padding:8px 12px;text-align:left;font-size:11px;color:var(--text-muted);">Problem ID</th><th scope="col" style="padding:8px 12px;text-align:left;font-size:11px;color:var(--text-muted);">Impact</th><th scope="col" style="padding:8px 12px;text-align:left;font-size:11px;color:var(--text-muted);">Freq</th><th scope="col" style="padding:8px 12px;text-align:left;font-size:11px;color:var(--text-muted);">Evidence</th><th scope="col" style="padding:8px 12px;text-align:left;font-size:11px;color:var(--text-muted);">Score</th></tr></thead><tbody>' + probRows + '</tbody></table></div></div>' : '') +
        (opportunities.length ? '<div class="bento-card" style="margin-bottom:16px;"><h3 style="font-size:15px;font-weight:800;margin-bottom:12px;">Ranked Opportunities (separate scoring)</h3><div style="overflow-x:auto;"><table style="width:100%;border-collapse:collapse;font-size:13px;"><thead><tr style="border-bottom:2px solid var(--border-color);"><th scope="col" style="padding:8px 12px;text-align:left;font-size:11px;color:var(--text-muted);">Opportunity ID</th><th scope="col" style="padding:8px 12px;text-align:left;font-size:11px;color:var(--text-muted);">Reach</th><th scope="col" style="padding:8px 12px;text-align:left;font-size:11px;color:var(--text-muted);">Motivation</th><th scope="col" style="padding:8px 12px;text-align:left;font-size:11px;color:var(--text-muted);">Fit</th><th scope="col" style="padding:8px 12px;text-align:left;font-size:11px;color:var(--text-muted);">Score</th></tr></thead><tbody>' + oppRows + '</tbody></table></div></div>' : '') +
        (risks.length ? '<div class="bento-card" style="margin-bottom:16px;"><h3 style="font-size:15px;font-weight:800;margin-bottom:12px;">Risks</h3>' + riskItems + '</div>' : '') +
        '<div style="display:flex;gap:10px;"><button class="btn btn-secondary btn-sm" onclick="navigateTo(\'define\')">Define →</button></div>';
    }

    /* ==========================================
       B4: DEFINE SCREEN
       ========================================== */
    function renderDefineScreen(container) {
      const q = (pbState.bootstrapData && pbState.bootstrapData.questions) || [
        { id: 'problem',     label: 'Problem statement',        max_characters: 400, required: true },
        { id: 'users',       label: 'User group',               max_characters: 250, required: true },
        { id: 'evidence',    label: 'Evidence or UNKNOWN',      max_characters: 300, required: false },
        { id: 'constraints', label: 'Constraints or UNKNOWN',   max_characters: 150, required: false },
        { id: 'decision',    label: 'Decision to support',      max_characters: 100, required: true },
      ];
      const fields = q.map(function(f) {
        return '<div class="form-group"><label class="form-label" for="pb-def-' + esc(f.id) + '">' + esc(f.label) + (f.required ? ' <span aria-hidden="true" style="color:var(--danger-color)">*</span>' : '') + '</label><textarea class="form-control" id="pb-def-' + esc(f.id) + '" rows="2" maxlength="' + (f.max_characters || 400) + '" placeholder="' + (f.required ? 'Required' : 'Optional — write UNKNOWN if unsure') + '" aria-required="' + (f.required ? 'true' : 'false') + '">' + esc(pbState.intakeAnswers[f.id] || '') + '</textarea></div>';
      }).join('');

      const defaultProblems = (pbState.bootstrapData && pbState.bootstrapData.default_product && pbState.bootstrapData.default_product.definition && pbState.bootstrapData.default_product.definition.selected_problem_ids || []).join(', ');

      container.innerHTML = '<div style="padding:24px;max-width:760px;">' + pbPageHeader('Define', 'Problem definition — user text is unverified input') +
        '<div class="bento-card" style="margin-bottom:16px;"><h3 style="font-size:15px;font-weight:800;margin-bottom:16px;">Definition Answers <span class="badge badge-required" style="vertical-align:middle;">Unverified user input</span></h3>' +
        fields +
        '<div class="form-group"><label class="form-label" for="pb-def-problems">Selected Problem IDs (comma-separated)</label><input class="form-control" id="pb-def-problems" type="text" placeholder="problem-broad-opportunity" value="' + esc(defaultProblems) + '" /></div>' +
        '<div style="display:flex;gap:10px;margin-top:16px;"><button class="btn btn-primary" id="pb-define-btn" onclick="pbSubmitDefinition()">Review definition</button></div>' +
        '<div id="pb-define-status" aria-live="polite" style="margin-top:8px;font-size:13px;color:var(--text-secondary);"></div></div>' +
        '<div id="pb-define-result"></div></div>';

      if (pbState.defineResult) {
        pbRenderDefineResult(document.getElementById('pb-define-result'), pbState.defineResult);
      }
    }

    async function pbSubmitDefinition() {
      const btn = document.getElementById('pb-define-btn');
      const status = document.getElementById('pb-define-status');
      const answers = {};
      ['problem','users','evidence','constraints','decision'].forEach(function(id) {
        const el = document.getElementById('pb-def-' + id);
        if (el) answers[id] = el.value.trim();
      });
      const problemsRaw = document.getElementById('pb-def-problems')?.value || '';
      const selectedIds = problemsRaw.split(',').map(function(s) { return s.trim(); }).filter(Boolean);
      const prod = pbActiveProduct();
      if (!answers.problem) { if (status) status.textContent = 'Problem statement is required.'; return; }
      if (!answers.decision) { if (status) status.textContent = 'Decision field is required.'; return; }
      if (btn) btn.disabled = true;
      if (status) status.textContent = 'Submitting...';
      const result = await apiPost('/api/definition', { product_id: prod && prod.product_id, answers, selected_problem_ids: selectedIds });
      if (btn) btn.disabled = false;
      if (result._err) { if (status) status.textContent = 'Error: ' + result._err; return; }
      pbState.defineResult = result;
      if (status) status.textContent = 'Status: ' + esc(result.gate_status || result.status || 'DONE') + ' — Not yet saved';
      const d = document.getElementById('pb-define-result');
      if (d) pbRenderDefineResult(d, result);
    }

    function pbRenderDefineResult(container, data) {
      const status = data.gate_status || data.status || 'UNKNOWN';
      const proposal = data.definition_proposal || data.proposal || {};
      const hypotheses = proposal.hypotheses || data.hypotheses || [];
      const blockers = data.blockers || [];
      const badge = status === 'READY_FOR_REVIEW' ? 'success' : status === 'NEEDS_INPUT' ? 'required' : 'info';

      const hypoItems = hypotheses.map(function(h) {
        return '<div style="background:var(--bg-body);border:1px solid var(--border-color);border-radius:var(--radius-md);padding:10px;margin-bottom:6px;"><div style="font-size:13px;"><strong>' + esc(h.change || '') + '</strong></div><div style="font-size:12px;color:var(--text-secondary);">Expected: ' + esc(h.expected_outcome || 'UNKNOWN') + '</div><div style="font-size:12px;color:var(--text-muted);">Status: ' + esc(h.status || 'DRAFT') + '</div></div>';
      }).join('');

      const blockerList = blockers.length ? '<div role="alert" style="background:var(--danger-light);border:1px solid var(--danger-color);border-radius:var(--radius-md);padding:10px;margin-top:8px;"><strong style="color:var(--danger-color);">Blockers:</strong><ul style="margin:6px 0 0 16px;">' + blockers.map(function(b) { return '<li style="font-size:13px;">' + esc(b) + '</li>'; }).join('') + '</ul></div>' : '';

      container.innerHTML = '<div class="bento-card"><div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;"><h3 style="font-size:15px;font-weight:800;flex:1;">Definition Proposal</h3><span class="badge badge-' + badge + '">' + esc(status) + '</span><span class="badge badge-info">Not yet saved</span></div>' +
        (proposal.vision ? '<p style="font-size:13px;margin-bottom:8px;"><strong>Vision:</strong> ' + esc(proposal.vision) + '</p>' : '') +
        (proposal.problem_statement ? '<p style="font-size:13px;margin-bottom:8px;"><strong>Problem:</strong> ' + esc(proposal.problem_statement) + '</p>' : '') +
        (hypotheses.length ? '<h4 style="font-size:12px;font-weight:800;text-transform:uppercase;color:var(--text-muted);margin-bottom:6px;">Hypotheses</h4>' + hypoItems : '') +
        blockerList +
        '<div style="display:flex;gap:10px;margin-top:12px;"><button class="btn btn-secondary btn-sm" onclick="navigateTo(\'solution\')">Solution →</button></div></div>';
    }

    /* ==========================================
       B5: SOLUTION SCREEN
       ========================================== */
    function renderSolutionScreen(container) {
      container.innerHTML = '<div style="padding:24px;max-width:900px;">' + pbPageHeader('Solution', 'Evidence-backed epics, stories, and prioritization') +
        '<div class="bento-card" style="margin-bottom:16px;"><h3 style="font-size:15px;font-weight:800;margin-bottom:16px;">Prioritization Method</h3><div style="display:flex;gap:10px;flex-wrap:wrap;"><button class="btn btn-secondary btn-sm" id="pb-sol-moscow" onclick="pbRunSolution(\'moscow\')">MoSCoW</button><button class="btn btn-primary btn-sm" id="pb-sol-ve" onclick="pbRunSolution(\'value_effort\')">Value-Effort</button><button class="btn btn-secondary btn-sm" id="pb-sol-rice" onclick="pbRunSolution(\'rice\')">RICE</button></div><div id="pb-solution-status" aria-live="polite" style="margin-top:8px;font-size:13px;color:var(--text-secondary);"></div></div><div id="pb-solution-result"></div></div>';
      if (pbState.solutionResult) {
        pbRenderSolutionResult(document.getElementById('pb-solution-result'), pbState.solutionResult);
      }
    }

    async function pbRunSolution(method) {
      const status = document.getElementById('pb-solution-status');
      ['pb-sol-moscow','pb-sol-ve','pb-sol-rice'].forEach(function(id) { const b = document.getElementById(id); if (b) b.disabled = true; });
      if (status) status.textContent = 'Running ' + method + ' prioritization...';
      const prod = pbActiveProduct();
      const result = await apiPost('/api/solution', { product_id: prod && prod.product_id, method });
      ['pb-sol-moscow','pb-sol-ve','pb-sol-rice'].forEach(function(id) { const b = document.getElementById(id); if (b) b.disabled = false; });
      if (result._err) { if (status) status.textContent = 'Error: ' + result._err; return; }
      pbState.solutionResult = result;
      if (status) status.textContent = 'Method: ' + esc(result.method || method) + ' ✓';
      ['pb-sol-moscow','pb-sol-ve','pb-sol-rice'].forEach(function(id) { const b = document.getElementById(id); if (b) b.className = 'btn btn-secondary btn-sm'; });
      const activeId = method === 'moscow' ? 'pb-sol-moscow' : method === 'value_effort' ? 'pb-sol-ve' : 'pb-sol-rice';
      const ab = document.getElementById(activeId); if (ab) ab.className = 'btn btn-primary btn-sm';
      const d = document.getElementById('pb-solution-result');
      if (d) pbRenderSolutionResult(d, result);
    }

    function pbRenderSolutionResult(container, data) {
      const epics = data.ranked_epics || data.epics || [];
      const stories = data.user_stories || data.stories || [];
      const deps = data.dependencies || [];

      const epicItems = epics.map(function(e) {
        return '<div style="background:var(--bg-body);border:1px solid var(--border-color);border-radius:var(--radius-md);padding:12px;margin-bottom:8px;"><div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;"><span class="badge badge-' + (e.moscow === 'MUST' ? 'required' : 'info') + '">' + esc(e.moscow || '') + '</span><strong style="font-size:13px;">' + esc(e.id || '') + ': ' + esc(e.title || '') + '</strong><span style="margin-left:auto;font-size:12px;color:var(--accent-text);">score ' + esc(String(e.priority_score == null ? '' : e.priority_score)) + '</span></div><div style="font-size:12px;color:var(--text-secondary);">Value ' + esc(String(e.value == null ? '?' : e.value)) + ' &middot; Effort ' + esc(String(e.effort == null ? '?' : e.effort)) + ' &middot; Reach ' + esc(String(e.reach == null ? '?' : e.reach)) + '</div></div>';
      }).join('');

      const storyItems = stories.map(function(s) {
        return '<li style="padding:6px 0;border-bottom:1px solid var(--border-subtle);font-size:13px;"><strong>' + esc(s.id || '') + '</strong>: ' + esc(s.title || '') + '</li>';
      }).join('');

      container.innerHTML =
        '<div class="bento-card" style="margin-bottom:16px;"><h3 style="font-size:15px;font-weight:800;margin-bottom:12px;">Epics (' + epics.length + ')</h3>' + (epics.length ? epicItems : '<p style="color:var(--text-muted);">No epics.</p>') + '</div>' +
        (stories.length ? '<div class="bento-card" style="margin-bottom:16px;"><h3 style="font-size:15px;font-weight:800;margin-bottom:12px;">User Stories (' + stories.length + ')</h3><ul style="list-style:none;">' + storyItems + '</ul></div>' : '') +
        (deps.length ? '<div class="bento-card" style="margin-bottom:16px;"><h3 style="font-size:15px;font-weight:800;margin-bottom:12px;">Dependencies (' + deps.length + ')</h3>' + deps.map(function(d) { return '<div style="font-size:13px;padding:4px 0;">' + esc(d.id || '') + ': ' + esc(d.item_id || '') + ' → ' + esc(d.depends_on_id || '') + '</div>'; }).join('') + '</div>' : '') +
        '<div style="display:flex;gap:10px;"><button class="btn btn-secondary btn-sm" onclick="navigateTo(\'gtm\')">GTM →</button></div>';
    }

    /* ==========================================
       B6: GTM SCREEN
       ========================================== */
    function renderGTMScreen(container) {
      container.innerHTML = '<div style="padding:24px;max-width:900px;">' + pbPageHeader('Go-to-Market', 'Launch approach — local mocked data') +

    function pbRenderGTMResult(container, result) {

        '<div class="bento-card" style="margin-bottom:16px;"><h3 style="font-size:15px;font-weight:800;margin-bottom:12px;">Positioning & Audience</h3><div class="grid-2" style="font-size:13px;line-height:1.7;"><div><strong>Positioning:</strong> ' + esc(gtm.positioning || 'UNKNOWN') + '</div><div><strong>Type:</strong> ' + esc(result.product_type || 'UNKNOWN') + '</div><div><strong>Segments:</strong> ' + ((gtm.target_segments || []).map(function(s) { return esc(s); }).join(', ') || 'UNKNOWN') + '</div><div><strong>Channels:</strong> ' + ((gtm.channels || []).map(function(s) { return esc(s); }).join(', ') || 'UNKNOWN') + '</div></div>' +
        (model.kind ? '<div style="margin-top:12px;padding:10px;background:var(--bg-body);border-radius:var(--radius-md);font-size:12px;"><strong>Adoption model:</strong> ' + esc(model.kind) + ' — ' + esc(model.approach || '') + '</div>' : '') + '</div>' +
        (experiments.length ? '<div class="bento-card" style="margin-bottom:16px;"><h3 style="font-size:15px;font-weight:800;margin-bottom:12px;">Experiments (' + experiments.length + ')</h3>' + experiments.map(function(e) { return '<div style="padding:10px;border-bottom:1px solid var(--border-subtle);"><div style="font-size:13px;font-weight:700;">' + esc(e.id || '') + '</div><div style="font-size:12px;color:var(--text-secondary);">Method: ' + esc(e.method || '') + ' · Metric: ' + esc(e.success_metric_id || '') + '</div></div>'; }).join('') + '</div>' : '') +
        (metrics.length ? '<div class="bento-card" style="margin-bottom:16px;"><h3 style="font-size:15px;font-weight:800;margin-bottom:12px;">Launch Metrics</h3><table style="width:100%;border-collapse:collapse;font-size:13px;"><thead><tr style="border-bottom:1px solid var(--border-color);"><th scope="col" style="padding:6px 10px;text-align:left;font-size:11px;color:var(--text-muted);">Metric</th><th scope="col" style="padding:6px 10px;text-align:left;font-size:11px;color:var(--text-muted);">Baseline</th><th scope="col" style="padding:6px 10px;text-align:left;font-size:11px;color:var(--text-muted);">Target</th><th scope="col" style="padding:6px 10px;text-align:left;font-size:11px;color:var(--text-muted);">Source</th></tr></thead><tbody>' + metricRows + '</tbody></table></div>' : '') +
        (unknowns.length ? '<div class="bento-card" style="margin-bottom:16px;border-color:var(--warning-color);"><h3 style="font-size:15px;font-weight:800;margin-bottom:8px;color:var(--warning-color);">UNKNOWN fields</h3><ul style="list-style:none;">' + unknowns.map(function(u) { return '<li style="font-size:13px;padding:2px 0;">? ' + esc(u) + '</li>'; }).join('') + '</ul></div>' : '') +

    async function pbRunReadiness() {
      const btn = document.getElementById('pb-readiness-run-btn');

      if (resultDiv) pbRenderReadinessResult(resultDiv, result);

    function pbRenderReadinessResult(container, result) {
      const score = result.product_readiness_score;
      const agentFit = result.agent_fitness || {};
      const checks = result.checks || [];
      const blockers = result.blockers || [];
      const risks = result.open_risks || [];
      const approvals = result.pending_approvals || [];
      const unknowns = result.unknown_metrics || [];
      const scorePct = score != null ? Math.round(score * 100) : null;
      const scoreColor = scorePct != null ? (scorePct >= 70 ? 'var(--success-color)' : scorePct >= 40 ? 'var(--warning-color)' : 'var(--danger-color)') : 'var(--text-muted)';

      const checkItems = checks.map(function(c) {
        return '<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border-subtle);"><span style="font-size:16px;" aria-hidden="true">' + (c.passed ? '✓' : '○') + '</span><div style="flex:1;"><div style="font-size:13px;font-weight:700;">' + esc(c.id || c.kind || '') + '</div>' + (c.blocker ? '<span class="badge badge-required">Blocker</span>' : '') + '</div><span style="font-size:12px;color:var(--text-muted);">weight ' + esc(String(c.weight == null ? '' : c.weight)) + '</span><span class="badge badge-' + (c.passed ? 'success' : 'required') + '">' + (c.passed ? 'PASS' : 'FAIL') + '</span></div>';
      }).join('');

      container.innerHTML =
        '<div class="grid-2" style="margin-bottom:24px;gap:16px;"><div class="bento-card"><div class="bento-stat-label">Product Readiness Score</div><div class="bento-stat-value" style="color:' + scoreColor + ';">' + (scorePct != null ? scorePct + '%' : 'UNKNOWN') + '</div><div style="margin-top:8px;font-size:12px;color:var(--text-muted);">Not a production approval</div>' + (scorePct != null ? '<div class="progress-track" style="margin-top:8px;"><div class="progress-bar" style="width:' + scorePct + '%;"></div></div>' : '') + '</div><div class="bento-card"><div class="bento-stat-label">Agent Fitness (separate)</div><div class="bento-stat-value" style="color:var(--info-color);">' + esc(agentFit.classification || 'UNKNOWN') + '</div><div style="margin-top:8px;font-size:12px;color:var(--text-muted);">Agent fit cannot raise product score</div></div></div>' +
        (checks.length ? '<div class="bento-card" style="margin-bottom:16px;"><h3 style="font-size:15px;font-weight:800;margin-bottom:12px;">Readiness Checks</h3>' + checkItems + '</div>' : '') +
        (blockers.length ? '<div role="alert" class="bento-card" style="margin-bottom:16px;border-color:var(--danger-color);"><h3 style="font-size:15px;font-weight:800;margin-bottom:8px;color:var(--danger-color);">Blockers (' + blockers.length + ')</h3><ul style="list-style:none;">' + blockers.map(function(b) { return '<li style="font-size:13px;padding:4px 0;">✗ ' + esc(b) + '</li>'; }).join('') + '</ul></div>' : '') +
        (risks.length ? '<div class="bento-card" style="margin-bottom:16px;"><h3 style="font-size:15px;font-weight:800;margin-bottom:8px;">Open Risks (' + risks.length + ')</h3>' + risks.map(function(r) { return '<div style="padding:8px 0;border-bottom:1px solid var(--border-subtle);"><div style="display:flex;gap:8px;align-items:center;"><span class="badge badge-' + (r.severity === 'HIGH' ? 'required' : 'info') + '">' + esc(r.severity || '') + '</span><span style="font-size:13px;">' + esc(r.id || '') + '</span></div><div style="font-size:12px;color:var(--text-secondary);margin-top:2px;">' + esc(r.mitigation || '') + '</div></div>'; }).join('') + '</div>' : '') +
        (approvals.length ? '<div class="bento-card" style="margin-bottom:16px;"><h3 style="font-size:15px;font-weight:800;margin-bottom:8px;">Pending Approvals (' + approvals.length + ')</h3>' + approvals.map(function(a) { return '<div style="padding:8px 0;border-bottom:1px solid var(--border-subtle);font-size:13px;"><strong>' + esc(a.id || '') + '</strong> — Owner: ' + esc(a.owner_role || 'UNKNOWN') + ' — Status: <span class="badge badge-required">' + esc(a.status || 'PENDING') + '</span></div>'; }).join('') + '</div>' : '') +
        (unknowns.length ? '<div class="bento-card" style="margin-bottom:16px;border-color:var(--warning-color);"><h3 style="font-size:15px;font-weight:800;margin-bottom:8px;color:var(--warning-color);">UNKNOWN Metrics (' + unknowns.length + ')</h3><ul style="list-style:none;">' + unknowns.map(function(u) { return '<li style="font-size:13px;padding:2px 0;">? ' + esc(u) + '</li>'; }).join('') + '</ul></div>' : '') +
        '<div style="display:flex;gap:10px;"><button class="btn btn-primary btn-sm" onclick="navigateTo(\'copilot\')">Copilot & Export →</button></div>';
    }

    /* ==========================================
       B8: COPILOT + EXPORT SCREEN
       ========================================== */
    function renderCopilotScreen(container) {
      const decided = pbState.proposalDecided;
      const hasPending = !!pbState.pendingProposal;

      container.innerHTML = '<div style="padding:24px;max-width:900px;">' + pbPageHeader('Copilot & Export', 'Controlled AI proposals and handoff formats') +
        '<div class="bento-card" style="margin-bottom:24px;"><h3 style="font-size:15px;font-weight:800;margin-bottom:16px;">Copilot Proposal</h3>' +
        '<div class="form-group"><label class="form-label" for="pb-cop-section">Section</label><select class="form-control" id="pb-cop-section"><option value="definition">Definition</option><option value="solution">Solution</option><option value="gtm">GTM</option><option value="execution">Execution</option></select></div>' +
        '<div class="form-group"><label class="form-label" for="pb-cop-rationale">Rationale for change</label><textarea class="form-control" id="pb-cop-rationale" rows="2" maxlength="600" placeholder="Why this change is proposed" aria-required="true"></textarea></div>' +
        '<button class="btn btn-secondary" id="pb-propose-btn" onclick="pbCreateProposal()">Request Proposal</button>' +
        '<div id="pb-copilot-status" aria-live="polite" style="margin-top:8px;font-size:13px;color:var(--text-secondary);"></div></div>' +
        '<div id="pb-proposal-review"' + (hasPending ? '' : ' hidden') + '></div>' +
        '<div class="bento-card" style="margin-bottom:16px;"><h3 style="font-size:15px;font-weight:800;margin-bottom:16px;">Export Handoff</h3><div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;"><button class="btn btn-secondary btn-sm" onclick="pbRunExport(\'json\')">JSON</button><button class="btn btn-secondary btn-sm" onclick="pbRunExport(\'markdown\')">Markdown</button><button class="btn btn-secondary btn-sm" onclick="pbRunExport(\'prd\')">PRD</button><button class="btn btn-secondary btn-sm" onclick="pbRunExport(\'executive_brief\')">Executive Brief</button></div><div id="pb-export-status" aria-live="polite" style="font-size:13px;color:var(--text-secondary);"></div><div id="pb-export-result" style="margin-top:16px;"></div></div></div>';

      if (hasPending) pbRenderProposalReview();
    }

    async function pbCreateProposal() {
      const btn = document.getElementById('pb-propose-btn');
      const status = document.getElementById('pb-copilot-status');
      const section = document.getElementById('pb-cop-section')?.value || 'definition';
      const rationale = (document.getElementById('pb-cop-rationale')?.value || '').trim();
      if (!rationale) { if (status) status.textContent = 'Rationale is required.'; return; }
      if (btn) btn.disabled = true;
      if (status) status.textContent = 'Creating proposal...';
      const prod = pbActiveProduct();
      const result = await apiPost('/api/copilot/propose', { product_id: prod && prod.product_id, section, patch: { vision: 'One bounded local mocked workflow.' }, rationale, evidence_ids: ['evidence-operations'], unknowns: ['Measured outcome remains UNKNOWN.'] });
      if (btn) btn.disabled = false;
      if (result._err) { if (status) status.textContent = 'Error: ' + result._err; return; }
      pbState.pendingProposal = result.proposal;
      pbState.proposalDecided = false;
      if (status) status.textContent = 'Proposal ready for review.';
      const d = document.getElementById('pb-proposal-review');
      if (d) d.hidden = false;
      pbRenderProposalReview();
    }

    function pbRenderProposalReview() {
      const container = document.getElementById('pb-proposal-review');
      if (!container) return;
      const p = pbState.pendingProposal;
      if (!p) { container.hidden = true; return; }
      const decided = pbState.proposalDecided;
      const patch = p.patch || {};
      const patchHtml = Object.entries(patch).map(function(kv) { return '<div style="font-size:13px;"><strong>' + esc(kv[0]) + ':</strong> ' + esc(String(kv[1])) + '</div>'; }).join('');
      const sources = (p.evidence_ids || []).map(function(id) { return '<span class="badge badge-info">' + esc(id) + '</span>'; }).join(' ');
      const unknownList = (p.unknowns || []).map(function(u) { return '<li style="font-size:13px;">' + esc(u) + '</li>'; }).join('');

      container.innerHTML = '<div class="bento-card" style="margin-bottom:24px;border-color:var(--accent-color);"><div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;"><h3 style="font-size:15px;font-weight:800;flex:1;">Proposal Review</h3><span class="badge badge-info">' + esc(p.section || '') + '</span>' + (decided ? '<span class="badge badge-success">Decided</span>' : '<span class="badge badge-required">Awaiting decision</span>') + '</div>' +
        '<p style="font-size:13px;margin-bottom:10px;"><strong>Rationale:</strong> ' + esc(p.rationale || '') + '</p>' +
        '<div style="background:var(--bg-body);border:1px solid var(--border-color);border-radius:var(--radius-md);padding:10px;margin-bottom:10px;"><strong style="font-size:12px;color:var(--text-muted);">Suggested change:</strong>' + patchHtml + '</div>' +
        (sources ? '<div style="margin-bottom:8px;"><strong style="font-size:12px;color:var(--text-muted);">Sources:</strong> ' + sources + '</div>' : '') +
        (unknownList ? '<div style="margin-bottom:10px;"><strong style="font-size:12px;color:var(--text-muted);">Unknowns:</strong><ul style="list-style:none;margin-top:4px;">' + unknownList + '</ul></div>' : '') +
        '<p style="font-size:12px;color:var(--text-muted);margin-bottom:12px;">Reject: no write. Accept: applies once. Decision cannot be replayed.</p>' +
        '<div style="display:flex;gap:10px;"><button class="btn btn-sm" style="background:var(--danger-color);color:#fff;border-color:var(--danger-color);" id="pb-reject-btn" onclick="pbDecideProposal(false)"' + (decided ? ' disabled' : '') + '>Reject</button><button class="btn btn-primary btn-sm" id="pb-accept-btn" onclick="pbDecideProposal(true)"' + (decided ? ' disabled' : '') + '>Accept</button></div>' +
        '<div id="pb-decision-status" aria-live="polite" style="margin-top:8px;font-size:13px;color:var(--text-secondary);"></div></div>';
    }

    async function pbDecideProposal(approved) {
      if (pbState.proposalDecided) return;
      const p = pbState.pendingProposal;
      if (!p) return;
      const status = document.getElementById('pb-decision-status');
      const acceptBtn = document.getElementById('pb-accept-btn');
      const rejectBtn = document.getElementById('pb-reject-btn');
      if (acceptBtn) acceptBtn.disabled = true;
      if (rejectBtn) rejectBtn.disabled = true;
      if (status) status.textContent = approved ? 'Applying...' : 'Rejecting...';
      if (!approved) {
        const ok = window.confirm('Reject this proposal? No changes will be written.');
        if (!ok) { if (acceptBtn) acceptBtn.disabled = false; if (rejectBtn) rejectBtn.disabled = false; if (status) status.textContent = ''; return; }
      }
      const result = await apiPost('/api/copilot/decision', { proposal_id: p.proposal_id, approved });
      pbState.proposalDecided = true;
      if (result._err) { if (status) status.textContent = 'Error: ' + result._err; return; }
      if (!approved) { if (status) status.textContent = 'Rejected — no write occurred.'; showToast('Proposal rejected — no changes written'); }
      else { if (status) status.textContent = 'Accepted — revision ' + esc(String(result.new_revision || '?')) + '. Applied once only.'; showToast('Proposal accepted and applied ✓'); }
      pbRenderProposalReview();
    }

    async function pbRunExport(format) {
      const status = document.getElementById('pb-export-status');
      const resultDiv = document.getElementById('pb-export-result');
      if (status) status.textContent = 'Generating ' + format + '...';
      const prod = pbActiveProduct();
      const result = await apiPost('/api/export', { product_id: prod && prod.product_id, format });
      if (result._err) { if (status) status.textContent = 'Error: ' + result._err; return; }
      const content = result.content || result.export_content || '';
      const revision = result.revision;
      const evidenceCount = result.evidence_count;
      const unknownCount = result.unknown_count;
      if (status) status.textContent = 'Format: ' + esc(result.format || format) + ' · Revision: ' + esc(String(revision == null ? '?' : revision)) + ' · Evidence: ' + esc(String(evidenceCount == null ? '?' : evidenceCount)) + ' · Unknowns: ' + esc(String(unknownCount == null ? '?' : unknownCount));
      window._pbExportContent = typeof content === 'string' ? content : JSON.stringify(content, null, 2);
      const contentEl = document.createElement('div');
      contentEl.style.cssText = 'background:var(--bg-body);border:1px solid var(--border-color);border-radius:var(--radius-md);padding:16px;';
      const copyBtn = document.createElement('button');
      copyBtn.id = 'pb-copy-btn';
      copyBtn.className = 'btn btn-ghost btn-sm';
      copyBtn.style.marginBottom = '10px';
      copyBtn.textContent = '⧉ Copy';
      copyBtn.onclick = pbCopyExport;
      const pre = document.createElement('pre');
      pre.id = 'pb-export-content';
      pre.style.cssText = 'font-size:12px;font-family:var(--font-mono);white-space:pre-wrap;max-height:400px;overflow-y:auto;word-break:break-word;margin:0;';
      pre.textContent = window._pbExportContent;
      contentEl.appendChild(copyBtn);
      contentEl.appendChild(pre);
      if (resultDiv) { resultDiv.innerHTML = ''; resultDiv.appendChild(contentEl); }
    }

    function pbCopyExport() {
      if (!navigator.clipboard || !window._pbExportContent) { showToast('Copy not available'); return; }
      const btn = document.getElementById('pb-copy-btn');
      navigator.clipboard.writeText(window._pbExportContent).then(function() {
        showToast('Copied to clipboard ✓');
        if (btn) { btn.textContent = '✓ Copied'; setTimeout(function() { if (btn) btn.textContent = '⧉ Copy'; }, 2000); }
      }).catch(function() { showToast('Copy failed — select text manually'); });
    }

    /* ==========================================
       PLUGIN SCREEN
       ========================================== */
    async function renderPluginScreen(container) {
      container.innerHTML = pbLoading('Loading plugin status...');
      const [pub, admin] = await Promise.all([apiGet('/api/plugin'), apiGet('/api/plugin/admin')]);
      if (pub._err) { container.innerHTML = pbError(pub._err); return; }
      pbState.pluginData = pub;

      const status = pub.status || 'UNKNOWN';
      const trust = pub.trust_state || 'UNKNOWN';
      const name = pub.name || '';
      const version = pub.version || '';
      const lifecycle = (admin.lifecycle) || {};
      const inspection = (admin.inspection) || {};
      const trustColor = trust === 'VERIFIED' ? 'var(--success-color)' : trust === 'UNSIGNED' ? 'var(--warning-color)' : 'var(--danger-color)';
      const trustNote = trust === 'VERIFIED' ? 'Verified does not mean behavior is safe' : trust === 'UNSIGNED' ? 'Unsigned — allowed by local policy with explicit approval' : 'INVALID packages cannot activate';
      const adminJson = JSON.stringify({ status: inspection.status, trust: inspection.trust_state, version: inspection.version, canonical_id: inspection.canonical_id }, null, 2);

      const adminPre = document.createElement('pre');
      adminPre.style.cssText = 'font-size:11px;font-family:var(--font-mono);white-space:pre-wrap;max-height:300px;overflow-y:auto;margin:0;';
      adminPre.textContent = adminJson;

      const wrapper = document.createElement('div');
      wrapper.style.cssText = 'padding:24px;max-width:900px;';
      wrapper.innerHTML = pbPageHeader('Plugin Controls', 'Agent plugin lifecycle — local only') +
        '<div class="grid-2" style="gap:16px;margin-bottom:24px;"><div class="bento-card"><div class="bento-stat-label">Plugin</div><div class="bento-stat-value" style="font-size:20px;">' + esc(name) + '</div><div style="font-size:12px;color:var(--text-muted);">v' + esc(version) + '</div></div><div class="bento-card"><div class="bento-stat-label">Trust State</div><div class="bento-stat-value" style="font-size:20px;color:' + trustColor + ';">' + esc(trust) + '</div><div style="font-size:12px;color:var(--text-muted);">' + trustNote + '</div></div></div>' +
        '<div class="bento-card" style="margin-bottom:16px;"><h3 style="font-size:15px;font-weight:800;margin-bottom:12px;">Lifecycle Controls</h3><div style="margin-bottom:8px;font-size:13px;">Active: <strong>' + esc(String(lifecycle.active_version || 'none')) + '</strong> · Status: <span class="badge badge-' + (status === 'PASS' ? 'success' : 'required') + '">' + esc(status) + '</span></div><div style="display:flex;gap:10px;flex-wrap:wrap;"><button class="btn btn-primary btn-sm" onclick="pbPluginAction(\'enable\')">Enable</button><button class="btn btn-secondary btn-sm" onclick="pbPluginAction(\'disable\')">Disable</button><button class="btn btn-secondary btn-sm" onclick="pbPluginAction(\'rollback\')">Rollback</button></div><div id="pb-plugin-status" aria-live="polite" style="margin-top:8px;font-size:13px;color:var(--text-secondary);"></div></div>';

      const details = document.createElement('details');
      details.style.marginBottom = '16px';
      const summary = document.createElement('summary');
      summary.style.cssText = 'cursor:pointer;font-size:13px;font-weight:700;color:var(--text-secondary);padding:8px 0;';
      summary.textContent = 'Admin evidence (advanced)';
      const adminCard = document.createElement('div');
      adminCard.className = 'bento-card';
      adminCard.style.marginTop = '8px';
      adminCard.appendChild(adminPre);
      details.appendChild(summary);
      details.appendChild(adminCard);
      wrapper.appendChild(details);

      container.innerHTML = '';
      container.appendChild(wrapper);
    }

    async function pbPluginAction(action) {
      const status = document.getElementById('pb-plugin-status');
      const confirmed = window.confirm(action.charAt(0).toUpperCase() + action.slice(1) + ' plugin? Requires explicit approval.');
      if (!confirmed) return;
      if (status) status.textContent = 'Running ' + action + '...';
      const result = await apiPost('/api/plugin/' + action, { approved: true });
      if (result._err) { if (status) status.textContent = 'Error: ' + result._err; return; }
      pbState.pluginData = null;
      if (status) status.textContent = esc(action) + ' complete — ' + esc(result.status || 'DONE') + ' ✓';
      showToast('Plugin ' + action + ' complete ✓');
    }

    /* ==========================================
       COMPARE SCREEN
       ========================================== */
    function renderCompareScreen(container) {
      container.innerHTML = '<div style="padding:24px;max-width:900px;">' + pbPageHeader('Compare', 'Compare two candidates locally — no external calls') +
        '<div class="bento-card" style="margin-bottom:16px;"><h3 style="font-size:15px;font-weight:800;margin-bottom:16px;">Local Comparison</h3><p style="font-size:13px;color:var(--text-secondary);margin-bottom:16px;">Paste two candidate JSON objects or use mock data. No external model calls.</p><div style="display:flex;gap:10px;flex-wrap:wrap;"><button class="btn btn-primary" id="pb-compare-mock-btn" onclick="pbRunCompareMock()">Load Safe Mock Answers</button></div><div id="pb-compare-status" aria-live="polite" style="margin-top:8px;font-size:13px;color:var(--text-secondary);"></div></div><div id="pb-compare-result"></div></div>';

      if (pbState.compareResult) {
        pbRenderCompareResult(document.getElementById('pb-compare-result'), pbState.compareResult);
      }
    }

    async function pbRunCompareMock() {
      const btn = document.getElementById('pb-compare-mock-btn');
      const status = document.getElementById('pb-compare-status');
      if (btn) btn.disabled = true;
      if (status) status.textContent = 'Running comparison...';
      const result = await apiPost('/api/compare', { candidates: null });
      if (btn) btn.disabled = false;
      if (result._err) { if (status) status.textContent = 'Error: ' + result._err; return; }
      pbState.compareResult = result;
      if (status) status.textContent = 'Comparison complete — local mocked data ✓';
      const d = document.getElementById('pb-compare-result');
      if (d) pbRenderCompareResult(d, result);
    }

    function pbRenderCompareResult(container, data) {
      const candidates = data.candidates || [];
      const winner = data.winner || null;
      container.innerHTML = '<div class="bento-card"><h3 style="font-size:15px;font-weight:800;margin-bottom:12px;">Comparison Results</h3>' +
        (winner ? '<p style="font-size:13px;margin-bottom:12px;">Winner: <strong>' + esc(winner) + '</strong></p>' : '') +
        (candidates.map(function(c) { return '<div style="background:var(--bg-body);border:1px solid var(--border-color);border-radius:var(--radius-md);padding:12px;margin-bottom:8px;"><div style="font-size:13px;font-weight:700;margin-bottom:6px;">' + esc(c.agent || c.id || 'Candidate') + '</div><div style="font-size:12px;color:var(--text-secondary);">Score: ' + esc(String(c.score == null ? 'UNKNOWN' : c.score)) + '</div>' + (c.gaps && c.gaps.length ? '<div style="font-size:12px;color:var(--warning-color);margin-top:4px;">Gaps: ' + c.gaps.map(function(g) { return esc(g); }).join(', ') + '</div>' : '') + '</div>'; }).join('') || '<p style="color:var(--text-muted);">No comparison data returned.</p>') +
        '</div>';
    }

  </script>
</body>
</html>
